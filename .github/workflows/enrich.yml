name: Enrich OpenAPI specs for Document360

on:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - "tools/enrich_openapi.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate dist/
        run: python3 tools/enrich_openapi.py . dist

      - name: Commit enriched specs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist/ unchanged - nothing to commit"
          else
            git commit -m "chore: regenerate enriched specs in dist/ [skip ci]"
            git push
          fi
