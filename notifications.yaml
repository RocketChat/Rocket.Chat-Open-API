openapi: 3.0.0
info:
  version: 1.0.0
  title: Notifications
#  description: |- 
#    The Rocket.Chat notifications endpoints are as follows:
#    * **Banners**: Get and dismiss banners.
#    * **Push token**: Create and manage push tokens.
servers:
  - url: https://apiexplorer.support.rocket.chat
paths:
  '/api/v1/banners/{id}':
    parameters:
      - schema:
          type: string
        example: ByehQjC44FwMeiLbX
        name: id
        in: path
        required: true
        description: The banner ID.
    get:
      summary: Get Banner by ID
      tags:
        - Banners
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners:
                    type: array
                    items:
                      type: object
                      properties: {}
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    banners: []
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Params:
                  value:
                    success: false
                    error: 'must have required property ''platform'' [error-invalid-params]'
                    errorType: error-invalid-params
  
        '401':
          $ref: '#/components/responses/authorizationError'
      operationId: get-api-v1-banners-id
      description: Gets the banner to be shown to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
        - schema:
            type: string
          example: web
          in: query
          name: platform
          description: The platform rendering the banner.
          required: true
  /api/v1/banners:
    get:
      summary: Get Banners
      operationId: get-api-v1-banners
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners:
                    type: array
                    items:
                      type: object
                      properties: {}
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    banners: []
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Params:
                  value:
                    success: false
                    error: 'must have required property ''platform'' [error-invalid-params]'
                    errorType: error-invalid-params
  
        '401':
          $ref: '#/components/responses/authorizationError'
      description: Gets the banners to be shown to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
        - schema:
            type: string
          example: web
          in: query
          name: platform
          description: The platform rendering the banner
          required: true
      tags:
        - Banners
  /api/v1/banners.dismiss:
    post:
      summary: Dismiss a Banner
      operationId: post-api-v1-banners.dismiss
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Params:
                  value:
                    success: false
                    error: 'must have required property ''bannerId'' [error-invalid-params]'
                    errorType: error-invalid-params
  
        '401':
          $ref: '#/components/responses/authorizationError'
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bannerId:
                  type: string
                  description: The banner ID that you want to dismiss.
                  example: ByehQjC44FwMeiLbX
              required:
                - bannerId
            examples:
              Success:
                value:
                  bannerId: ByehQjC44FwMeiLbX
      tags:
        - Banners

  /api/v1/push.get:
    get:
      summary: Get Push Notification
      operationId: get-api-v1-push.get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: object
                        properties:
                          _id:
                            type: string
                          rid:
                            type: string
                          msg:
                            type: string
                          ts:
                            type: string
                          u:
                            type: object
                            properties:
                              _id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          urls:
                            type: array
                            items:
                              type: object
                              properties: {}
                          mentions:
                            type: array
                            items:
                              type: object
                              properties: {}
                          channels:
                            type: array
                            items:
                              type: object
                              properties: {}
                          md:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                value:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                      value:
                                        type: string
                          _updatedAt:
                            type: string
                      notification:
                        type: object
                        properties:
                          from:
                            type: string
                          badge:
                            type: integer
                          sound:
                            type: string
                          priority:
                            type: integer
                          title:
                            type: string
                          text:
                            type: string
                          payload:
                            type: object
                            properties:
                              host:
                                type: string
                              messageId:
                                type: string
                              notificationType:
                                type: string
                              rid:
                                type: string
                              sender:
                                type: object
                                properties:
                                  _id:
                                    type: string
                                  username:
                                    type: string
                                  name:
                                    type: string
                              senderName:
                                type: string
                              type:
                                type: string
                              name:
                                type: string
                          userId:
                            type: string
                          notId:
                            type: integer
                          gcm:
                            type: object
                            properties:
                              style:
                                type: string
                              image:
                                type: string
                          apn:
                            type: object
                            properties:
                              category:
                                type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    data:
                      message:
                        _id: WkbwSntxt8D3jLp8G
                        rid: iu7jtPAhvEeAS5tNq
                        msg: fsfs
                        ts: '2021-10-22T14:29:23.581Z'
                        u:
                          _id: d26x6zSkaPSe5gCyy
                          username: rodriq
                          name: Rodriq
                        urls: []
                        mentions: []
                        channels: []
                        md:
                          - type: PARAGRAPH
                            value:
                              - type: PLAIN_TEXT
                                value: fsfs
                        _updatedAt: '2021-10-22T14:29:23.603Z'
                      notification:
                        from: push
                        badge: 2
                        sound: default
                        priority: 10
                        title: '#vb'
                        text: 'rodriq: fsfs'
                        payload:
                          host: 'http://localhost:3000/'
                          messageId: WkbwSntxt8D3jLp8G
                          notificationType: message
                          rid: iu7jtPAhvEeAS5tNq
                          sender:
                            _id: d26x6zSkaPSe5gCyy
                            username: rodriq
                            name: Rodriq
                          senderName: rodriq
                          type: c
                          name: vb
                        userId: d26x6zSkaPSe5gCyy
                        notId: 654494840
                        gcm:
                          style: inbox
                          image: 'http://localhost:3000/images/logo/android-chrome-192x192.png'
                        apn:
                          category: MESSAGE
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Example:
                  value:
                    success: false
                    error: 'Match error: Missing key ''id'''
        '401':
          $ref: '#/components/responses/authorizationError'
      description: |-
        Get push notification for a message.
        ### Changelog
        | Version      | Description |
        | ---------------- | ------------|
        |3.5.0            | Added       |
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
        - schema:
            type: string
          example: WkbwSntxt8D3jLp8G
          in: query
          name: id
          description: The message ID.
          required: true
      tags:
        - Push Notifications
  /api/v1/push.token:
    delete:
      summary: Delete Push Token
      operationId: delete-api-v1-push.token
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Missing Token Parameter:
                  value:
                    success: false
                    error: must have required property 'token'
                    errorType: error-invalid-params
        '401':
          $ref: '#/components/responses/authorizationError'
        '404':
          description: Not Found. No push token with this value is registered, or it was already removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Not Found:
                  value:
                    success: false
                    error: Resource not found
      description: |-
        Removes push token from the workspace. When you remove a device token, the VoIP push tokens registered with the same login session are also removed. You can also remove a VoIP push token on its own by sending its value in `token`.
        ### Changelog
        | Version      | Description |
        | ---------------- | ------------|
        |9.0.0             | Removing a device token also removes the VoIP push tokens registered with the same login session. |
        |0.60.0            | Added       |
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The value of the device or VoIP push token to remove.
                  example: abc
              required:
                - token
            examples:
              Example:
                value:
                  token: abc
      tags:
        - Push Notifications
    post:
      summary: Create Push Token
      operationId: post-api-v1-push.token
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: The token record ID, generated by the server.
                      tokenType:
                        type: string
                        enum:
                          - apn
                          - gcm
                          - voip
                        description: The token type.
                      tokenValue:
                        type: string
                        description: The token value.
                      appName:
                        type: string
                        description: The application name associated with the token.
                      userId:
                        type: string
                        description: The ID of the user who registered the token.
                      enabled:
                        type: boolean
                        description: Whether the token is enabled.
                      createdAt:
                        type: string
                        description: The date and time when the token was first registered.
                      _updatedAt:
                        type: string
                        description: The date and time when the token was last updated.
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    result:
                      _id: 64b1f0c2a9e3d4b5c6d7e8f9
                      tokenType: gcm
                      tokenValue: TOKEN
                      appName: RocketAPP
                      userId: 52d5Rw8LT3TeDa59Z
                      enabled: true
                      createdAt: '2018-09-11T18:22:55.006Z'
                      _updatedAt: '2018-09-11T18:22:55.006Z'
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Missing Type Parameter:
                  value:
                    success: false
                    error: must have required property 'type'
                    errorType: error-invalid-params
                Missing Value Parameter:
                  value:
                    success: false
                    error: must have required property 'value'
                    errorType: error-invalid-params
                Missing App Name Parameter:
                  value:
                    success: false
                    error: must have required property 'appName'
                    errorType: error-invalid-params
                Invalid Type Parameter:
                  value:
                    success: false
                    error: must be equal to one of the allowed values
                    errorType: error-invalid-params
        '401':
          $ref: '#/components/responses/authorizationError'
      tags:
        - Push Notifications
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - apn
                    - gcm
                  description: The token type. The possible values are `apn` or `gcm`.
                  example: gcm
                value:
                  type: string
                  description: The token value.
                  example: TOKEN
                appName:
                  type: string
                  description: The name of the application to associate the token with.
                  example: MyApp
                voipToken:
                  type: string
                  description: Optional VoIP push token value. When `type` is `apn`, the workspace stores it as a separate VoIP push token for the same login session. When `type` is `gcm`, the workspace ignores it.
                  example: VOIP_TOKEN
              required:
                - type
                - value
                - appName
            examples:
              Example:
                value:
                  type: gcm
                  value: TOKEN
                  appName: MyApp
      description: |-
        Registers a push notification token for the authenticated user's device. The response returns the token as flat `tokenType` and `tokenValue` fields.

        If the token is already registered, the workspace updates the existing record and returns the same `_id` with a new `_updatedAt` value. Registering a new token of the same type in the same login session replaces the previous token of that type.

        ### Changelog
        | Version      | Description |
        | ---------------- | ------------|
        |9.0.0             | Replaced the nested `token` object in the response with the `tokenType` and `tokenValue` fields. |
        |9.0.0             | Changed `voipToken` handling. For `apn` tokens, the workspace stores it as a separate VoIP push token. |
        |0.60.0            | Added       |
  /api/v1/push.info:
    get:
      summary: Get Push Info
      tags:
        - Push Notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushGatewayEnabled:
                    type: boolean
                  defaultPushGateway:
                    type: boolean
                  success:
                    type: boolean
              examples:
                Example 1:
                  value:
                    pushGatewayEnabled: true
                    defaultPushGateway: true
                    success: true
        '401':
          $ref: '#/components/responses/authorizationError'
      operationId: get-api-v1-push.info
      description: This endpoint returns the status of push gateway in your workspace.
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
  /api/v1/push.test:
    post:
      summary: Test Push Notifications
      tags:
        - Push Notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokensCount:
                    type: integer
                    description: The number of devices to which the test notification was sent.
                  message:
                    type: string
                    description: The translation key for the test result message.
                  params:
                    type: array
                    description: Values used to format the translated result message.
                    items:
                      type: integer
                  success:
                    type: boolean
                required:
                  - tokensCount
                  - message
                  - params
                  - success
              examples:
                Example 1:
                  value:
                    tokensCount: 1
                    message: Your_push_was_sent_to_s_devices
                    params:
                      - 1
                    success: true
        '401':
          $ref: '#/components/responses/authorizationError'
      operationId: post-api-v1-push.test
      description: |-
        Use this endpoint to test the push notifications configuration. The response indicates how many registered devices received the test notification.

        To test successfully, make sure that you have logged into the workspace on the Rocket.Chat mobile app. By default, one request is allowed every 1000 milliseconds.

        **Permission required**:
        - `test-push-notifications`

        ### Changelog
        | Version      | Description |
        | ---------------- | ------------|
        |8.8.0            | Added the `message` and `params` response fields. |
      parameters:
        - $ref: '#/components/parameters/X-Auth-Token'
        - $ref: '#/components/parameters/X-User-Id'
tags:
  - name: Push Notifications
  - name: Banners
components:
  parameters:
    X-Auth-Token:
      name: X-Auth-Token
      in: header
      required: true
      schema:
        type: string
      example: 9HqLlyZOugoStsXCUfD_0YdwnNnunAJF8V47U3QHXSq
      description: The authorization token of the user.
    X-User-Id:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
      example: aobEdbYhXfu5hkeqG
      description: The user ID of the user.
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      example: 50
      description: >-
        How many items to skip before this page. Use a non-negative integer. Endpoints that validate their query parameters reject negative or fractional values. Refer to the <a href="https://developer.rocket.chat/apidocs/query-parameters#pagination" target="_blank">official documentation</a> to learn more.
    count:
      name: count
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      example: 50
      description: >-
        How many items to return. Use a non-negative integer. Endpoints that validate their query parameters reject negative or fractional values. Each workspace sets a maximum page size (`API_Upper_Count_Limit`) and lowers any larger value to it, so a response can hold fewer items than requested. Page by the number of items returned. When omitted, the workspace default page size (`API_Default_Count`) is used. `0` returns every item if `API_Allow_Infinite_Count` is enabled, and the default page size otherwise. Refer to the <a href="https://developer.rocket.chat/apidocs/query-parameters#pagination" target="_blank">official documentation</a> to learn more.
    sort:
      name: sort
      in: query
      required: false
      schema: {}
      description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, {"value": -1, "_id": 1}. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
    query:
      name: query
      in: query
      required: false
      schema: {}
      description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": `query={ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
    fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
      description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: `fields={ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
  responses:
    authorizationError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
          examples:
            Authorization Error:
              value:
                success: false
                error: You must be logged in to do this.

    trueSuccess:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
          examples:
            Success Example:
              value:
                success: true

