        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId:
                  type: string
                  description: The channel's ID. Provide either `channelId` or `channelName`, but not both.
                channelName:
                  type: string
                  description: The channel's name. Provide either `channelName` or `channelId`, but not both.
              oneOf:
                - required:
                    - channelId
                - required:
                    - channelName
            examples:
              Convert channel by ID:
                value:
                  channelId: 6513afeda2f73c7460e18c86
              Convert channel by name:
                value:
                  channelName: messages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
