                        ro:
                          type: boolean
                        sysMes:
                          type: boolean
                        _updatedAt:
                          type: string
                  offset:
                    type: integer
                  count:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    groups:
                      - _id: ByehQjC44FwMeiLbX
                        name: test-test
                        t: p
                        msgs: 0
                        u:
