  /api/v1/groups.create:
    post:
      tags:
        - Groups
      summary: Create Group
      description: |-
        Create a new private channel, optionally including specified users. Refer to the <a href='https://docs.rocket.chat/docs/channels' target='_blank'>Channels</a> documents for information on the available room options.
        
        The following permissions are required:
        * `create-p`: This permission is required to create a private channel.
        * `create-team-group`: This permission is required if you want to create a private channel from an existing team.
        * `create-abac-managed-room`: This permission is required if you send `abacAttributes`.
        
        While **Enforce ABAC across all workspace rooms** is on, new private channels must be ABAC-managed and carry every attribute listed in **Attributes required in all ABAC rooms**.
        
        ### Changelog
        | Version | Description                                                                                 |
        | ------- | ------------------------------------------------------------------------------------------- |
        | 9.0.0   | Added the `extraData.xmppFederated` parameter.                                              |
        | 9.0.0   | Added the `abacAttributes` parameter and the `skippedMembers` response field.               |
        | 8.8.0   | Added support for enforcing end-to-end encryption when creating private rooms.             |
        | 6.4.1   | Added `excludeSelf` param                                                                   |
        | 0.35.0  | Added                                                                                       |
      operationId: post-api-v1-groups.create
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the new private group.
                  example: groupname
                readOnly:
                  type: boolean
                  description: Set if the private channel is read-only or not. The default value is false.
                  example: false
                members:
                  type: array
                  description: The users to add to the private channel when it is created.
                  items:
                    type: string
                    example: rocket.cat
                excludeSelf:
                  type: boolean
                  description: If set to true, the user calling the endpoint is not added as a member of the private channel. The default value is false.
                  example: false
                customFields:
                  type: object
                  description: |-
                   You add custom fields for private rooms using this parameter. Enter the key and value that you want to associate with this room. For example, `{ "company": "sell-and-more" }`. The custom fields are not displayed in the workspace UI.
                abacAttributes:
                  type: object
                  description: |-
                    Optional. Creates the private channel as an ABAC-managed room with these attributes. Map of attribute keys to the values to assign, for example `{ "clearance": ["secret"] }`. Keys and values can contain letters, digits, `_` and `-`. Use 1 to 10 keys, each with 1 to 10 unique values.
                    Requires ABAC to be enabled and the `create-abac-managed-room` permission. You can only assign values returned by `GET /api/v1/abac/attributes.listAssignable`. You must meet the attributes yourself; otherwise the request fails with `error-abac-creator-not-admitted` and no room is created. A value outside the values you are offered returns `error-abac-invalid-attributes`. Members who do not meet the attributes are not added and are listed in `skippedMembers`.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    clearance:
                      - secret
                extraData:
                  type: object
                  description: |-
                    Enter the following details for the object:
                    
                    Note: For more information, see <a href="https://docs.rocket.chat/docs/channels" target="_blank">Channels</a>.
                  properties:
                    broadcast:
                      type: boolean
                      description: Whether the group should be a broadcast group. False by default.
                    encrypted:
                      type: boolean
                      description: Whether the private room should use end-to-end encryption. When **Force end-to-end encryption on private rooms** is enabled, omit this field or set it to `true`. Setting it to `false` returns the `error-encrypted-private-rooms-enforced` error. Federated private rooms are exempt from this policy.
                    teamId:
                      type: string
                      description: Enter the team ID for which you want to create a group. You will get an error if the team does not exist.
                    xmppFederated:
                      type: boolean
                      description: |-
                        Set to `true` to create the private channel as an XMPP federated room that users on remote XMPP servers can join. Its XMPP address is built from the private channel name, the MUC subdomain, and the domain set for the native XMPP server.
                        The native XMPP server must be enabled with a valid domain. Otherwise, the request fails with `error-xmpp-federation-disabled`. You can't combine it with `federated`, `encrypted`, `broadcast`, or `readOnly`; the request fails with `error-xmpp-room-options-not-allowed`. With `abacAttributes`, the request fails with `error-abac-federated-room-attributes`.
                        The created private channel is returned with an `xmppFederation` object that holds its XMPP address in `muc`.
                        <!-- TODO: confirm the license requirement (federation module) for extraData.xmppFederated and the response when the workspace has no such license. -->
                      example: true
              required:
                - name
            examples:
              Example:
                value:
                  name: groupname
                  members:
                    - rocket.cat
                  readOnly: true
                  excludeSelf: true
                  customFields:
                    type: default
                  extraData:
                    broadcast: true
                    encrypted: true
                    teamId: 658441562dd9f928ad9951aa
              ABAC-managed private channel:
                value:
                  name: secret-projects
                  members:
                    - jane.doe
                    - john.roe
                  abacAttributes:
                    clearance:
                      - secret
              XMPP federated private channel:
                value:
                  name: xmpp-private
                  extraData:
                    xmppFederated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                      usersCount:
                        type: integer
                      abacAttributes:
                        type: array
                        description: The room's ABAC attributes. Returned when the private channel was created with `abacAttributes`.
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            values:
                              type: array
                              items:
                                type: string
                      xmppFederation:
                        $ref: '#/components/schemas/XmppFederation'
                  skippedMembers:
                    type: array
                    description: Usernames of the requested members who were not added because they do not meet the room's ABAC attributes. Returned only when `abacAttributes` was sent and at least one member was skipped.
                    items:
                      type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    group:
                      _id: NtR6RQ7NvzA9ejecX
                      name: testing
                      t: p
                      msgs: 0
                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: tester
                      ts: '2016-12-09T16:53:06.761Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2016-12-09T16:53:06.761Z'
                    success: true
                ABAC-managed private channel:
                  value:
                    group:
                      _id: 6720f1a3c4d5e6f7a8b9c0d1
                      name: secret-projects
                      t: p
                      msgs: 0
                      usersCount: 1
                      u:
                        _id: aB3dE5fG7hJ9kL1mN
                        username: jane.doe
                      ts: '2026-10-28T15:20:11.402Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2026-10-28T15:20:11.402Z'
                      abacAttributes:
                        - key: department
                          values:
                            - engineering
                    skippedMembers:
                      - john.roe
                      - max.poe
                    success: true
                XMPP federated private channel:
                  value:
                    group:
                      _id: Hn4WcV8sQe2YtJ6aR
                      name: xmpp-private
                      t: p
                      msgs: 0
                      usersCount: 1
                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: tester
                      ts: '2026-10-29T13:06:40.118Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2026-10-29T13:06:40.190Z'
                      xmppFederation:
                        version: 1
                        role: host-muc
                        muc: xmpp-private@conference.chat.example.com
                        origin: chat.example.com
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    description: Present only when a specific attribute or cause is at fault.
              examples:
                Name is required:
                  value:
                    success: false
                    error: Body param "name" is required
                Private room encryption is enforced:
                  value:
                    success: false
                    error: 'Workspace policy requires all private rooms to be encrypted. [error-encrypted-private-rooms-enforced]'
                    errorType: error-encrypted-private-rooms-enforced
                ABAC not enabled:
                  value:
                    success: false
                    error: error-abac-not-enabled
                    errorType: error-abac-not-enabled
                ABAC attributes not allowed:
                  value:
                    success: false
                    error: error-abac-attributes-not-allowed
                    errorType: error-abac-attributes-not-allowed
                ABAC value not assignable:
                  value:
                    success: false
                    error: error-abac-attribute-not-assignable
                    errorType: error-abac-attribute-not-assignable
                    details:
                      cause: error-invalid-attribute-values
                      attributes:
                        - key: clearance
                          values:
                            - topsecret
                Creator does not meet the ABAC attributes:
                  value:
                    success: false
                    error: error-abac-creator-not-admitted
                    errorType: error-abac-creator-not-admitted
                    details:
                      cause: error-only-compliant-users-can-be-added-to-abac-rooms
                Invalid ABAC attribute values:
                  value:
                    success: false
                    error: error-abac-invalid-attributes
                    errorType: error-abac-invalid-attributes
                    details:
                      cause: error-invalid-attribute-values
                Required ABAC attributes missing:
                  value:
                    success: false
                    error: error-abac-attributes-required
                    errorType: error-abac-attributes-required
                XMPP federation not enabled:
                  value:
                    success: false
                    error: XMPP federation is not enabled [error-xmpp-federation-disabled]
                    errorType: error-xmpp-federation-disabled
        '401':
          $ref: '#/components/responses/authorizationError'
