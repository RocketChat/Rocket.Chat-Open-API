      operationId: post-api-v1-rooms.mediaConfirm-rid-fileId
      description: |-
        Use this endpoint to send an uploaded file to a room. You can use this endpoint only after calling the <a href='https://developer.rocket.chat/apidocs/upload-media-files-to-a-room' target='_blank'>Upload Media Files to a Room</a> endpoint and getting the file ID.
 
        Call it within 24 hours of the upload, using the same user account and room that uploaded the file. Otherwise, the request fails with `invalid-file`.
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Enter a file description. 
                  example: file description
                fileName:
                  type: string
                  description: Overrides the file name stored during upload.
                  example: renamed-file.jpg
                fileContent:
                  type: object
                  description: Overrides the file content stored during upload.
                emoji:
                  type: string
                  description: The emoji you enter will be displayed as the avatar when the message is sent.
                  example: ':one:'
                groupable:
                  type: boolean
                  description: Whether or not multiple messages can be grouped.
                msg:
                  type: string
                  description: Enter a message to be sent with the file.
                  example: hello world
                tmid:
                  type: string
                  description: 'If you want to send the file to a thread, enter the thread ID here.'
                  example: ZSnsznbWKqppnRny5
                avatar:
                  type: string
                  description: Enter the avatar that will be displayed when the message is sent. You need the `message-impersonate` permission.
                  example: 'https://picsum.photos/200'
                alias:
                  type: string
                  description: Enter the alias that will be used instead of your username when sending the message. You need the `message-impersonate` permission.
                  example: test user
                customFields:
                  type: string
                  description: Enter custom fields if you have defined them in the <a href='https://docs.rocket.chat/docs/message' target='_blank'>Message</a> settings.
                  example: '{\"priority\": \"low\"}'
