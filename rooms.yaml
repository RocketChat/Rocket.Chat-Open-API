      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  required: ["roomId"]
                  properties:
                    roomId:
                      type: string
                      description: The room ID.
                - type: object
                  required: ["firstUnreadMessage"]
                  properties:
                    firstUnreadMessage:
                      type: object
                      required: [" _id"]
                      properties:
                        _id:
                          type: string
                          description: The message ID.

            examples:
              Example :
                value:
                  roomId: L6su9mxwdDkvdSaT9hvzu8z6mHFigiXy6Y
              Example 2:
                value:
                  firstUnreadMessage:
                    _id: L6su9mxwdDkvdSaT9hvzu8z6mHFigiXy6Y
        description: ''
      description: |-
        Mark messages as unread by room ID or from a message. 
        ### Changelog
        | Version      | Description |
        | ---------------- | ------------|
        |0.65.0            | Added       |
      tags:
        - Subscriptions

tags:
  - name: Channels
  - name: Directory
  - name: Groups
  - name: Rooms
  - name: Teams
  - name: Room Invites
  - name: Subscriptions
  - name: ABAC

components:
  schemas:
    Attachment:
      type: object
      properties:
        ts:
          type: string
          example: 1970-01-01T00:00:00.000Z
        title:
          type: string
        title_link:
          type: string
        title_link_download:
          type: boolean
        image_dimensions:
          type: object
          properties:
            width:
              type: integer
              example: 444
            height:
              type: integer
              example: 360
        image_preview:
          type: string
          example: /9j/2wBDAAYEBQ...
        image_url:
          type: string
          example: /file-upload/PNTaE9SBQasdpAwk2/img_1.jpg
        image_type:
          type: string
          example: image/jpeg
        image_size:
          type: integer
          example: 26674
        type:
          type: string
          example: file
        description:
          type: string
          example: ''
    Subscription:
      type: object
      properties:
        _id:
          type: string
        open:
          type: boolean
        alert:
          type: boolean
        unread:
          type: integer
        userMentions:
          type: integer
        groupMentions:
          type: integer
        ts:
          type: string
        rid:
          type: string
        name:
          type: string
        fname:
          type: string
          nullable: true
        t:
          type: string
        u:
          type: object
          properties:
            _id:
              type: string
            username:
              type: string
            name:
              type: string
        _updatedAt:
          type: string
        ls:
          type: string
        E2EKey:
          type: string
        draft:
          type: string
          description: The unfinished message draft for the room.
        threadDrafts:
          type: object
          description: The unfinished thread reply drafts, keyed by the ID of each thread's main message.
          additionalProperties:
            type: string
    XmppFederation:
      type: object
      description: XMPP federation details of a room created with `extraData.xmppFederated` set to `true`. Returned only for XMPP federated rooms.
      properties:
        version:
          type: integer
          description: The version of the XMPP federation data.
          example: 1
        role:
          type: string
          description: The workspace's role for the room. Rooms created on this workspace have the `host-muc` role.
          example: host-muc
        muc:
          type: string
          description: The room's XMPP address, built as `<room name>@<MUC subdomain>.<XMPP domain>`.
          example: xmpp-public@conference.chat.example.com
        origin:
          type: string
          description: The XMPP domain of the server that hosts the room.
          example: chat.example.com
  parameters:
    Optional-RoomId:
      name: roomId
      in: query
      description: The room ID. It is required if the `roomName` is not provided.
      schema:
        type: string
      example: dlpfuijw7ej
    Optional-RoomName:
      name: roomName
      in: query
      description: The room name.  It is required if the `roomId` is not provided.
      required: false
      schema:
        type: string
      example: general
    RoomId:
      name: roomId
      in: query
      description: The room id.
      required: true
      schema:
        type: string
      example: jdiue8TGkodp
    Optional-TeamId:
      name: teamId
      in: query
      description: The team id.  It is required if the `teamName` is not provided.
      schema:
        type: string
      example: 63f3efc4b000b6b6d86704b2
    Optional-TeamName:
      name: teamName
      in: query
      description: The team name.  It is required if the `teamId` is not provided.
      required: false
      schema:
        type: string
      example: livestream
    offset:
      name: offset
      in: query
      description: >-
        How many items to skip before this page. Use a non-negative integer. Endpoints that validate their query parameters reject negative or fractional values. Refer to the <a href="https://developer.rocket.chat/apidocs/query-parameters#pagination" target="_blank">official documentation</a> to learn more.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 50
    count:
      name: count
      in: query
      description: >-
        How many items to return. Use a non-negative integer. Endpoints that validate their query parameters reject negative or fractional values. Each workspace sets a maximum page size (`API_Upper_Count_Limit`) and lowers any larger value to it, so a response can hold fewer items than requested. Page by the number of items returned. When omitted, the workspace default page size (`API_Default_Count`) is used. `0` returns every item if `API_Allow_Infinite_Count` is enabled, and the default page size otherwise. Refer to the <a href="https://developer.rocket.chat/apidocs/query-parameters#pagination" target="_blank">official documentation</a> to learn more.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 50
    sort:
      name: sort
      in: query
      description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, {"value": -1, "_id": 1}. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
      required: false
      schema: { }
    query:
      name: query
      in: query
      description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": `query={ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      required: false
      schema: { }
    fields:
      name: fields
      in: query
      description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: `fields={ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      required: false
      schema:
        type: string
    Auth-Token:
      name: X-Auth-Token
      in: header
      description: The `authToken` of the authenticated user.
      required: true
      schema:
        type: string
      example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
    UserId:
      name: X-User-Id
      in: header
      description: The `userId` of the authenticated user.
      required: true
      schema:
        type: string
      example: rbAXPnMktTFbNpwtJ
    filterName:
      name: name
      in: query
      description: The name of the file to search for.
      schema:
        type: string
      example: logo
    filterTypeGroup:
      name: typeGroup
      in: query
      description: |-
        Filter results by the type of file. Available options:
        - `all`: Return all file types.
        - `image`: Filter by image files.
        - `video`: Filter by video files.
        - `audio`: Filter by audio files.
        - `text`: Filter by text documents.
        - `application`: Filter by other file types.
      schema:
        type: string
      example: images
  responses:
    trueSuccess:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
          examples:
            Success:
              value:
                success: true
    authorizationError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
          examples:
            Authorization Error:
              value:
                success: false
                error: You must be logged in to do this.

    forbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
          examples:
            Permission Error:
              value:
                success: false
                error: 'User does not have the permissions required for this action [error-unauthorized]'
