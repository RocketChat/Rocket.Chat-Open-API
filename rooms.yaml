  /api/v1/groups.online:
    get:
      tags:
        - Groups
      summary: Get Group Online Users
      description: |-
        Lists all online users of a particular group (private channel). You will not be able to view the users if you are not a member of this private channel, unless you have admin permissions.
        
        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Removed the `query` parameter. The `_id` parameter is required. |
        | 0.52.0  | Added       |
        |7.0.0   | Replaced `query` parameter with `_id` parameter       |        
      operationId: get-api-v1-groups.online
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
        - name: _id
          in: query
          description: |-
            Enter the group's ID. You can find list of groups IDs using any of the following endpoints:
            * <a href='https://developer.rocket.chat/apidocs/get-list-of-user-groups' target='_blank'>Get List of User Groups</a>: This endpoint returns all private channels in the workspace, if you have the required permissions to view them.
            * <a href='https://developer.rocket.chat/apidocs/get-groups' target='_blank'>Get Groups</a>: This endpoint returns the private channels that you are a member of.
          required: true
          schema:
            type: string
            example: "5HmCfpoB7jp2uibTC"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  online:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        username:
                          type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    online:
                      - _id: 47cRd58HnWwpqxhaZ
                        username: test
                      - _id: BsxzC22xQ43taWdff
                        username: uniqueusername
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Error if you are not a member of the private channel:
                  value:
                    success: false
                    error: 'Not Allowed [error-not-allowed]'
                    errorType: error-not-allowed
                Invalid or missing query parameter:
                  value:
                    success: false
                    error: Invalid query
        '401':
          $ref: '#/components/responses/authorizationError'
