  /api/v1/rooms.images:
    get:
      tags:
        - Rooms
      summary: Get Room Images
      description: |-
        Retrieves the images of a room that you are a member of.

        Images uploaded on version 9.0.0 or later return `path` as `/file-upload/<fileId>/<fileName>` and `url` as the absolute form of the same link. Legacy `/ufs` links no longer return the file; the request returns the web client instead.

