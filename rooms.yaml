  /api/v1/teams.delete:
    post:
      tags:
        - Teams
      summary: Delete a Team
      description: |-
        Removes a team. 
        
        Permission required: `delete-team`

        The deletion completes even if the team's main room no longer exists, for example after an interrupted deletion. In that case, the main room is skipped, the team is removed, and the team name becomes available again. You can retry an interrupted deletion with this endpoint.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 8.9.0   | Succeeds when the main room is missing. |
        | 3.13.0  | Added |
      operationId: post-api-v1-teams.delete
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamName:
                  type: string
                  description: Enter the team name. This parameter is required if `teamId` is not provided.
                teamId:
                  type: string
                  description: Enter the team ID. This parameter is required if `teamName` is not provided.
                roomsToRemove:
                  type: array
                  description: The room IDs to delete along with the team.
                  items:
                    type: string
                    example: "8dugqGhuRvCBLdZft"
            examples:
              Example:
                value:
                  teamId: mLGZGywfmLGZGywf
                  roomsToRemove:
                    - 8dugqGhuRvCBLdZft
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '401':
          $ref: '#/components/responses/authorizationError'
