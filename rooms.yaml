  /api/v1/channels.setType:
    post:
      tags:
        - Channels
      summary: Set Channel Type
      description: |-
        Set the channel type. The channel type can be either `c` (public) or `p` (private). The following permissions are required:
        * `create-c`: To change a private group to a public channel.
        * `create-p`: To change a public channel to a private room.

        For ABAC-managed private rooms, changing the type from `p` to `c` is rejected with `error-action-not-allowed`.
        When the type changes to `c` (public) and the room has ABAC attributes, all ABAC attributes on the room are cleared as part of the conversion.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 8.5.0   | Added ABAC behavior for `p` -> `c`: ABAC-managed private rooms are rejected, and successful conversions to public clear room ABAC attributes. |
        | 0.49.0  | Added       |
      operationId: post-api-v1-channels.setType
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel's ID. Alternatively, enter the `channelName` parameter and provide the channel's name as the value.
                type:
                  type: string
                  description: |-
                    The channel's type. The type of room this channel should be, either c or p. 
                    
                    `c` is for channel and `p` is for private.
              required:
                - roomId
                - type
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  type: p
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                      usernames:
                        type: array
                        items:
                          type: string
                      joinCodeRequired:
                        type: boolean
                      muted:
                        type: array
                        items:
                          type: object
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      name: testing0
                      t: p
                      msgs: 0
                      u:
                        _id: aiPqNoGkjpNDiRx6d
                        username: goose160
                      ts: '2017-01-05T18:02:50.754Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2017-01-05T19:02:24.429Z'
                      usernames:
                        - goose160
                        - graywolf336
                      joinCodeRequired: true
                      muted: [ ]
                    success: true
        '401':
          $ref: '#/components/responses/authorizationError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      action:
                        type: string
              examples:
                ABAC-managed room conversion blocked:
                  value:
                    success: false
                    error: 'Changing an ABAC managed private room to public is not allowed [error-action-not-allowed]'
                    errorType: error-action-not-allowed
                    details:
                      method: saveRoomSettings
                      action: Change_Room_Type

