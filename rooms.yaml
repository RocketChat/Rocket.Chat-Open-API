                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: testing1
                      msgs: 1
                      _updatedAt: '2016-12-09T12:50:51.575Z'
                      lm: '2016-12-09T12:50:51.555Z'
                    success: true
        '400':
