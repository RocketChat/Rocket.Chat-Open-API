  /api/v1/teams.convertToChannel:
    post:
      tags:
        - Teams
      summary: Convert Team to Channel
      description: |-
        Convert a team to a channel. Permission required: `convert-team`
        
        The team's main room loses its ABAC attributes in this operation. The removal is recorded in the ABAC audit log as an `abac.object.attributes.removed` event for the room, with `reason` `api` and `change` `all-deleted`. If the team room has attributes, you also need the `abac-management` and `manage-abac-admin-rooms` permissions or `edit-room-abac-attributes` in the team room. Otherwise the request fails with `error-abac-not-authorized-to-modify-room` before anything changes.
        Rooms that leave the team keep their attributes.
        <!-- TODO: Confirm the HTTP status and response body (error and errorType) returned for error-abac-not-authorized-to-modify-room on this endpoint. -->

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Converting a team to a channel removes the team room's ABAC attributes. |
        <!-- TODO: Add the row for the version that introduced this endpoint (the "Added" row is missing from this changelog). -->
      operationId: post-api-v1-teams.convertToChannel
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The team ID that you want to convert to a channel.
              required:
                - teamId
            examples:
              Example:
                value:
                  teamId: 612b8ae982d286c3d1f5db31
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Invalid Team Id:
                  value:
                    success: false
                    error: team-does-not-exist
                Team Id or Team name is required:
                  value:
                    success: false
                    error: missing-teamId-or-teamName
        '401':
          $ref: '#/components/responses/authorizationError'

