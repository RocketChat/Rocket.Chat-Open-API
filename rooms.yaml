  /api/v1/groups.convertToTeam:
    post:
      tags:
        - Groups
      summary: Convert a Group to Team
      description: |-
        Convert a private channel to a team. Permissions required: `create-team`, `edit-room`
        
        The private channel loses its ABAC attributes in this operation. The removal is recorded in the ABAC audit log as an `abac.object.attributes.removed` event for the room, with `reason` `api` and `change` `all-deleted`. If the channel has attributes, you also need the `abac-management` and `manage-abac-admin-rooms` permissions or `edit-room-abac-attributes` in the channel. Otherwise the request fails with `error-abac-not-authorized-to-modify-room` before anything changes.
        If you are not a member of the private channel, the request fails with `error-room-not-found`, even with administrator permissions.
        <!-- TODO: Confirm the HTTP status and response body (error and errorType) returned for error-abac-not-authorized-to-modify-room on this endpoint. -->

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Converting a private channel to a team removes its ABAC attributes. |
        | 3.13.0  | Added       |
      operationId: post-api-v1-groups.convertToTeam
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
              properties:
                roomId:
                  type: string
                  description: Enter the private channel that you want to convert to a private team.
                  example: JZ8Y2dLfYhsg323Rf
            examples:
              Example 1:
                value:
                  roomId: JZ8Y2dLfYhsg323Rf
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _updatedAt:
                        type: string
                      roomId:
                        type: string
                  success:
                    type: boolean
              examples:
                Success:             
                  value:
                    team:
                      _id: 6172b15bc563fc000acc462e
                      name: ddd
                      type: 1
                      createdAt: '2021-10-22T12:40:59.928Z'
                      createdBy:
                        _id: d26x6zSkaPSe5gCyy
                        username: rod
                      _updatedAt: '2021-10-22T12:40:59.928Z'
                      roomId: h3HLZkQdrWCPg2RN7
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Team name exists:
                  value:
                    success: false
                    error: team-name-already-exists
                Room ID is required:
                  value:
                    success: false
                    error: |-
                      must have required property 'roomId'
                       must have required property 'roomName'
                       must match exactly one schema in oneOf
                    errorType: error-invalid-params
                Room not found:
                  value:
                    success: false
                    error: 'The required "roomId" or "roomName" param provided does not match any group [error-room-not-found]'
                    errorType: error-room-not-found
        '401':
          $ref: '#/components/responses/authorizationError'

