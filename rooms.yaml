      operationId: get-abac-audit
      description: |-
        <div style="text-align: center; margin: 1rem 0 1rem 0;"><img src="https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Defense.svg" alt="Defense" style="display: block; margin: auto"></div>

        - Lists ABAC audit events.
        - Returns a paginated audit log of ABAC-related actions (attribute changes, room attribute changes/removals, ABAC actions, and membership previews), filterable by time range (`start`, `end`) and optional `actor`, with optional sorting.
        - Membership previews are recorded only for successful new room previews from `POST /api/v1/abac/rooms.evaluateMembership`. Existing room previews and failed requests are not recorded.
        - Requires the ABAC and Auditing licenses, the `abac-management` and `view-abac-admin-audit` permissions.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Added the `abac.membership.evaluated` event, recorded by `POST /api/v1/abac/rooms.evaluateMembership`. |
        | 8.0.0   | Added |
        | 8.5.0   | Added the `view-abac-admin-audit` granular permission requirement. |
      parameters:
        - schema:
            type: string
          in: query
          name: start
          description: start of time range (defaults to epoch if omitted)
        - schema:
            type: string
          in: query
          name: end
          description: end of time range (defaults to now if omitted)
        - schema:
            type: string
          in: query
          description: Filter by actor fields
          name: actor
        - schema:
            type: number
          in: query
          name: offset
          description: Pagination offset (default 0)
        - schema:
            type: number
          in: query
          name: count
          description: Page size (default 25)
        - schema:
            type: string
          in: query
          name: sort
          description: 'Sorting, typically { "ts": -1 } or { "ts": 1 }'
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
    parameters: []
  /api/v1/abac/pdp/health:
    get:
      tags:
        - ABAC
      summary: Get PDP Health Status
      description: |-
        <div style="text-align: center; margin: 1rem 0 1rem 0;"><img src="https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Defense.svg" alt="Defense" style="display: block; margin: auto"></div>

        Checks the health and availability of the configured Policy Decision Point (PDP)
        for Attribute-Based Access Control (ABAC).

        This endpoint is used by administrators to verify that the external PDP service
        is operational and properly configured. It includes rate limiting to prevent abuse.

        Permissions required: `abac-management` and `manage-abac-admin-settings`.

        ### Changelog
        | Version | Description |
        |---------|--------|
        | 8.0.0   | Added |
        | 8.5.0   | Added the `manage-abac-admin-settings` granular permission requirement. |
        | 8.4.0   | Added endpoint to check external PDP health status |
      operationId: get-abac-pdp-health
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK - PDP is available and healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Indicates whether the PDP is available.
                    enum: [true]
                  message:
                    type: string
                    description: Health check message.
                  success:
                    type: boolean
                    description: Indicates if the request was successful.
              examples:
                PDP Healthy:
                  value:
                    available: true
                    message: ABAC_PDP_Health_OK
                    success: true
        '400':
          description: Bad Request - PDP is unavailable or unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Indicates whether the PDP is available.
                    enum: [false]
                  message:
                    type: string
                    description: Error message describing why the PDP is unavailable.
                  success:
                    type: boolean
                    description: Indicates if the request was successful.
              examples:
                PDP Unavailable:
                  value:
                    available: false
                    message: ABAC_PDP_Health_Not_OK
                    success: false
                Connection Error:
                  value:
                    available: false
                    message: Failed to connect to external PDP service
                    success: false
        '401':
          $ref: '#/components/responses/authorizationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: You do not have permission to manage ABAC
