  /api/v1/rooms.createDiscussion:
    post:
      tags:
        - Rooms
      summary: Create Discussion
      # DoneDone: unverified: app exemption from the membership check could not be exercised (TC-09, no installed app creates discussions); confirm with API owner
      description: |-
        Creates a new discussion for the room. It requires at least one of the following permissions: `start-discussion` OR `start-discussion-other-user`, AND must be with the following setting enabled: `Discussion_enabled`.

        When **Force end-to-end encryption on private rooms** is enabled, you cannot create a discussion under an unencrypted private room. Make the parent room public or enable encryption on it before creating the discussion.

        You must be a member of the parent room to create a discussion in it, including in public channels. This also applies to admins. Apps are exempt from this check.

        ### Changelog
        | Version | Description                                                                                   |
        | ------- | --------------------------------------------------------------------------------------------- |
        | 9.0.0   | Added a parent room membership check, including for public channels. Non-members receive the `error-user-not-in-room` error. |
        | 8.8.0   | Added forced encryption checks for private-room discussions.                                      |
        | 1.0.0   | Added                                                                                         |
      operationId: post-api-v1-rooms.createDiscussion
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prid:
                  type: string
                  description: Parent room ID of the discussion.
                t_name:
                  type: string
                  description: Discussion name.
                users:
                  type: array
                  items:
                    type: string
                  description: 'Array of users to join in the discussion, if not provided, it will be an empty array. (Note: if provided, it must be an array).'
                pmid:
                  type: string
                  description: Parent message ID (if the discussion comes from a message).
                reply:
                  type: string
                  description: The reply of the discussion.
              required:
                - prid
                - t_name
            examples:
              Example:
                value:
                  prid: GENERAL
                  t_name: Discussion Name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  discussion:
                    type: object
                    properties:
                      rid:
                        type: string
                      name:
                        type: string
                      fname:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      topic:
                        type: string
                      prid:
                        type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      sysMes:
                        type: boolean
                      default:
                        type: boolean
                      _updatedAt:
                        type: string
                      _id:
                        type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    discussion:
                      rid: cgk88DHLHexwMaFWh
                      name: WJNEAM7W45wRYitHo
                      fname: Discussion Name
                      t: p
                      msgs: 0
                      usersCount: 0
                      u:
                        _id: rocketchat.internal.admin.test
                        username: rocketchat.internal.admin.test
                      topic: general
                      prid: GENERAL
                      ts: '2019-04-03T01:35:32.271Z'
                      ro: false
