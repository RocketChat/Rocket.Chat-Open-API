  /api/v1/groups.list:
    get:
      tags:
        - Groups
      summary: Get Groups
      description: |-
        Lists all the private channels you are a member of.
        
        ### Changelog
        | Version | Description                                  |
        | ------- | -------------------------------------------- |
        | 0.67.0  | Removed `query` parameter support.           |
        | 0.62.0  | Add `query` parameter support.               |
        | 0.49.0  | Count and offset query parameters supported. |
        | 0.33.0  | Added                                        |
      operationId: get-api-v1-groups.list
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/count'
        - schema:
            type: string
          in: query
          name: sort
          description: |-
           Sort the channels in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON object. The options are as follows:
            * `name`: Sort by the channel name. For example, `sort={"name":1}` (this is the default sorting mechanism).
            * `ts`: Sort by channel creation timestamp. For example, `sort={"ts":-1}`
            * `usersCount`: Sort by the number of users in the channel. For example, `sort={"usersCount":1}`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        t:
                          type: string
                        msgs:
