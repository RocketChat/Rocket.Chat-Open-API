  /api/v1/teams.update:
    post:
      tags:
        - Teams
      summary: Update a Team
      description: |-
        Updates an existing team (name and type). 
        
        Permission required: `edit-team`
        
        While ABAC is enabled, an ABAC-managed private team cannot be made public. The request fails with `error-action-not-allowed` and no change is applied, including a name change sent in the same request. While ABAC is disabled, making the team public removes the team room's ABAC attributes. In that case, you also need the `abac-management` and `manage-abac-admin-rooms` permissions or `edit-room-abac-attributes` in the team room.
        
        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Refused making an ABAC-managed team public while ABAC is enabled, with `error-action-not-allowed`. Making a team public while ABAC is disabled removes its ABAC attributes. |
        <!-- TODO: Add the row for the version that introduced this endpoint (the "Added" row is missing from this changelog). -->
      operationId: post-api-v1-teams.update
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The team ID.
                data:
                  type: object
                  description: 'The new team name and type (0 - public, 1 - private).'
                  properties:
                    name:
                      type: string
                    type:
                      type: integer
              required:
                - teamId
                - data
            examples:
              Example:
                value:
                  teamId: ByehQjC44FwMeiLbX
                  data:
                    name: newTeamName
                    type: 1
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                ABAC-managed team cannot be made public:
                  value:
                    success: false
                    error: Changing an ABAC managed private room to public is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/teams.addMembers:
    post:
      tags:
        - Teams
      summary: Add Members to the Team
      description: |-
        Add members to a team.
        
        Permissions required: `add-team-member` or `edit-team-member`

        To assign roles in `members[].roles`, you also need the permission for each role in the team's main room: `set-owner` for `owner`, `set-moderator` for `moderator`, and `set-leader` for `leader`. Any other role except `member` requires `access-permissions`, and the `admin` role also requires `assign-admin-role`. If you don't have them, the request fails with a `403` error.

        By default, only the `admin` and `owner` roles have `set-owner`, `set-moderator`, and `set-leader`. A team moderator can add members with the `member` role only.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Added permission checks for the roles in `members[].roles`. |
        <!-- TODO: add the row for the version that introduced teams.addMembers; it was not verified from the 9.0.0 diff. -->
      operationId: post-api-v1-teams.addMembers
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: Enter the team ID. Alternatively, enter the `teamName` parameter and provide the team's name as the value.
                members:
                  type: array
                  description: The users (IDs and roles) to add to the team.
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
              required:
                - teamId
                - members
            examples:
              Example:
                value:
                  teamId: 63f3efc4b000b6b6d86704b2
                  members:
                    - userId: rYhzFRd2QZjNwAAXX
                      roles:
                        - member
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Params:
                  value:
                    success: false
                    error: |-
                      must have required property 'members'
                       must have required property 'teamName'
                       must match exactly one schema in oneOf
                    errorType: error-invalid-params
        '401':
          $ref: '#/components/responses/authorizationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: forbidden
