      operationId: get-api-v1-rooms.membersOrderedByRole
      description: |-
        Get room members ordered by their roles. This endpoint sorts the members according to their role in the room in the order `Owners` > `Moderators` > all other members. This can be reversed using the query paramter `sort={"rolePriority":-1}`. You need not be a member of the room.

        If the room is a broadcast room, you need the `view-broadcast-member-list` permission to view the room members.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Returns `403` instead of `401` when the user lacks the `view-broadcast-member-list` permission for a broadcast room. |
        | 7.3.0   | Added       |
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
        - schema:
            type: string
            example: 66cd971f6fcbb8e8b3cf8e69
          in: query
          name: roomId
          description: Enter the room ID.
          required: true
        - schema:
            type: string
            example: test-team
          in: query
          name: roomName
          description: 'Instead of using the room ID, you can enter the room name.'
        - schema:
            type: string
            example: user
          in: query
          name: filter
          description: Filter the results by using the text that you want to view.
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/count'
        - schema:
            type: string
          in: query
          name: sort
          description: |-
           Sort the rooms in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON string. The options are as follows:
            * `rolePriority`: Sort by priority of role (`Owners` > `Moderators` > all other members). For example, `sort={"rolePriority":-1}`
            * `username`: Sort by usernames. For example, `sort={"username":-1}`
        - schema:
            type: array
            items:
              type: string
          in: query
          name: status
          description: 'Enter the user status for which you want the results. For example, `online`, `away`, `offline`.'

  /api/v1/teams.create:
    post:
      tags:
        - Teams
      summary: Create a New Team
      description: |-
        Create a new public or private team in the workspace.

        Permission required: `create-team`. When you create a team from an existing room by passing `room.id`, you also need the `edit-room` permission for that room. To create an ABAC-managed private team with `abacAttributes`, you also need the `create-abac-managed-room` permission.

        While **Enforce ABAC across all workspace rooms** is on, new private teams must be ABAC-managed and carry every attribute listed in **Attributes required in all ABAC rooms**.

        Creating a team from an existing room with `room.id` removes that room's ABAC attributes and records the removal in the ABAC audit log. If the room has attributes, you also need the `abac-management` and `manage-abac-admin-rooms` permissions or `edit-room-abac-attributes` in that room.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Creating a team from an existing room removes the room's ABAC attributes. |
        | 9.0.0   | Added the `abacAttributes` parameter and the `skippedMembers` response field. |
        | 8.7.0   | Enforced room permission checks when creating a team from an existing room. |
        | 3.13.0  | Added |
      operationId: post-api-v1-teams.create
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The team name.
                type:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: 'Privacy of the team (0 - Public, 1 - Private). Any other value is rejected with a 400 error.'
                members:
                  type: array
                  description: The user IDs to add to the team when it is created.
                  items:
                    type: string
                room:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of an existing room to use as the team's main room.
                    readOnly:
                      type: boolean
                sidepanel:
                  type: object
                  description: List the team's channels or discussions to be displayed in the sidepanel.
                  properties:
                    items:
                      type: array
                      description: The options are `discussions` and `channels`.
                      items:
                        type: string
                        example: '["discussions", "channels"]'
                owner:
                  type: string
                  description: Set the owner of the team.
                abacAttributes:
                  type: object
                  description: |-
                    Optional. Creates the team as an ABAC-managed private team with these attributes. Map of attribute keys to the values to assign, for example `{ "clearance": ["secret"] }`. Keys and values can contain letters, digits, `_` and `-`. Use 1 to 10 keys, each with 1 to 10 unique values.
                    Requires ABAC to be enabled and the `create-abac-managed-room` permission. The team `type` must be `1` (private); a public team (`type` `0`) is rejected with `error-abac-attributes-private-rooms-only`, not converted to private. You cannot combine it with `room.id`, and `owner`, if sent, must be the caller. You can only assign values returned by `GET /api/v1/abac/attributes.listAssignable`. You must meet the attributes yourself; otherwise the request fails with `error-abac-creator-not-admitted` and no team is created. Members who do not meet the attributes are not added and are listed in `skippedMembers`.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  example:
                    clearance:
                      - secret
              required:
                - name
                - type
            examples:
              Create a public team:
                value:
                  name: teamName
                  type: 0
                  members:
                    - 8dugqGhuRvCBLdZft
                  room:
                    readOnly: true
                  sidepanel:
                    items:
                      - discussions
                      - channels
              Create a team from an existing room:
                value:
                  name: teamName
                  type: 0
                  room:
                    id: 6513afeda2f73c7460e18c86
              Create an ABAC-managed private team:
                value:
                  name: secret-projects-team
                  type: 1
                  members:
                    - aB3dE5fG7hJ9kL1mN
                  abacAttributes:
                    clearance:
                      - secret
      responses:
        '200':
          description: |-
            OK
            
            Note that the `roomId` is main room ID of the team.
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _updatedAt:
                        type: string
                      roomId:
                        type: string
                  skippedMembers:
                    type: array
                    description: Usernames of the requested members who were not added because they do not meet the team's ABAC attributes. Returned only when `abacAttributes` was sent and at least one member was skipped.
                    items:
                      type: string
                  success:
                    type: boolean
              examples:
                Team created:
                  value:
                    team:
                      _id: 651619e3a2f73c7460e18cc5
                      name: teamName
                      type: 0
                      createdAt: '2023-09-29T00:27:15.189Z'
                      createdBy:
                        _id: rbAXPnMktTFbNpwtJ
                        username: roxie
                      _updatedAt: '2023-09-29T00:27:15.189Z'
                      roomId: 651619e3a2f73c7460e18cc7
                    success: true
                ABAC-managed private team created:
                  value:
                    team:
                      _id: 6720f2b4c4d5e6f7a8b9c0e2
                      name: secret-projects-team
                      type: 1
                      createdAt: '2026-10-28T15:25:40.117Z'
                      createdBy:
                        _id: aB3dE5fG7hJ9kL1mN
                        username: jane.doe
                      _updatedAt: '2026-10-28T15:25:40.117Z'
                      roomId: 6720f2b4c4d5e6f7a8b9c0e4
                    skippedMembers:
                      - john.roe
                      - max.poe
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    description: Present only when a specific attribute or cause is at fault.
              examples:
                Invalid team type:
                  value:
                    success: false
                    error: must be equal to one of the allowed values
                    errorType: error-invalid-params
                ABAC not enabled:
                  value:
                    success: false
                    error: error-abac-not-enabled
                    errorType: error-abac-not-enabled
                ABAC attributes on a public team:
                  value:
                    success: false
                    error: error-abac-attributes-private-rooms-only
                    errorType: error-abac-attributes-private-rooms-only
                Creator does not meet the ABAC attributes:
                  value:
                    success: false
                    error: error-abac-creator-not-admitted
                    errorType: error-abac-creator-not-admitted
                    details:
                      cause: error-only-compliant-users-can-be-added-to-abac-rooms
                ABAC attributes with an existing room:
                  value:
                    success: false
                    error: error-abac-attributes-room-conversion
                    errorType: error-abac-attributes-room-conversion
                ABAC attributes with another owner:
                  value:
                    success: false
                    error: error-abac-attributes-owner-must-be-caller
                    errorType: error-abac-attributes-owner-must-be-caller
        '401':
          $ref: '#/components/responses/authorizationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Missing room permissions:
                  value:
                    success: false
                    error: forbidden
