  /api/v1/channels.invite:
    post:
      tags:
        - Channels
      summary: Add Users to Channel
      # DoneDone: unverified, DOCS-1809 TC-07 could not confirm bare JID invites (400 error-user-not-found; xmpp-server-service deployment unknown); confirm with API owner
      description: |-
        Add a user or bulk users to a channel.

        For a user to invite other users, they must match at least one of the following premises:
        - The user is part of a room of any type and has the `add-user-to-joined-room` permission.
        - The user is part of a public room `(t: 'c')` and has the `add-user-to-any-c-room` permission.
        - The user is part of a private room `(t: 'p')` and has the `add-user-to-any-p-room` permission.

        In a channel that is not XMPP federated, a bare JID such as `alice@xmpp.example.org` is removed from the invite list. If no other users remain, the request fails with `invalid-user-invite-list`.
        <!-- TODO: confirm inviting users of remote XMPP servers by bare JID (for example, `alice@xmpp.example.org`) in `usernames` or `username` to an XMPP federated room hosted by this workspace. In 9.0.0-rc.0 testing, a bare JID returned `error-user-not-found`, the same as a username that does not exist. Confirm whether the XMPP server service must be running. -->

        You can identify the channel by `roomId` or `roomName`, and the users either by ID (`userId`, `userIds`) or by username (`username`, `user`, `usernames`). You cannot mix IDs and usernames in the same request.

        If `userIds` or `usernames` contains users that do not exist, they are skipped and the valid users are invited. If none of the listed users exist, the request fails with `invalid-user-invite-list`. Users who are already members of the channel are ignored, and the request still succeeds.

        ### Changelog

        | Version | Description               |
        | ------- | ------------------------- |
        | 9.0.0   | Added the `userIds` and `usernames` parameters to invite multiple users in one request. |
        | 9.0.0   | Added inviting remote XMPP users by bare JID to XMPP federated rooms. <!-- TODO: confirm; not observed in DOCS-1809 testing. --> |
        | 0.48.0  | Added                  |
      operationId: post-api-v1-channels.invite
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel's ID. This parameter is required if no `roomName` is provided.
                  example: nSYqWzZ4GsKTX4dyK
                roomName:
                  type: string
                  description: The channel's name. This parameter is required if no `roomId` is provided.
                  example: general
                userId:
                  type: string
                  description: The ID of the user to invite. Cannot be combined with `username`, `user`, or `usernames`.
                  example: ByehQjC44FwMeiLbX
                userIds:
                  type: array
                  description: An array of IDs of the users to invite. Cannot be combined with `username`, `user`, or `usernames`.
                  items:
                    type: string
                  example:
                    - ByehQjC44FwMeiLbX
                    - Wq3kLm8TzR2vNpX5d
                username:
                  type: string
                  description: The username of the user to invite. Cannot be combined with `userId` or `userIds`.
                  example: john.doe
                user:
                  type: string
                  description: The username of the user to invite. Alternative to `username`. Cannot be combined with `userId` or `userIds`.
                  example: john.doe
                usernames:
                  type: array
                  description: An array of usernames of the users to invite. Cannot be combined with `userId` or `userIds`.
                  items:
                    type: string
                  example:
                    - john.doe
                    - jane.doe
            examples:
              Invite by ID:
                value:
                  roomId: nSYqWzZ4GsKTX4dyK
                  userId: ByehQjC44FwMeiLbX
              Invite multiple users by ID:
                value:
                  roomId: nSYqWzZ4GsKTX4dyK
                  userIds:
                    - ByehQjC44FwMeiLbX
                    - Wq3kLm8TzR2vNpX5d
              Invite multiple users by username:
                value:
                  roomName: general
                  usernames:
                    - john.doe
                    - jane.doe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    properties:
                      _id:
                        type: string
                      fname:
                        type: string
                      customFields:
                        type: object
                      description:
                        type: string
                      broadcast:
                        type: boolean
                      encrypted:
                        type: boolean
                      federated:
                        type: boolean
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      default:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                      lm:
                        type: string
                      lastMessage:
                        type: object
                        properties:
                          _id:
                            type: string
                          t:
                            type: string
                          msg:
                            type: string
                          groupable:
                            type: boolean
                          blocks:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                blockId:
                                  type: string
                                callId:
                                  type: string
                                appId:
                                  type: string
                          ts:
                            type: string
                          u:
                            type: object
                            properties:
                              _id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          rid:
                            type: string
                          _updatedAt:
                            type: string
                          urls:
                            type: array
                            items:
                              type: object
                          mentions:
                            type: array
                            items:
                              type: object
                          channels:
                            type: array
                            items:
                              type: object
                  success:
                    type: boolean
              examples:
                Add bulk users:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      ts: '2016-11-30T21:23:04.737Z'
                      t: c
                      name: testing
                      usernames:
                        - testing
                        - testing1
                      msgs: 1
                      _updatedAt: '2016-12-09T12:50:51.575Z'
                      lm: '2016-12-09T12:50:51.555Z'
                    success: true
                Add a user:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      ts: '2016-11-30T21:23:04.737Z'
                      t: c
                      name: testing
                      usernames: testing
                      msgs: 1
                      _updatedAt: '2016-12-09T12:50:51.575Z'
                      lm: '2016-12-09T12:50:51.555Z'
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
              examples:
                IDs and Usernames Combined:
                  value:
                    success: false
                    errorType: error-invalid-params
                    error: must NOT be valid
                User parameter required:
                  value:
                    success: false
                    error: 'Please provide "userId" or "username" or "userIds" or "usernames" as param [error-users-params-not-provided]'
                    errorType: error-users-params-not-provided
                User not found:
                  value:
                    success: false
                    error: User not found [error-user-not-found]
                    errorType: error-user-not-found
                    details:
                      method: addUsersToRoom
                Not allowed:
                  value:
                    success: false
                    error: Not allowed [error-not-allowed]
                    errorType: error-not-allowed
                    details:
                      method: addUsersToRoom
                # DoneDone: for engineering, DOCS-1831 observed error and errorType swapped in this response on 9.0.0-rc.0 (code in error, message in errorType); possible implementation bug, example kept verbatim
                No users to invite:
                  value:
                    success: false
                    error: invalid-user-invite-list
                    errorType: Cannot invite if no users are provided
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/channels.join:
