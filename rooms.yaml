                        - 1
                    mobilePushNotifications:
                      type: string
                      description: |-
                        The value for mobile push notifications. 
                        
                        The options are:
                        - nothing
                        - mentions
                        - all
                        - default
              required:
                - roomId
                - notifications
            examples:
              Example:
                value:
                  roomId: 5of4weEXaH7yncxz9
                  notifications:
                    desktopNotifications: all
                    disableNotifications: 0
                    emailNotifications: nothing
                    audioNotificationValue: beep
                    desktopNotificationDuration: '2'
                    audioNotifications: all
                    unreadAlert: nothing
                    hideUnreadStatus: 0
                    mobilePushNotifications: mentions
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/rooms.saveDraft:
    post:
      tags:
        - Rooms
      summary: Save Room Draft
      description: |-
        Save or clear the authenticated user's message draft for a room or an existing thread. The user must have a subscription to the room.

        To save a room draft, omit `tmid`. To save a thread draft, provide the ID of the thread's main message in `tmid`. Send an empty `draft` to clear the corresponding room or thread draft. The draft cannot exceed the workspace's `Message_MaxAllowedSize` setting.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 8.8.0   | Added the optional `tmid` parameter to save thread drafts |
        | 8.5.0   | Added |
      operationId: post-api-v1-rooms.saveDraft
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rid:
                  type: string
                  minLength: 1
                  description: The room ID.
                draft:
                  type: string
                  description: The draft text. Send an empty string to clear the draft.
                tmid:
                  type: string
                  minLength: 1
                  pattern: '^[^.$]+$'
                  description: The ID of the thread's main message. Omit this parameter to save or clear the main room draft.
              required:
                - rid
                - draft
              additionalProperties: false
            examples:
              Save room draft:
                value:
                  rid: GENERAL
                  draft: Remember to share the report
              Save thread draft:
                value:
                  rid: GENERAL
                  draft: I will check this and reply
                  tmid: 7aDSXtjMA3KPLxLjt
              Clear thread draft:
                value:
                  rid: GENERAL
                  draft: ''
                  tmid: 7aDSXtjMA3KPLxLjt
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid subscription:
                  value:
                    success: false
                    error: 'Invalid subscription [error-invalid-subscription]'
                    errorType: error-invalid-subscription
                Draft exceeds maximum size:
                  value:
                    success: false
                    error: error-message-size-exceeded
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/rooms.adminRooms:
    get:
      tags:
        - Rooms
      summary: Get All Room Admins
      description: |-
        Retrieves all rooms and admin information.
        
        Permission required: `view-room-administration`
        
        ### Changelog
        | Version | Description  |
        | ------- |--------------|
        | 8.7.0  | Restored `customFields` in the response |
        | 2.4.0  | Added         |
      operationId: get-api-v1-rooms.adminRooms
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
        - name: types
          in: query
          description: |-
            The room types. The possible room types are:
             - `d`: Direct messages
             - `c`: Public channel
             - `p`: Private channel
             - `discussions`: Team or channel discussions
             - `teams`: Workspace teams
             - `l`: Livechat
             - `v`: Omnichannel VoIP rooms
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          description: The rooms name
          schema:
            type: string
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/offset'
        - schema:
            type: string
          in: query
          name: sort
          description: |-
           Sort the channels in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON object. The options are as follows:
            * `ts`: Sort by creation timestamp. For example, `sort={"ts":-1}`
            * `usersCount`: Sort by number of users. For example, `sort={"usersCount":1}`
            * `name`: Sort by the room name. For example, `sort={"name":1}`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        fname:
                          type: string
                        description:
                          type: string
                        broadcast:
                          type: boolean
                        federated:
                          type: boolean
                        name:
                          type: string
                        t:
                          type: string
                        msgs:
                          type: integer
                        usersCount:
                          type: integer
                        u:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                        ro:
                          type: boolean
                        default:
                          type: boolean
                        topic:
                          type: string
                        announcement:
                          type: string
                        customFields:
                          type: object
                          description: The custom fields set on the room.
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    rooms:
                      - _id: 654c9d1ca2f73c7460e1918b
                        fname: animalGeography
                        topic: ''
                        broadcast: false
                        name: animalGeography
                        t: p
                        msgs: 4
                        usersCount: 1
                        u:
                          _id: CkCPNcvsvCDfmWLqC
                          username: kim.jane
                          name: kim.jane
                        ro: false
                        default: false
                        customFields:
                          department: engineering
                          priority: high
                    count: 1
                    offset: 0
                    total: 1
                    success: true
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/rooms.cleanHistory:
    post:
      tags:
        - Rooms
      summary: Clear Room History
      description: |-
        Cleans up a room by removing messages from the provided time range. For details, see the <a href='https://docs.rocket.chat/docs/room-actions#prune-messages-from-a-room' target='_blank'>Prune messages from a room</a> section.
        
        Permission required: `clean-channel-history`
        
        ### Changelog
        | Version | Description            |
        | ------- | ---------------------- |
        | 0.64.0  | Added                  |
        | 0.67.0  | Added fields `limit`, `excludePinned`, `filesOnly` and `users` |
      operationId: get-api-v1-rooms.cleanHistory
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The room ID.
                latest:
                  type: string
                  description: The end of time range of messages.
                oldest:
                  type: string
                  description: The start of the time range of messages.
                inclusive:
                  type: boolean
                  description: 'Whether messages which land on the latest and oldest dates should be included. By default, the value is false.'
                excludePinned:
                  type: boolean
                  description: 'Whether pinned messages should be deleted. By default, the value is false.'
                filesOnly:
                  type: boolean
                  description: 'Whether to only delete files and keep messages intact. By default, the value is false.'
                users:
                  type: array
                  items:
                    type: string
                  description: 'Specific set of users whose content to delete. By default, the value is [], that is, everyone.'
                limit:
                  type: integer
                  description: 'The amount of messages to prune. By default, the value is 0 (all).'
                ignoreDiscussion:
                  type: boolean
                  description: 'Determines if messages from discussions should be pruned. By default, the value is true.'
                ignoreThreads:
                  type: boolean
                  description: 'Determines if messages from threads should be pruned. By default, the value is true.'
              required:
                - roomId
                - latest
                - oldest
            examples:
              Example:
                value:
                  roomId: roomId
                  latest: '2016-12-09T13:42:25.304Z'
                  oldest: '2016-08-30T13:42:25.304Z'
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '401':
          $ref: '#/components/responses/authorizationError'
  /api/v1/rooms.history:
    get:
      tags:
        - Rooms
      summary: Get Room History
      description: |-
        Returns the message history of a room of any type, with cursor-based pagination. Hidden system messages are excluded.
 
        When the **Allow Anonymous Read** (`Accounts_AllowAnonymousRead`) setting is enabled, public channels can be read without authentication.
 
        This endpoint replaces the deprecated `loadHistory`, `loadNextMessages`, and `loadSurroundingMessages` Realtime API methods, which remain available until 9.0.0.
 
        Permission required: `preview-c-room` (only to read a public channel you have not joined)
 
        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 8.9.0   | Added       |
      operationId: get-api-v1-rooms.history
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
        - name: roomId
          in: query
          description: |-
            The room ID. You must have access to the room.
          required: true
          schema:
            type: string
          example: 6GFJ3tbmHiyHbahmC
        - name: count
          in: query
          description: |-
            The number of messages to return. The default is 20. The value is capped by the **Max Record Amount** (`API_Upper_Count_Limit`) setting.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          example: 20
        - name: previous
          in: query
          description: |-
            The `cursor.previous` value from a previous response. Returns the messages older than that position. If `cursor.previous` is `null`, there are no older messages. Cannot be combined with `next` or `aroundId`.
          required: false
          schema:
            type: string
          example: '1790157600000'
        - name: next
          in: query
          description: |-
            The `cursor.next` value from a previous response. Returns the messages newer than that position. If `cursor.next` is `null`, there are no newer messages. Cannot be combined with `previous` or `aroundId`.
          required: false
          schema:
            type: string
          example: '1790157900000'
        - name: aroundId
          in: query
          description: |-
            The ID of a message in the room. It loads messages centered around that message, including the message itself. Use it to jump to a specific message, such as a quoted message or a search result. Cannot be combined with `next` or `previous`.
          required: false
          schema:
            type: string
          example: Xq8sLpW3nZr2TmKeA
        - name: lastSeen
          in: query
          description: |-
            An ISO 8601 date-time for the user's last-read position. It does not limit the returned messages. When the oldest returned message is newer than this value, the response includes `firstUnread` and `unreadNotLoaded`.
          required: false
          schema:
            type: string
            format: date-time
          example: '2026-09-23T09:00:00.000Z'
        - name: showThreadMessages
          in: query
          description: |-
            Whether to include thread replies that were not also sent to the room. The default is `true`.
          required: false
          schema:
            type: boolean
            default: true
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    description: The messages, ordered newest first.
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        rid:
                          type: string
                        msg:
                          type: string
                        ts:
                          type: string
                        u:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                            name:
                              type: string
                        _updatedAt:
                          type: string
                        mentions:
                          type: array
                          items:
                            type: object
                        channels:
                          type: array
                          items:
                            type: object
                  cursor:
                    type: object
                    properties:
                      next:
                        type: string
                        nullable: true
                        description: The cursor for newer messages, or `null` if there are none.
                      previous:
                        type: string
                        nullable: true
                        description: The cursor for older messages, or `null` if there are none.
                  firstUnread:
                    type: object
                    description: The oldest unread message that was not loaded in this response. Returned only when `lastSeen` is provided and unread messages exist beyond the returned messages.
                  unreadNotLoaded:
                    type: integer
                    description: The number of unread messages newer than `lastSeen` that were not loaded in this response.
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    messages:
                      - _id: Xq8sLpW3nZr2TmKeA
                        rid: 6GFJ3tbmHiyHbahmC
                        msg: The release checklist is ready for review.
                        ts: '2026-09-23T10:05:00.000Z'
                        u:
                          _id: rbAXPnMktTFbNpwtJ
                          username: dana.reyes
                          name: Dana Reyes
                        _updatedAt: '2026-09-23T10:05:00.000Z'
                        mentions: []
                        channels: []
                      - _id: Bv5nTq7RkWz3YpLcD
                        rid: 6GFJ3tbmHiyHbahmC
                        msg: Thanks, I will take a look this afternoon.
                        ts: '2026-09-23T10:00:00.000Z'
                        u:
                          _id: kP3wQz8LmNvT5rXyB
                          username: sam.okafor
                          name: Sam Okafor
                        _updatedAt: '2026-09-23T10:00:00.000Z'
                        mentions: []
                        channels: []
                    cursor:
                      next: null
                      previous: '1790157600000'
                    unreadNotLoaded: 0
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Cursor Conflict:
                  value:
                    success: false
                    error: 'Only one of "next", "previous" and "aroundId" can be provided [error-cursor-conflict]'
                    errorType: error-cursor-conflict
                Invalid Cursor:
                  value:
                    success: false
                    error: 'Invalid pagination cursor [error-invalid-cursor]'
                    errorType: error-invalid-cursor
        '401':
          $ref: '#/components/responses/authorizationError'
        '403':
          description: Forbidden. You cannot access the room, or the room is a public channel that you have not joined and you do not have the `preview-c-room` permission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: forbidden
        '404':
          description: Not Found. The room does not exist, or the message in `aroundId` is not a visible message in the room.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Not Found:
                  value:
                    success: false
                    error: Resource not found
  /api/v1/rooms.info:
    get:
      tags:
        - Rooms
      summary: Get Room Information
      # DoneDone: observed behavior; requirement failure (TC-10), confirm with API owner
      description: |-
        Retrieves the information about the room.

        Users with the `view-room-administration` permission can also retrieve public and private rooms they are not a member of, except private rooms managed by ABAC. Users without this permission who request a private room they are not a member of receive a `400` error with `not-allowed`.

        The endpoint ignores the removed `fields` and `query` parameters and returns the full room object.

        ### Changelog
        | Version | Description |
        | ------- | ----------- |
        | 9.0.0   | Removed the `fields` parameter. The endpoint ignores it and returns the full room object. Users with the `view-room-administration` permission can read public and private rooms they are not a member of, except rooms managed by ABAC. |
        | 9.0.0   | Added the `classificationBanner` response field. The ABAC classification banner configuration is no longer exposed as a public setting. |
        | 9.0.0   | Added the `abacRequiredAttributes` response field, returned while ABAC enforcement across all workspace rooms is on. |
        |0.72.0   | Added       |
      operationId: get-api-v1-rooms.info
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/Optional-RoomId'
        - $ref: '#/components/parameters/Optional-RoomName'
      responses:
        '200':
          description: |-
            OK
            
            The response includes the following objects:
            * `parent`: Represents the parent of a room. For discussions, this is the room where the discussion was created, identified by `prid`. For rooms inside a team, the parent will be the team's main room, identified by `team.roomId`. For other rooms, this property is undefined.
            * `team`: Represents the team a room is part of. For rooms inside a team, this is the team identified by the `teamId` property. For everything else, this is undefined.
            * `classificationBanner`: The ABAC classification banner that applies to the room, returned at the top level next to `room`. Returned only when the workspace has the ABAC license, ABAC and classification banners are enabled, and a configured banner applies. An ABAC-managed room gets the banner built from its attributes. Rooms that are not ABAC managed, including public and private channels, DMs and discussions, get a banner only from the optional non-ABAC banner list (`nonAbacBanner`) in the banner configuration. Omnichannel rooms never get a banner. The response holds only the resolved banner, never the banner configuration.
            * `abacRequiredAttributes`: The attribute keys that every ABAC room must carry. Returned only when ABAC is enabled and **Enforce ABAC across all workspace rooms** is on. The list is empty when no attribute is required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    properties:
                      _id:
                        type: string
                      ts:
                        type: string
                      t:
                        type: string
                      name:
                        type: string
                      usernames:
                        type: array
                        items:
                          type: object
                          properties: { }
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      _updatedAt:
                        type: string
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                          name:
                            type: string
                      default:
                        type: boolean
                      lastMessage:
                        type: object
                        properties:
                          _id:
                            type: string
                          t:
                            type: string
                          rid:
                            type: string
                          ts:
                            type: string
                          msg:
                            type: string
                          alias:
                            type: string
                            nullable: true
                          attachments:
                            type: array
                            items:
                              type: object
                          file:
                            type: object
                            properties:
                              _id:
                                type: string
                              name:
                                type: string
                              type:
                                type: string
                          u:
                            type: object
                            properties:
                              _id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          groupable:
                            type: boolean
                          drid:
                            type: string
                          _updatedAt:
                            type: string
                      lm:
                        type: string
                  classificationBanner:
                    type: object
                    description: The classification banner that applies to the room. Present only when a configured banner applies. Contains the resolved banner only, not the banner configuration.
                    properties:
                      style:
                        type: string
                        enum:
                          - classic
                      uppercase:
                        type: boolean
                      monospace:
                        type: boolean
                      text:
                        type: string
                        description: The banner text shown in the room.
                      segments:
                        type: array
                        description: One entry per attribute shown in the banner of an ABAC-managed room. Empty for a banner from the non-ABAC banner list.
                        items:
                          type: object
                          properties:
                            attrId:
                              type: string
                              description: The `id` of the attribute entry in the banner configuration.
                            text:
                              type: string
                      backgroundColor:
                        type: string
                        description: The banner background color, in `#RRGGBB` format.
                      color:
                        type: string
                        description: The banner text color, in `#RRGGBB` format.
                  abacRequiredAttributes:
                    type: array
                    description: Attribute keys required in every ABAC room. Present only while ABAC enforcement across all workspace rooms is on.
                    items:
                      type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    room:
                      _id: 66ed2dba40141d95f32c292b
                      fname: new-channel
                      _updatedAt: '2024-09-20T12:29:08.284Z'
                      customFields: { }
                      topic: ''
                      broadcast: false
                      encrypted: false
                      name: new-channel
                      t: p
                      msgs: 3
                      usersCount: 2
                      u:
                        _id: C38WSSzrGd2NCjzqJ
                        username: test.cat
