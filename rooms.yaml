  /api/v1/rooms.export:
    post:
      tags:
        - Rooms
      summary: Export Room
      description: |
        Export room messages to a file or email. When exporting to a file, the ZIP file is stored in the `/tmp` directory on the Rocket.Chat server, and its details are recorded in the `rocketchat_user_data_files` collection in MongoDB.

        Permission required: `mail-messages`

        ### Changelog

        | Version | Description                          |
        | ------- | ------------------------------------ |
        | 3.8.0   | Added                                |
      operationId: post-api-v1-rooms.export
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rid:
                  type: string
                  description: The room ID.
                type:
                  type: string
                  description: |-
                    How you want the room to be exported. The type of export selected determines the remaining required parameters. It can be either `email` or `file`.
                dateFrom:
                  type: string
                  description: |-
                    Start date to begin fetching. Use `dateFrom` if  the type is `file`. By default, it selects the oldest possible date.
                dateTo:
                  type: string
                  description: |-
                    End date for fetching. By default it selects the current date. Use `dateTo` if  the `type` is  `file`.
                format:
                  type: string
                  description: |-
                    The file type to export as. It can either be `html` or `json`. Use `format` if  the `type` is  `file`.
                toUsers:
                  type: array
                  items:
                    type: string
                  description: |-
                    An array of users that should recieve the export. ecieve the export. It is required if `type` is `email`.
                toEmails:
                  type: array
                  items:
                    type: string
                  description: |-
                    An array of any additional emails that should recieve the export. It is required if `type` is `email`. 
                messages:
                  type: array
                  items:
                    type: string
                  description: |-
                    An array of  messageId for  the messages that should be exported. It is required if `type` is `email`.  
                subject:
                  type: string
                  description: |-
                    The subject of the email. It is required if `type` is `email`. 
              required:
                - rid
                - type

            examples:
              Example:
                value:
                  rid: iu7jtPAhvEeAS5tNq
                  type: file
                  dateFrom: '2000-01-01'
                  dateTo: '2021-11-25'
                  format: html
                  toUsers:
                    - test.user
                  toEmails:
                    - test@test.com
                  messages:
                    - yd6NBgNoiWATgDoFt
                    - BoCjicj9DdYoMHHeo
                    - tajMB3aX3sawFWe8W
                  subject: 'Test Subject '

      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Room ID:
                  value:
                    success: false
                    error: '[error-invalid-room]'
                    errorType: error-invalid-room
                Invalid Format:
                  value:
                    success: false
                    error: '[error-invalid-format]'
                    errorType: error-invalid-format
                Invalid Params:
                  value:
                    success: false
                    error: '[error-invalid-params]'
                    errorType: error-invalid-params
        '401':
          $ref: '#/components/responses/authorizationError'
        '403':
          $ref: '#/components/responses/forbiddenError'

  /api/v1/rooms.muteUser:
    post:
      tags:
        - Rooms
      summary: Mute User in Room
      description: |
        Mute a particular user in a room. Permission required: `mute-user`. The room becomes read-only for the muted user. They can still view messages but cannot send any until unmuted.

        ### Changelog

        | Version | Description                          |
        | ------- | ------------------------------------ |
        | 6.8.0   | Added                                |
      operationId: post-api-v1-rooms.muteUser
      parameters:
        - $ref: '#/components/parameters/Auth-Token'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - roomId
              properties:
                userId:
                  type: string
                  example: CkCPNfjfhiwWLqC
                  description: 'The user that you want to mute. Alternatively, use the `username` parameter and enter the username as the value.'
                roomId:
                  type: string
                  example: JZ8Y2dLfYhsg323Rf
                  description: The room ID.
      responses:
        '200':
          $ref: '#/components/responses/trueSuccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid User:
                  value:
                    success: false
                    error: 'The required "userId" or "username" param provided does not match any users [error-invalid-user]'
                    errorType: error-invalid-user
                Invalid Params:
                  value:
                    success: false
                    error: |-
                      must have required property 'userId'
                       must have required property 'username'
                       must match exactly one schema in oneOf [error-invalid-params]
                    errorType: error-invalid-params
        '401':
          $ref: '#/components/responses/authorizationError'
  
