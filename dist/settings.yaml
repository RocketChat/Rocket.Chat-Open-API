      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  providerName:
                    type: string
                  success:
                    type: boolean
              examples:
                Example 1:
                  value:
                    url: http://g.co/meet/RocketChat_697887e3c8b0533020781a4a
                    providerName: googlemeet
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'callId' [invalid-params]
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-video-conference.join
      description: "Join a specific video conference. Rate limiting: 2 requests per 5000ms. This endpoint also allows anonymous access for guest users.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/video-conference.join \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"callId\": \"697887e3c8b0533020781a4a\",\n  \"state\": {\n    \"mic\": true,\n    \"cam\": true\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"url\": \"http://g.co/meet/RocketChat_697887e3c8b0533020781a4a\",\n  \"providerName\": \"googlemeet\",\n  \"success\": true\n}\n```"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - callId
              properties:
                callId:
                  type: string
                  example: 697887e3c8b0533020781a4a
                  description: Enter the video conference call ID that you want to join.
                state:
                  type: object
                  description: Object containing initial device states.
                  properties:
                    mic:
                      type: boolean
                      description: Whether the microphone starts muted or unmuted.
                    cam:
                      type: boolean
                      description: Whether the camera starts enabled or disabled.
            examples:
              Example 1:
                value:
                  callId: 697887e3c8b0533020781a4a
                  state:
                    mic: true
                    cam: true
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
  /api/v1/video-conference.cancel:
