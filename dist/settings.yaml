                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Parameter:
                  value:
                    success: false
                    error: must have required property 'token' [invalid-params]
                    errorType: invalid-params
                Failed to Connect:
                  value:
                    success: false
