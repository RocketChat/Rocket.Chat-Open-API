openapi: 3.0.0
info:
  version: 1.0.0
  title: Settings
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/settings.public:
    get:
      summary: Get Public Settings
      operationId: get-api-v1-settings.public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        value:
                          oneOf:
                          - type: boolean
                          - type: string
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    settings:
                    - _id: API_Drupal_URL
                      value: ''
                    - _id: API_Embed
                      value: true
                    count: 2
                    offset: 0
                    total: 2
                    success: true
      tags:
      - Settings
      description: "List all public settings. Learn how this can be used in configuring your workspace in this <a href=\"https://docs.rocket.chat/docs/manage-settings-using-environmental-variables\" target=\"_blank\">guide</a>.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.0.0            | Added the `_id` query parameter for filtering.|\n|7.0.0            | Removed the `query` parameter.      |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/settings.public?offset=50&count=50&_id=Site_Url, LDAP_Enable&sort=example'\n```\n\n### Example success response\n\n```json\n{\n  \"settings\": [\n    {\n      \"_id\": \"API_Drupal_URL\",\n      \"value\": \"\"\n    },\n    {\n      \"_id\": \"API_Embed\",\n      \"value\": true\n    }\n  ],\n  \"count\": 2,\n  \"offset\": 0,\n  \"total\": 2,\n  \"success\": true\n}\n```"
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: How many items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: fields
        in: query
        required: false
        schema: {}
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: `fields={ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      - name: _id
        in: query
        description: Filter by the `_id` of the settings.
        schema:
          type: string
        example: Site_Url, LDAP_Enable
      - schema:
          type: string
        in: query
        name: sort
        description: "Sort the settings in ascending or descending order. By default, settings are sorted by setting ID in ascending order. The sort options are:\n * `createdAt`: Sort by creation date. `sort={\"createdAt\": 1}` or `sort={\"createdAt\": -1}`\n * `_id`: Sort by setting ID. `sort={\"_id\": 1}` or `sort={\"_id\": -1}`"
  /api/v1/settings.oauth:
    get:
      summary: Get OAuth Settings
      operationId: get-api-v1-settings.oauth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        clientId:
                          type: string
                        buttonLabelText:
                          type: string
                        buttonColor:
                          type: string
                        buttonLabelColor:
                          type: string
                        custom:
                          type: boolean
                        service:
                          type: string
                        serverURL:
                          type: string
                        tokenPath:
                          type: string
                        identityPath:
                          type: string
                        authorizePath:
                          type: string
                        scope:
                          type: string
                        loginStyle:
                          type: string
                        tokenSentVia:
                          type: string
                        identityTokenSentVia:
                          type: string
                        usernameField:
                          type: string
                        mergeUsers:
                          type: boolean
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    services:
                    - _id: iJeY7x4wxnh2p3pLr
                      name: facebook
                      clientId: test
                      buttonLabelText: test
                      buttonColor: '#13679A'
                      buttonLabelColor: '#FFFFFF'
                      custom: false
                    - _id: iJeY7x4wxnh2p3pLr
                      name: twitter
                      clientId: test
                      buttonLabelText: ''
                      buttonColor: ''
                      buttonLabelColor: ''
                      custom: false
                    - _id: 5RQ4SBL3NuZKsqxaF
                      service: test
                      clientId: test
                      custom: true
                      serverURL: /test/test
                      tokenPath: /oauth/token
                      identityPath: /me
                      authorizePath: /oauth/authorize
                      scope: openid
                      buttonLabelText: test
                      buttonLabelColor: '#FFFFFF'
                      loginStyle: popup
                      buttonColor: '#13679A'
                      tokenSentVia: payload
                      identityTokenSentVia: default
                      usernameField: dfsgdfgdfgdfgsd
                      mergeUsers: true
                    success: true
      tags:
      - Settings
      description: "List all the <a href=\"https://docs.rocket.chat/docs/oauth\" target=\"_blank\"> OAuth services</a>. enabled in the workspace.\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.64.0            | Renamed field `appId` to `clientId` and added flag `custom` to indicate whether the OAuth service is customized and fix `id` inconsistence (set all cases to `_id`)       |\n|0.63.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/settings.oauth\n```\n\n### Example success response\n\n```json\n{\n  \"services\": [\n    {\n      \"_id\": \"iJeY7x4wxnh2p3pLr\",\n      \"name\": \"facebook\",\n      \"clientId\": \"test\",\n      \"buttonLabelText\": \"test\",\n      \"buttonColor\": \"#13679A\",\n      \"buttonLabelColor\": \"#FFFFFF\",\n      \"custom\": false\n    },\n    {\n      \"_id\": \"iJeY7x4wxnh2p3pLr\",\n      \"name\": \"twitter\",\n      \"clientId\": \"test\",\n      \"buttonLabelText\": \"\",\n      \"buttonColor\": \"\",\n      \"buttonLabelColor\": \"\",\n      \"custom\": false\n    },\n    {\n      \"_id\": \"5RQ4SBL3NuZKsqxaF\",\n      \"service\": \"test\",\n      \"clientId\": \"test\",\n      \"custom\": true,\n      \"serverURL\": \"/test/test\",\n      \"tokenPath\": \"/oauth/token\",\n      \"identityPath\": \"/me\",\n      \"authorizePath\": \"/oauth/authorize\",\n      \"scope\": \"openid\",\n      \"buttonLabelText\": \"test\",\n      \"buttonLabelColor\": \"#FFFFFF\",\n      \"loginStyle\": \"popup\",\n      \"buttonColor\": \"#13679A\",\n      \"tokenSentVia\": \"payload\",\n      \"identityTokenSentVia\": \"default\",\n      \"usernameField\": \"dfsgdfgdfgdfgsd\",\n      \"mergeUsers\": true\n    }\n  ],\n  \"success\": true\n}\n```"
      parameters: []
  /api/v1/settings:
    parameters: []
    get:
      summary: Get Private Settings
      operationId: get-api-v1-settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        value:
                          oneOf:
                          - type: boolean
                          - type: string
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    settings:
                    - _id: API_Allow_Infinite_Count
                      value: true
                    - _id: API_CORS_Origin
                      value: '*'
                    count: 50
                    offset: 0
                    total: 299
                    success: true
                success example with query parameter:
                  value:
                    settings:
                    - _id: API_Allow_Infinite_Count
                      value: true
                      packageValue: true
                      enterprise: false
                    - _id: API_Apply_permission_view-outside-room_on_users-list
                      value: false
                      packageValue: false
                      enterprise: false
                    - _id: API_CORS_Origin
                      value: '*'
                      packageValue: '*'
                      enterprise: false
                    count: 3
                    offset: 0
                    total: 10
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      tags:
      - Settings
      description: "List all private settings. Learn how this can be used in configuring your server in this <a href=\"https://docs.rocket.chat/docs/deployment-environment-variables\" target=\"_blank\">guide</a>.\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/settings?includeDefaults=True&offset=50&count=50' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"settings\": [\n    {\n      \"_id\": \"API_Allow_Infinite_Count\",\n      \"value\": true\n    },\n    {\n      \"_id\": \"API_CORS_Origin\",\n      \"value\": \"*\"\n    }\n  ],\n  \"count\": 50,\n  \"offset\": 0,\n  \"total\": 299,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      - schema:
          type: boolean
        in: query
        name: includeDefaults
        description: When set to true, it fetches both the current value and the default value (packageValue) of the settings
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: How many items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
    post:
      summary: Update Settings in Bulk
      operationId: post-api-v1-settings
      description: "Updates multiple private workspace settings in a single request. \n\nPermission required: `edit-privileged-setting`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.6.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/settings \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"settings\": [\n    {\n      \"_id\": \"API_Allow_Infinite_Count\",\n      \"value\": false\n    },\n    {\n      \"_id\": \"API_CORS_Origin\",\n      \"value\": \"https://example.com\"\n    }\n  ]\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      tags:
      - Settings
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      - name: x-2fa-code
        in: header
        schema:
          type: string
        description: The 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
      - name: x-2fa-method
        in: header
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: array
                  description: The list of settings to update.
                  minItems: 1
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: The unique ID of the setting.
                      value:
                        description: The value to set for the setting. The accepted type depends on the setting.
                    required:
                    - _id
                    - value
              required:
              - settings
            examples:
              Example:
                value:
                  settings:
                  - _id: API_Allow_Infinite_Count
                    value: false
                  - _id: API_CORS_Origin
                    value: https://example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Params:
                  value:
                    success: false
                    error: must have required property 'settings' [invalid-params]
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      settingIds:
                        type: array
                        items:
                          type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: Editing settings is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
                    details:
                      method: saveSettings
                      settingIds:
                      - API_Allow_Infinite_Count
                      - API_CORS_Origin
  /api/v1/settings.addCustomOAuth:
    parameters: []
    post:
      description: "Add a <a href=\" https://docs.rocket.chat/docs/oauth#add-custom-oauth\" target=\"_blank\">custom OAuth integration</a> to your workspace.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/settings.addCustomOAuth \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"name\": \"example\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      summary: Add Custom OAuth
      operationId: post-api-v1-settings.addCustomOAuth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Missing name param:
                  value:
                    success: false
                    error: The parameter "name" is required [error-name-param-not-provided]
                    errorType: error-name-param-not-provided
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      tags:
      - Settings
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      - name: x-2fa-code
        in: header
        schema:
          type: string
        description: The 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
      - name: x-2fa-method
        in: header
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the custom OAuth method that you want to add.
              required:
              - name
  /api/v1/settings/{_id}:
    parameters:
    - schema:
        type: string
      name: _id
      in: path
      required: true
      description: The unique ID of the setting that you want to update or fetch.
    post:
      summary: Update Setting
      tags:
      - Settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-settings-_id
      description: "Permission required: `edit-privileged-setting`\n\nThe `_id` of a setting is the first argument of the `RocketChat.settings.add` method used in `Rocket.Chat/packages/rocketchat-lib/server/startup/settings.js` (among other files).\n\nFor example, the following code in `settings.js` file:\n  ```json\n  this.add('Accounts_AllowAnonymousRead', false, {\n    type: 'boolean',\n    public: true  });\n  ```\n  This means that the setting labeled `Allow anonymous read` in the section `Accounts` has `_id` equal to `Accounts_AllowAnonymousRead`. The second argument is the default value (false). The third argument specifies the variable's type and whether it is public, hidden, and so on.\n\n  To set a color, you can send:\n  ```json\n  { value: '<color-code>',\n    editor: 'color' }\n  ```\n\n  And also to trigger a action-button, use:\n  ```json\n  { execute: true }\n  ```\n  ### Changelog\n  | Version      | Description |\n  | ---------------- | ------------|\n  |0.65.0            | Added option to set a color and trigger an action       |\n  |0.42.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/settings/{_id} \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"value\": \"example\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      - name: x-2fa-code
        in: header
        schema:
          type: string
        description: The 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
      - name: x-2fa-method
        in: header
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The value to update the setting.
                color:
                  type: string
                  description: The color code to update the setting.
                editor:
                  type: string
                  description: The editor key, with color value. Required, if color was set.
                execute:
                  type: boolean
                  description: To trigger a action-button.
              required:
              - value
    get:
      summary: Get Setting
      tags:
      - Settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  value:
                    type: boolean
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    _id: Livechat_enabled
                    value: false
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: get-api-v1-settings-_id
      description: "Get details of a setting by ID.\nPermission required: `view-privileged-setting`\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.42.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/settings/{_id} \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"_id\": \"Livechat_enabled\",\n  \"value\": false,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
  /api/v1/service.configurations:
    parameters: []
    get:
      summary: Get OAuth Service Configuration
      operationId: get-api-v1-service.configurations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configurations:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        service:
                          type: string
                        clientId:
                          type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    configurations:
                    - _id: Hq5ahzz9MWWCdeDJ8
                      service: google
                      clientId: xxxxx
                    - _id: 57kavS22achLH33PE
                      service: apple
                      clientId: xxxxxx
                    success: true
