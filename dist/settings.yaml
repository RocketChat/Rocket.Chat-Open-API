        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'callId' [invalid-params]
                    errorType: invalid-params
                Example 2:
                  value:
                    success: false
                    error: invalid-call
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-video-conference.cancel
      description: "Cancel a specific video conference call. You can only cancel a call that is in the calling state. Rate limiting: 3 requests per 60 seconds.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/video-conference.cancel \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"callId\": \"697887e3c8b0533020781a4a\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - callId
              properties:
                callId:
                  type: string
                  example: 697887e3c8b0533020781a4a
                  description: Enter the call ID that you want to cancel.
  /media-calls.state:
    get:
      tags:
      - Media Calls
      summary: Get Current Media Call State
      description: "Returns every media call the authenticated user is part of and that has\nnot yet ended. Each entry reflects the call's latest\nserver-side state — `ringing`, `active`, etc. It also includes the\ncaller, callee, supported features, and lifecycle timestamps.\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/media-calls.state \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"calls\": [\n    {\n      \"_id\": \"9f44ec94-2046-4fac-976b-fa8b0e022b08\",\n      \"service\": \"webrtc\",\n      \"kind\": \"direct\",\n      \"state\": \"ringing\",\n      \"createdBy\": {\n        \"type\": \"user\",\n        \"id\": \"aEGCdnFoBFCFNdiyX\",\n        \"contractId\": \"7b96e74d-1e01-412a-8bcb-145db1bc9ac4\"\n      },\n      \"createdAt\": \"2026-04-30T13:30:53.165Z\",\n      \"caller\": {\n        \"type\": \"user\",\n        \"id\": \"aEGCdnFoBFCFNdiyX\",\n        \"contractId\": \"7b96e74d-1e01-412a-8bcb-145db1bc9ac4\",\n        \"displayName\": \"Funke Olasupo\",\n        \"username\": \"funke.olasupo\"\n      },\n      \"callee\": {\n        \"type\": \"user\",\n        \"id\": \"iaZWAXecuCuBx4FnX\",\n        \"displayName\": \"Agent1\",\n        \"username\": \"agent1\"\n      },\n      \"expiresAt\": \"2026-04-30T13:33:02.878Z\",\n      \"uids\": [\n        \"aEGCdnFoBFCFNdiyX\",\n        \"iaZWAXecuCuBx4FnX\"\n      ],\n      \"ended\": false,\n      \"callerRequestedId\": \"7b96e74d-1e01-412a-8bcb-145db1bc9ac4-38b61a15-8c41-4ee4-be75-977c48cd94ea\",\n      \"features\": [\n        \"audio\",\n        \"screen-share\",\n        \"transfer\",\n        \"hold\"\n      ],\n      \"_updatedAt\": \"2026-04-30T13:31:02.878Z\"\n    }\n  ],\n  \"success\": true\n}\n```"
      operationId: post-api-v1-get-media-calls.state
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      responses:
        '200':
          description: The list of in-flight calls for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: array
                    description: All in-flight calls the authenticated user participates in.
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          format: uuid
                          description: Unique identifier of the call.
                          example: 9f44ec94-2046-4fac-976b-fa8b0e022b08
                        service:
                          type: string
                          enum:
                          - webrtc
                          description: Underlying media service powering the call.
                          example: webrtc
                        kind:
                          type: string
                          enum:
                          - direct
                          description: Call topology.
                          example: direct
                        state:
                          type: string
                          enum:
                          - ringing
                          - active
                          description: 'Current lifecycle state of the call.

                            - `ringing` : invitation sent, callee has not yet answered.

                            - `active` : call accepted and media is flowing.

                            '
                          example: ringing
                        createdBy:
                          type: object
                          description: The actor who created the call.
                          properties:
                            type:
                              type: string
                              example: user
                            id:
                              type: string
                              description: Rocket.Chat user id.
                              example: aEGCdnFoBFCFNdiyX
                            contractId:
                              type: string
                              format: uuid
                              description: Device/session contract id registered with the media-call service.
                              example: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                        createdAt:
                          type: string
                          format: date-time
                          description: When the call record was created on the server.
                          example: '2026-04-30T13:30:53.165Z'
                        caller:
                          type: object
                          description: The party initiating the call. Always carries `contractId`.
                          properties:
                            type:
                              type: string
                              example: user
                            id:
                              type: string
                              example: aEGCdnFoBFCFNdiyX
                            contractId:
                              type: string
                              example: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                            displayName:
                              type: string
                              example: Funke Olasupo
                            username:
                              type: string
                              example: funke.olasupo
                        callee:
                          type: object
                          description: 'The party being called. `contractId` is omitted while

                            the call is `ringing` (no device has answered yet)

                            and populated once accepted.

                            '
                          properties:
                            type:
                              type: string
                              example: user
                            id:
                              type: string
                              example: iaZWAXecuCuBx4FnX
                            contractId:
                              type: string
                              description: Set once the call is accepted.
                              example: 7488b84e-e096-46fb-8d62-1e6e3db479c9
                            displayName:
                              type: string
                              example: Agent1
                            username:
                              type: string
                              example: agent1
                        expiresAt:
                          type: string
                          description: When the current state will expire if no further activity occurs.
                          example: '2026-04-30T13:33:12.993Z'
                        uids:
                          type: array
                          description: User IDs of every participant in the call.
                          items:
                            type: string
                          example:
                          - aEGCdnFoBFCFNdiyX
                          - iaZWAXecuCuBx4FnX
                        ended:
                          type: boolean
                          description: Always `false` for entries returned by this endpoint.
                          example: false
                        callerRequestedId:
                          type: string
                          description: Client-supplied correlation id for the call request.
                          example: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4-38b61a15-8c41-4ee4-be75-977c48cd94ea
                        features:
                          type: array
                          description: Feature flags negotiated for this call.
                          items:
                            type: string
                          example:
                          - audio
                          - screen-share
                          - transfer
                          - hold
                        _updatedAt:
                          type: string
                          description: When the call record was last updated.
                          example: '2026-04-30T13:31:12.993Z'
                        acceptedAt:
                          type: string
                          description: Set once the callee accepts. Absent while ringing.
                          example: '2026-04-30T13:31:10.070Z'
                        activatedAt:
                          type: string
                          description: Set once media becomes active. Absent while ringing.
                          example: '2026-04-30T13:31:12.698Z'
                  success:
                    type: boolean
                    example: true
              examples:
                ringing:
                  summary: Outbound call is still ringing
                  value:
                    calls:
                    - _id: 9f44ec94-2046-4fac-976b-fa8b0e022b08
                      service: webrtc
                      kind: direct
                      state: ringing
                      createdBy:
                        type: user
                        id: aEGCdnFoBFCFNdiyX
                        contractId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                      createdAt: '2026-04-30T13:30:53.165Z'
                      caller:
                        type: user
                        id: aEGCdnFoBFCFNdiyX
                        contractId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                        displayName: Funke Olasupo
                        username: funke.olasupo
                      callee:
                        type: user
                        id: iaZWAXecuCuBx4FnX
                        displayName: Agent1
                        username: agent1
                      expiresAt: '2026-04-30T13:33:02.878Z'
                      uids:
                      - aEGCdnFoBFCFNdiyX
                      - iaZWAXecuCuBx4FnX
                      ended: false
                      callerRequestedId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4-38b61a15-8c41-4ee4-be75-977c48cd94ea
                      features:
                      - audio
                      - screen-share
                      - transfer
                      - hold
                      _updatedAt: '2026-04-30T13:31:02.878Z'
                    success: true
                active:
                  summary: Call has been picked up and is active
                  value:
                    calls:
                    - _id: 9f44ec94-2046-4fac-976b-fa8b0e022b08
                      service: webrtc
                      kind: direct
                      state: active
                      createdBy:
                        type: user
                        id: aEGCdnFoBFCFNdiyX
                        contractId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                      createdAt: '2026-04-30T13:30:53.165Z'
                      caller:
                        type: user
                        id: aEGCdnFoBFCFNdiyX
                        contractId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4
                        displayName: Funke Olasupo
                        username: funke.olasupo
                      callee:
                        type: user
                        id: iaZWAXecuCuBx4FnX
                        contractId: 7488b84e-e096-46fb-8d62-1e6e3db479c9
                        displayName: Agent1
                        username: agent1
                      expiresAt: '2026-04-30T13:33:12.993Z'
                      uids:
                      - aEGCdnFoBFCFNdiyX
                      - iaZWAXecuCuBx4FnX
                      ended: false
                      callerRequestedId: 7b96e74d-1e01-412a-8bcb-145db1bc9ac4-38b61a15-8c41-4ee4-be75-977c48cd94ea
                      features:
                      - audio
                      - screen-share
                      - transfer
                      - hold
                      _updatedAt: '2026-04-30T13:31:12.993Z'
                      acceptedAt: '2026-04-30T13:31:10.070Z'
                      activatedAt: '2026-04-30T13:31:12.698Z'
                    success: true
                empty:
                  summary: User has no in-flight calls
                  value:
                    calls: []
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
tags:
- name: Settings
