            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                  success:
                    type: boolean
              examples:
                Example 1:
                  value:
                    data:
                    - key: pexip
                      label: Pexip
                    - key: googlemeet
                      label: GoogleMeet
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: get-api-v1-video-conference.providers
      description: "Get the list of available video conference providers in your workspace, regardless of their active status. Rate limiting: 3 requests per 1000ms.\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/video-conference.providers \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"data\": [\n    {\n      \"key\": \"pexip\",\n      \"label\": \"Pexip\"\n    },\n    {\n      \"key\": \"googlemeet\",\n      \"label\": \"GoogleMeet\"\n    }\n  ],\n  \"success\": true\n}\n```"
