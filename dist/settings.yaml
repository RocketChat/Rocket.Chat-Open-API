      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/premium.svg\" alt=\"Premium tag\" style=\"display: block; margin: auto;\"></div>\n\nRetrieve the sessions of all users on the workspace. This endpoint requires 2FA.\nPermission required: `view-device-management`\n\n### Changelog\n| Version      | Description |\n| ------------ | ------------|\n|5.0.0         | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/sessions/list.all?filter=windows&offset=50&count=50' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"sessions\": [\n    {\n      \"sessionId\": \"o94SveQp6fyPsoiNC\",\n      \"userId\": \"2tTEqR7ZNMJ4HGGNa\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \"113.0.0\"\n      },\n      \"host\": \"localhost:3000\",\n      \"ip\": \"172.20.0.2\",\n      \"loginAt\": \"2023-05-24T00:25:54.234Z\",\n      \"_user\": {\n        \"username\": \"testroxie\",\n        \"name\": \"Test\"\n      },\n      \"_id\": \"o94SveQp6fyPsoiNC\"\n    },\n    {\n      \"sessionId\": \"BdSrCZXNKCbRi8Eqn\",\n      \"userId\": \"rbAXPnMktTFbNpwtJ\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \"113.0.0\"\n      },\n      \"host\": \"localhost:3000\",\n      \"ip\": \"172.20.0.2\",\n      \"loginAt\": \"2023-05-24T00:25:52.246Z\",\n      \"_user\": {\n        \"username\": \"test.test\",\n        \"name\": \"test test\"\n      },\n      \"_id\": \"BdSrCZXNKCbRi8Eqn\"\n    },\n    {\n      \"sessionId\": \"tTouumJMrHMjnedWf\",\n      \"userId\": \"GonjPyg3gB3Z9ur9s\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \"113.0.0\"\n      },\n      \"host\": \"localhost:3000\",\n      \"ip\": \"172.20.0.2\",\n      \"loginAt\": \"2023-05-23T19:14:29.865Z\",\n      \"_user\": {\n        \"name\": \"test\",\n        \"username\": \"test.test\"\n      },\n      \"_id\": \"tTouumJMrHMjnedWf\"\n    },\n    {\n      \"sessionId\": \"7ykYEK3KWnk4EeA7s\",\n      \"userId\": \"2tTEqR7ZNMJ4HGGNa\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \"113.0.0\"\n      },\n      \"host\": \"localhost:3000\",\n      \"ip\": \"172.20.0.2\",\n      \"loginAt\": \"2023-05-23T19:14:28.717Z\",\n      \"_user\": {\n        \"username\": \"testroxie\",\n        \"name\": \"Test\"\n      },\n      \"_id\": \"7ykYEK3KWnk4EeA7s\"\n    },\n    {\n      \"sessionId\": \"jfD6mnHnrEJdPq9MF\",\n      \"userId\": \"stjxrXYBWy3EcDugH\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \"113.0.0\"\n      },\n      \"host\": \"localhost:3000\",\n      \"ip\": \"172.20.0.2\",\n      \"loginAt\": \"2023-05-23T15:21:57.188Z\",\n      \"_user\": {\n        \"username\": \"rocket.agent\",\n        \"name\": \"Rocket Agent\"\n      },\n      \"_id\": \"jfD6mnHnrEJdPq9MF\"\n    },\n    {\n      \"sessionId\": \"2jQnfG74X3EZYL9tj\",\n      \"userId\": \"rYhzFRd2QZjNwAAXX\",\n      \"device\": {\n        \"type\": \"browser\",\n        \"name\": \"Chrome\",\n        \"longVersion\": \"113.0.0.0\",\n        \"os\": {\n          \"name\": \"Windows\",\n          \"version\": \"10\"\n        },\n        \"version\": \n  ... (truncated)\n```"
