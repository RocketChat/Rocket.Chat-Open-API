      description: "Process the data from the current import operation, creating the users on Rocket.Chat. It requires the current import operation state to be `ready` and it changes the operation state to `importing`. It will return success if the conditions to start the process are met, without waiting for the import to finish.\nPermission required: `run-import`\n\n1. If a user can not be imported successfully it'll be flagged but the operation will not stop.\n2. If a user's email or username is already in use, it will not be created.\n3. Only the users that were imported successfully will be removed from the staging area.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|6.3.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/import.run \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: string
        example: CkCPNctrgCDfmWLqC
        description: The user ID.
      - name: X-Auth-Token
        in: header
        required: true
        schema:
          type: string
        example: 1Dd4iN_ClKn5jl-xPC36snQ4s9Zd5GZnXCQuCNSKcVE
        description: The authentication token.
      tags:
      - Bulk User Import
  /api/v1/import.status:
    parameters: []
    get:
      summary: Get Import Operation Status
      operationId: get-api-v1-import.status
      responses:
        '200':
          description: "The following operation statuses are possible for the operation:\n  * `none`: No import operation was ever created.\n  * `new`: An operation was created but no data was added to it.\n  * `loading`: A traditional importer is currently loading data from a file to the import operation.\n  * `ready`: An operation was created and has data ready to import.\n  * `importing`: The import operation is running and the users are being created.\n  * `error`: An error caused the operation to stop running.\n  * `canceled`: The operation was interrupted by an administrator.\n  * `done`: The operation was completed successfully.\n\n  Note the following points:\n    1. The operation is considered successful if it processes every user in the staging area, even if no user is imported.\n    2. You can check how many users have been imported or failed to import with the `operation.count.completed` and `operation.count.error` attributes.\n    3. The data from users that failed to import will remain in the staging area after the operation is complete.\n    4. While the operation is running, the values on `operation.count` are only updated once after every 50 users are processed."
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  operation:
                    type: object
                    properties:
                      _id:
                        type: string
                      type:
                        type: string
                      importerKey:
                        type: string
                      ts:
                        type: string
                      status:
                        type: string
                      valid:
                        type: boolean
                      user:
                        type: string
                      _updatedAt:
                        type: string
                      count:
                        type: object
                        properties:
                          total:
                            type: integer
                          users:
                            type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    state: ready
                    operation:
                      _id: 64d51ea91558939980aab371
                      type: api
                      importerKey: api
