                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
      operationId: get-api-v1-livechat-livechat-analytics-dashboards-charts-data
      description: "View the Omnichannel analytics chart data by chart name within a specific duration. On the workspace UI, you can access this feature by going to `Manage` > `Omnichannel` > `Analytics`.\n\nPermission required: `view-livechat-manager`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.11.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/livechat/livechat/analytics/dashboards/charts-data?start=2025-01-01&end=2025-10-01&chartName=Total_conversations&departmentId=64181a0728384134ed600dcc' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"chartLabel\": \"Total_conversations\",\n  \"dataLabels\": [\n    \"10/1\",\n    \"10/2\",\n    \"10/3\",\n    \"10/4\",\n    \"10/5\",\n    \"10/6\"\n  ],\n  \"dataPoints\": [\n    0,\n    0,\n    0,\n    0,\n    0,\n    0\n  ],\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - schema:
          type: string
          example: '2025-01-01'
        in: query
        name: start
        description: 'Enter the start date from which you want to view the data. Format: YYYY-MM-DD'
        required: true
      - schema:
          type: string
          example: '2025-10-01'
        in: query
        name: end
        description: 'Enter the end date till which you want to view the data. Format: YYYY-MM-DD'
        required: true
      - schema:
          type: string
          example: Total_conversations
        in: query
        name: chartName
        description: "Enter the chart name for which you want to view the analytics. The options are: \n* `Total_conversations`\n* `Avg_chat_duration`\n* `Total_messages`\n* `Avg_first_response_time`\n* `Avg_reaction_time`\n* `Best_first_response_time`\n* `Avg_response_time`"
        required: true
      - schema:
          type: string
          example: 64181a0728384134ed600dcc
        in: query
        name: departmentId
        description: Enter the department ID for which you want to view the analytics.
