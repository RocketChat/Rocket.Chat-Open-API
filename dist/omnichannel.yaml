                name:
                  type: string
                  description: The contact name.
                email:
                  type: string
                  description: The contact email.
                phone:
                  type: string
                  description: The contact phone number.
                contactManager:
                  type: object
                  description: The contact manager's user name.
                  properties:
                    username:
                      type: string
