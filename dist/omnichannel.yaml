    post:
      summary: Update Omnichannel Room
      description: "Edit an Omnichannel room. Update the topic, tags, and other details.\nPermission required: `view-l-room`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|5.3.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/room.saveInfo \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"guestData\": {\n    \"_id\": \"rbAXPnMktTFbNpwtJ\"\n  },\n  \"roomData\": {\n    \"_id\": \"nf52k8bpJ8y7oHmwk\",\n    \"topic\": \"Hmm\",\n    \"tags\": [\n      \"testtags\"\n    ]\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
