  /api/v1/omnichannel/contact:
    post:
      summary: Register or Update Omnichannel Contact
      description: "> **Note:** This endpoint will be replaced. Refer to the new API documentation for [registering](https://developer.rocket.chat/apidocs/register-omnichannel-contacts) and [updating](https://developer.rocket.chat/apidocs/update-omnichannel-contact) contact for updated usage and features.\n\nRegister a guest user as a new omnichannel contact.\nPermission required: `view-l-room`\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/omnichannel/contact \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"token\": \"434lxd7iss8yh8c4m80wh\",\n  \"name\": \"Chris\",\n  \"email\": \"chris@gmail.com\",\n  \"phone\": \"+91123456788\",\n  \"contactManager\": {\n    \"username\": \"kim.jane\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"contact\": \"7ipCD6NDtkkRDCiNM\",\n  \"success\": true\n}\n```"
      operationId: post-api-v1-omnichannel-contact
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
