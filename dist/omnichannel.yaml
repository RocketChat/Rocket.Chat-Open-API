  /api/v1/livechat/rooms:
    get:
      summary: Get List of Omnichannel Rooms
      description: "Retrieves a list of Omnichannel rooms. You can use the available query parameters to filter the response.\nAt least one of the following permissions is required:\n* `view-livechat-rooms`\n* `view-l-room`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.0.0             | Remove support of filtering by agent's username |\n|2.4.0             | Added support to the parameter `roomName`|\n|2.0.0             | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/livechat/rooms?agents=['b32h3b2hhwb25d']&departmentId=AkzpHAvZpdnuchw2a&open=True&createdAt={\"start\": \"2018-01-26T00:11:22.345Z\", \"end\": \"2018-01-26T00:11:22.345Z\"}&closedAt={\"start\": \"2018-01-26T00:11:22.345Z\", \"end\": \"2018-01-26T00:11:22.345Z\"}&tags=['rocket', 'chat']&customFields={\"docId\": \"aobEdbYhXfu5hkeqG\"}&roomName=room-name&onhold=True&queued=example&units=['b32h3b2hhwb25d', 'b32h3b2aaaa']&offset=50&count=25' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"rooms\": [\n    {\n      \"_id\": \"9dQMveZhqxiDgCM3B\",\n      \"msgs\": 1,\n      \"usersCount\": 1,\n      \"lm\": \"2019-08-09T20:18:02.350Z\",\n      \"fname\": \"Marcos Defendi\",\n      \"t\": \"l\",\n      \"ts\": \"2019-08-09T20:18:02.108Z\",\n      \"v\": {\n        \"_id\": \"xh45w4y7oPW5SiMJu\",\n        \"username\": \"guest-4\",\n        \"token\": \"xn5hdkyptei11m07f3me\",\n        \"status\": \"online\"\n      },\n      \"servedBy\": {\n        \"_id\": \"3kyWm8PsmwhC7xgwg\",\n        \"username\": \"marcos\",\n        \"ts\": \"2019-08-09T20:18:02.109Z\"\n      },\n      \"cl\": false,\n      \"open\": true,\n      \"waitingResponse\": true,\n      \"departmentId\": \"xnmXQmytuvxp2TuSC\",\n      \"_updatedAt\": \"2019-08-09T20:19:34.856Z\",\n      \"lastMessage\": {\n        \"_id\": \"TBEz7zSCBaKsfyrzc\",\n        \"rid\": \"9dQMveZhqxiDgCM3B\",\n        \"msg\": \"Hello\",\n        \"token\": \"xn5hdkyptei11m07f3me\",\n        \"alias\": \"Marcos Defendi\",\n        \"ts\": \"2019-08-09T20:18:02.350Z\",\n        \"u\": {\n          \"_id\": \"xh45w4y7oPW5SiMJu\",\n          \"username\": \"guest-4\",\n          \"name\": \"Marcos Defendi\"\n        },\n        \"_updatedAt\": \"2019-08-09T20:18:02.383Z\",\n        \"mentions\": [],\n        \"channels\": [],\n        \"newRoom\": false,\n        \"showConnecting\": false\n      },\n      \"metrics\": {\n        \"v\": {\n          \"lq\": \"2019-08-09T20:18:02.350Z\"\n        }\n      },\n      \"livechatData\": {\n        \"docId\": \"0310584343112\"\n      },\n      \"tags\": [\n        \"rocket\",\n        \"chat\"\n      ],\n      \"name\": \"Marcos Defendi\"\n    }\n  ],\n  \"count\": 1,\n  \"offset\": 1,\n  \"total\": 7,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-livechat-rooms
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: agents
        in: query
        description: A list of agent IDs.
        schema:
          type: array
          items:
            type: string
        example: '[''b32h3b2hhwb25d'']'
      - name: departmentId
        in: query
        description: The department ID. You can also enter multiple IDs as an array of string values.
        schema:
          type: string
        example: AkzpHAvZpdnuchw2a
      - name: open
        in: query
        description: If it should filter by open/closed rooms.
        schema:
          type: boolean
        example: true
      - name: createdAt
        in: query
        description: An object representing when the room was created (can also be filtered only with `start` or `end`).
        schema:
          type: string
        example: '{"start": "2018-01-26T00:11:22.345Z", "end": "2018-01-26T00:11:22.345Z"}'
      - name: closedAt
        in: query
        description: An object representing when the room was closed (can also be filtered only with `start` or `end`).
        schema:
          type: string
        example: '{"start": "2018-01-26T00:11:22.345Z", "end": "2018-01-26T00:11:22.345Z"}'
      - name: tags
        in: query
        description: A list of tags.
        schema:
          type: string
        example: '[''rocket'', ''chat'']'
      - name: customFields
        in: query
        description: An object with custom fields to be filtered (previously created and populated at custom fields endpoints)
        schema:
          type: string
        example: '{"docId": "aobEdbYhXfu5hkeqG"}'
      - name: roomName
        in: query
        description: The room's name.
        schema:
          type: string
        example: room-name
      - schema:
          type: boolean
        in: query
        name: onhold
        description: Whether you want to include rooms that are on hold or not.
      - schema:
          type: string
        in: query
        name: queued
        description: Whether you want to include queued rooms or not.
      - schema:
          type: array
          items:
            type: string
        example: '[''b32h3b2hhwb25d'', ''b32h3b2aaaa'']'
        in: query
        name: units
        description: Enter the unit IDs you want to include as an array of string values.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 25
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: sort
        in: query
        required: false
        schema:
          format: object
        description: 'List of fields to order by, and in which direction. JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, sort = `{"value": -1, "_id": 1}`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
      - name: fields
        in: query
        schema: {}
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: fields = `{"username": 1}`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      - name: query
        in: query
        required: false
        schema: {}
        description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": query = `{ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more. '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        msgs:
                          type: integer
                        usersCount:
                          type: integer
                        lm:
                          type: string
                        fname:
                          type: string
                        t:
                          type: string
                        ts:
                          type: string
                        v:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                            token:
                              type: string
                            status:
                              type: string
                        servedBy:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                            ts:
                              type: string
                        cl:
                          type: boolean
                        open:
                          type: boolean
                        waitingResponse:
                          type: boolean
                        departmentId:
                          type: string
                        _updatedAt:
                          type: string
                        lastMessage:
                          type: object
                          properties:
                            _id:
                              type: string
                            rid:
                              type: string
                            msg:
                              type: string
                            token:
                              type: string
                            alias:
                              type: string
                            ts:
                              type: string
                            u:
                              type: object
                              properties:
                                _id:
                                  type: string
                                username:
                                  type: string
                                name:
                                  type: string
                            _updatedAt:
                              type: string
                            mentions:
                              type: array
                              items:
                                type: object
                            channels:
                              type: array
                              items:
                                type: object
                            newRoom:
                              type: boolean
                            showConnecting:
                              type: boolean
                        metrics:
                          type: object
                          properties:
                            v:
                              type: object
                              properties:
                                lq:
                                  type: string
                        livechatData:
                          type: object
                          properties:
                            docId:
                              type: string
                        tags:
                          type: array
                          items:
                            type: string
                        name:
                          type: string
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    rooms:
                    - _id: 9dQMveZhqxiDgCM3B
                      msgs: 1
                      usersCount: 1
                      lm: '2019-08-09T20:18:02.350Z'
                      fname: Marcos Defendi
                      t: l
                      ts: '2019-08-09T20:18:02.108Z'
                      v:
                        _id: xh45w4y7oPW5SiMJu
                        username: guest-4
                        token: xn5hdkyptei11m07f3me
                        status: online
                      servedBy:
                        _id: 3kyWm8PsmwhC7xgwg
                        username: marcos
