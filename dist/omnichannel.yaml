openapi: 3.0.0
info:
  version: 1.0.0
  title: Omnichannel
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/livechat/users/{type}:
    post:
      summary: Register New Agent or Manager
      description: "Register a new <a href='https://docs.rocket.chat/use-rocket.chat/omnichannel/agents' target='_blank'>agent</a> or <a href='https://docs.rocket.chat/use-rocket.chat/omnichannel/managers' target='_blank'>manager</a>.\nPermission required: `view-livechat-manager`\n\n### Changelog\n| Version      | Description |\n| ------------ | ------------|\n|0.42.0        | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/users/{type} \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"username\": \"john.doe\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"SQafHvoFPuB57NmBD\",\n    \"username\": \"john.doe\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-livechat-users-:type
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: type
        in: path
        description: The type of user that you want to register. The value can either be `agent` or `manager`.
        required: true
        schema:
          type: string
        example: agent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The user name that you want to register.
              required:
              - username
            examples:
              Example 1:
                value:
                  username: john.doe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      username:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    user:
                      _id: SQafHvoFPuB57NmBD
                      username: john.doe
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'username' [invalid-params]
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
                Unauthorized:
                  value:
                    success: false
                    error: unauthorized
      tags:
      - Omnichannel Users
    get:
      summary: Get List of Agents or Managers
      description: "* If the `type` is `manager`, permission required: `view-livechat-manager`.\n* If the `type` is `agent`, permission required: at least one of `transfer-livechat-guest` or `edit-omnichannel-contact`.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|2.2.0             | Added support to pagination       |\n|0.42.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/livechat/users/{type}?offset=50&count=25&onlyAvailable=True&showIdleAgents=False&excludeId=Ahgfwk9sasYEsMjwX&text=True' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"users\": [\n    {\n      \"_id\": \"XLzGrYF9L2miSpPHP\",\n      \"username\": \"dialog.bot\",\n      \"status\": \"offline\",\n      \"statusLivechat\": \"not-available\",\n      \"name\": \"Dialog Bot\",\n      \"emails\": [\n        {\n          \"address\": \"dialog.bot@test.com\",\n          \"verified\": true\n        }\n      ],\n      \"livechat\": null,\n      \"departments\": []\n    },\n    {\n      \"_id\": \"rbAXPnMktTFbNpwtJ\",\n      \"username\": \"john.doe\",\n      \"status\": \"offline\",\n      \"statusLivechat\": \"available\",\n      \"name\": \"John Doe\",\n      \"emails\": [\n        {\n          \"address\": \"john.doe@gmail.com\",\n          \"verified\": true\n        }\n      ],\n      \"livechat\": {\n        \"maxNumberSimultaneousChat\": \"\"\n      },\n      \"departments\": [\n        \"64181a0728384134ed600dcc\"\n      ]\n    },\n    {\n      \"_id\": \"hFDuCPam7sWziWFYa\",\n      \"username\": \"hookdeck.write\",\n      \"status\": \"offline\",\n      \"statusLivechat\": \"not-available\",\n      \"name\": \"Hookdeck Write\",\n      \"emails\": [\n        {\n          \"address\": \"hookdeckwrite@gmail.com\",\n          \"verified\": true\n        }\n      ],\n      \"livechat\": null,\n      \"departments\": []\n    },\n    {\n      \"_id\": \"stjxrXYBWy3EcDugH\",\n      \"username\": \"rocket.agent\",\n      \"status\": \"offline\",\n      \"statusLivechat\": \"not-available\",\n      \"name\": \"Rocket Agent\",\n      \"emails\": [\n        {\n          \"address\": \"rocket.agent@rocket.chat\",\n          \"verified\": false\n        }\n      ],\n      \"livechat\": {\n        \"maxNumberSimultaneousChat\": \"\"\n      },\n      \"departments\": [\n        \"64181a0728384134ed600dcc\"\n      ]\n    }\n  ]\n}\n```"
      operationId: get-api-v1-livechat-users-type
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 25
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: sort
        in: query
        required: false
        schema:
          format: object
        description: 'List of fields to order by, and in which direction. JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, sort = `{"value": -1, "_id": 1}`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
      - name: type
        in: path
        description: The type of user that you want to register. The value can either be `agent` or `manager`.
        required: true
        schema:
          type: string
        example: agent
      - name: onlyAvailable
        in: query
        schema:
          type: boolean
        description: When set to `true`, it only list agents whose [livechat status](https://docs.rocket.chat/docs/omnichannel-users#edit-agent) (`statusLivechat`) is `available`.
        example: true
      - name: showIdleAgents
        in: query
        schema:
          type: boolean
        description: When set to `false`, offline agents will be excluded from the response. This filter does not apply to bots. All bot agents will be returned in the response.
        example: false
      - name: excludeId
        in: query
        schema:
          type: string
        example: Ahgfwk9sasYEsMjwX
        description: The ID of a specific agent to exclude from the list.
      - name: text
        in: query
        schema:
          type: string
        description: Enter the text you want to filter the search result with.
        example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        username:
                          type: string
                        status:
                          type: string
                        statusLivechat:
                          type: string
                        name:
                          type: string
                        emails:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                              verified:
                                type: boolean
                        livechat:
                          type: string
                        departments:
                          type: array
                          items:
                            type: string
              examples:
                Success Example:
                  value:
                    users:
                    - _id: XLzGrYF9L2miSpPHP
                      username: dialog.bot
                      status: offline
                      statusLivechat: not-available
                      name: Dialog Bot
                      emails:
                      - address: dialog.bot@test.com
                        verified: true
                      livechat: null
                      departments: []
                    - _id: rbAXPnMktTFbNpwtJ
                      username: john.doe
                      status: offline
                      statusLivechat: available
                      name: John Doe
                      emails:
                      - address: john.doe@gmail.com
                        verified: true
                      livechat:
                        maxNumberSimultaneousChat: ''
                      departments:
                      - 64181a0728384134ed600dcc
                    - _id: hFDuCPam7sWziWFYa
                      username: hookdeck.write
                      status: offline
                      statusLivechat: not-available
                      name: Hookdeck Write
                      emails:
                      - address: hookdeckwrite@gmail.com
                        verified: true
                      livechat: null
                      departments: []
                    - _id: stjxrXYBWy3EcDugH
                      username: rocket.agent
                      status: offline
                      statusLivechat: not-available
                      name: Rocket Agent
                      emails:
                      - address: rocket.agent@rocket.chat
                        verified: false
                      livechat:
                        maxNumberSimultaneousChat: ''
                      departments:
                      - 64181a0728384134ed600dcc
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
                Unauthorized:
                  value:
                    success: false
                    error: unauthorized
      tags:
      - Omnichannel Users
  /api/v1/livechat/users/{type}/{_id}:
    get:
      summary: Get Agent or Manager Information
      description: "Get information about a particular agent or a manager.\nPermission required: `view-livechat-manager`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.42.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/livechat/users/{type}/{_id} \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"SQafHvoFPuB57NmBD\",\n    \"username\": \"john.doe\",\n    \"name\": \"John Doe\",\n    \"status\": \"offline\",\n    \"statusLivechat\": \"available\",\n    \"emails\": [\n      {\n        \"address\": \"john.doe@test.com\",\n        \"verified\": \"true\"\n      }\n    ],\n    \"livechat\": {\n      \"maxNumberSimultaneousChat\": \"\"\n    }\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-livechat-users-type-_id
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: type
        in: path
        description: The type of user. The value can either be `agent` or `manager`.
        required: true
        schema:
          type: string
      - name: _id
        in: path
        description: The user ID.
        required: true
        schema:
          type: string
        example: SQafHvoFPuB57NmBD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      username:
                        type: string
                      name:
                        type: string
                      status:
                        type: string
                      statusLivechat:
                        type: string
                      emails:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            verified:
                              type: string
                      livechat:
                        type: object
                        properties:
                          maxNumberSimultaneousChat:
                            type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    user:
                      _id: SQafHvoFPuB57NmBD
                      username: john.doe
                      name: John Doe
                      status: offline
                      statusLivechat: available
                      emails:
                      - address: john.doe@test.com
                        verified: 'true'
                      livechat:
                        maxNumberSimultaneousChat: ''
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
                Unauthorized:
                  value:
                    success: false
                    error: unauthorized
      tags:
      - Omnichannel Users
    delete:
      summary: Remove Agent or Manager
      description: "Remove a user as an agent or a manager.\nPermission required: `view-livechat-manager`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.42.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X DELETE https://<your-workspace-url>/api/v1/livechat/users/{type}/{_id} \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: delete-api-v1-livechat-users-type-_id
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: type
        in: path
        description: The type of user. The value can either be `agent` or `manager`.
        required: true
        schema:
          type: string
      - name: _id
        in: path
        description: The user ID.
        required: true
        schema:
          type: string
        example: SQafHvoFPuB57NmBD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
                Unauthorized:
                  value:
                    success: false
                    error: unauthorized
      tags:
      - Omnichannel Users
  /api/v1/livechat/agent.info/{rid}/{token}:
    get:
      summary: Get Agent Information
      description: "Get the Livechat agent data according to the path variables. To get the `rid` and `token` values, call the <a href=\"https://developer.rocket.chat/apidocs/get-rooms\" target=\"_blank\">Get Rooms</a> endpoint to retrieve the details of all rooms.\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/livechat/agent.info/{rid}/{token}\n```\n\n### Example success response\n\n```json\n{\n  \"agent\": {\n    \"_id\": \"XycfA5CetCPuEjqxw\",\n    \"emails\": [\n      {\n        \"address\": \"agent@rocket.chat\",\n        \"verified\": true\n      }\n    ],\n    \"status\": \"online\",\n    \"name\": \"testAgent\",\n    \"username\": \"test.agent\",\n    \"livechat\": {\n      \"maxNumberSimultaneousChat\": \"5\"\n    }\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-livechat-agent
      parameters:
      - name: rid
        in: path
        description: The room ID.
        required: true
        schema:
          type: string
        example: zRAeTszXor8CCPceB
      - name: token
        in: path
        description: The visitor token.
        required: true
        schema:
          type: string
        example: iNKE8a6k6cjbqWhWd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
                    properties:
                      _id:
                        type: string
                      emails:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            verified:
                              type: boolean
                      status:
                        type: string
                      name:
                        type: string
                      username:
                        type: string
                      livechat:
                        type: object
                        properties:
                          maxNumberSimultaneousChat:
                            type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    agent:
                      _id: XycfA5CetCPuEjqxw
                      emails:
                      - address: agent@rocket.chat
                        verified: true
                      status: online
                      name: testAgent
                      username: test.agent
                      livechat:
                        maxNumberSimultaneousChat: '5'
                    success: true
      tags:
      - Omnichannel Agents
  /api/v1/livechat/agent.next/{token}:
    get:
      summary: Get Next Agent Information
      description: "Get information about the next available agent for an incoming conversation. This endpoint returns the available agents who have not been assigned to any chat yet. To get the `token` value, call the <a href=\"https://developer.rocket.chat/apidocs/get-rooms\" target=\"_blank\">Get Rooms</a> endpoint to retrieve the details of all rooms.\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/livechat/agent.next/{token}\n```\n\n### Example success response\n\n```json\n{\n  \"agent\": {\n    \"_id\": \"7Gm3PoFCJWTCJ68XR\",\n    \"emails\": [\n      {\n        \"address\": \"agent@rocket.chat\",\n        \"verified\": true\n      }\n    ],\n    \"name\": \"Livechat Agent\",\n    \"username\": \"livechat.agent\"\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-livechat-agent.next
      parameters:
      - name: token
        in: path
        description: The visitor token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
                    properties:
                      _id:
                        type: string
                      emails:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            verified:
                              type: boolean
                      name:
                        type: string
                      username:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    agent:
                      _id: 7Gm3PoFCJWTCJ68XR
                      emails:
                      - address: agent@rocket.chat
                        verified: true
                      name: Livechat Agent
                      username: livechat.agent
                    success: true
      tags:
      - Omnichannel Agents
  /api/v1/livechat/agents.saveInfo:
    post:
      summary: Update Agent Info
      tags:
      - Omnichannel Agents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-livechat-agents.saveInfo
      description: "Update an Omnichannel agent's information. Permission required: `manage-livechat-agents`.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.11.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/agents.saveInfo \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"agentId\": \"4zqiF9BSWmBTe6yvt\",\n  \"agentData\": {},\n  \"agentDepartments\": [\n    \"\"\n  ]\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - agentId
              - agentData
              - agentDepartments
              properties:
                agentId:
                  type: string
                  description: Enter the agent's ID.
                agentData:
                  type: object
                  description: Enter the agent data that you want to update.
                agentDepartments:
                  type: array
                  description: Enter the agent's departments. You can leave it as an empty string if you don't want to add any departments.
                  items:
                    type: string
            examples:
              Example 1:
                value:
                  agentId: 4zqiF9BSWmBTe6yvt
                  agentData: {}
                  agentDepartments:
                  - ''
  /api/v1/livechat/agent.status:
    post:
      summary: Update Agent Status
      tags:
      - Omnichannel Agents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
