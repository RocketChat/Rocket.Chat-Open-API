  /api/v1/canned-responses:
    post:
      tags:
      - Canned Responses
      summary: Create or Update a Canned Response
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Enterprise%20tag.svg\" alt=\"Enterprise\" style=\"display: block; margin: auto;\"></div>\n\nTo create and update <a href='https://docs.rocket.chat/docs/canned-responses' target='_blank'>canned responses</a>, the following permissions are required:\n* `save-canned-responses`\n* `save-all-canned-responses`\n\n### Changelog\n| Version      | Description |\n| ------------ | ------------|\n|1.0.0         | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/canned-responses \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"shortcut\": \"test-canned\",\n  \"text\": \"This is an example test for canned response\",\n  \"scope\": \"global\",\n  \"tags\": [\n    \"tag1\",\n    \"tag2\"\n  ]\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-canned-responses
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - shortcut
              - text
              - scope
              properties:
                shortcut:
                  type: string
                  description: The shortcut to trigger the message snippet.
                text:
                  type: string
                  description: The message snippet.
                scope:
                  type: string
                  description: The scope of the canned response. It can either be global, user or department.
                tags:
                  type: array
                  description: The tags for your canned response.
                  items:
                    type: string
                departmentId:
                  type: string
                  description: The departmentId where the canned response belongs to. It is required if the scope is department.
                _id:
                  type: string
                  description: The canned response's ID.
            examples:
              Example 1:
                value:
                  shortcut: test-canned
                  text: This is an example test for canned response
                  scope: global
                  tags:
                  - tag1
                  - tag2
        description: 'Note: To update a canned response, the `_id` parameter is required along with the other required parameters. This parameter is not used to create a canned response.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'shortcut' [invalid-params]
                    errorType: invalid-params
                Example 2:
                  value:
                    success: false
                    error: must have required property 'scope' [invalid-params]
                    errorType: invalid-params
                Example 3:
                  value:
                    success: false
                    error: Shortcut provided already exists [error-invalid-shortcut]
                    errorType: error-invalid-shortcut
                    details:
                      method: saveCannedResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
                Unauthorized:
                  value:
                    success: false
                    error: unauthorized
    get:
