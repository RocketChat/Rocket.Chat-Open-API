                  description: The visitor token.
                  example: iNKE8a6k6cjbqWhWd
              required:
              - rid
              - token
            examples:
              Example 1:
                value:
                  rid: XFzMqgn33DcsQkpJp
                  token: iNKE8a6k6cjbqWhWd
  /api/v1/livechat/room.closeByUser:
    post:
      summary: Close Omnichannel Room
      description: "If you are an Omnichannel user (agent, manager), use this endpoint to close the room.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/room.closeByUser \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"rid\": \"8ceKgWvo5qT5TrCRN\",\n  \"comment\": \"close via API\",\n  \"tags\": [\n    \"abc\",\n    \"abc\"\n  ],\n  \"transcriptEmail\": {\n    \"sendToVisitor\": true,\n    \"requestData\": {\n      \"email\": \"test@example.com\",\n      \"subject\": \"transcript\"\n    }\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-livechat-room.closeByUser
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid parameter:
                  value:
                    success: false
                    error: must have required property 'rid' [invalid-params]
                    errorType: invalid-params
                Room already closed:
                  value:
                    success: false
                    error: error-room-already-closed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      tags:
      - Omnichannel Rooms
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - rid
              properties:
                rid:
                  type: string
                  description: Enter the room ID.
                  example: 8ceKgWvo5qT5TrCRN
                comment:
                  type: string
                  description: Add a description for closing the room. It is required when the [`Request comment when closing conversation`](https://docs.rocket.chat/docs/omnichannel-admins-guide) setting is enabled.
                forceClose:
                  type: boolean
                  description: Use this parameter to forcefully close a room. Before using this parameter, make sure to enable the [`Force Close Conversation API`](https://docs.rocket.chat/v1/docs/omnichannel-admins-guide#api) setting in **Manage > Workspace > Settings > Omnichannel > API**. Exercise caution when using this parameter and reserve it for situations involving misconfigured rooms.
                tags:
                  type: array
                  description: Add [tags](https://docs.rocket.chat/docs/tags).
                  items:
                    type: string
                generateTranscriptPdf:
                  type: boolean
                  description: Enter whether you want to generate a conversation transcript PDF.
                transcriptEmail:
                  type: object
                  properties:
                    sendToVisitor:
                      type: boolean
                      description: Enter whether you want to send the transcript to the visitor.
                    requestData:
                      type: object
                      properties:
                        email:
                          type: string
                          description: Enter the visitor's email ID to whom you want to send the transcript.
                        subject:
                          type: string
                          description: Enter a subject for the email.
            examples:
              Example:
                value:
                  rid: 8ceKgWvo5qT5TrCRN
                  comment: close via API
                  tags:
                  - abc
                  - abc
                  transcriptEmail:
                    sendToVisitor: true
                    requestData:
                      email: test@example.com
                      subject: transcript
