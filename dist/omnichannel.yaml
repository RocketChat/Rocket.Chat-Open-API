      summary: List All Canned Responses
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Enterprise%20tag.svg\" alt=\"Enterprise\" style=\"display: block; margin: auto;\"></div>\n\nGet a list of all canned responses in the workspace.\n\nPermissions required:\n- `view-canned-responses`\n- `view-all-canned-responses`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|1.0.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/canned-responses?shortcut=example&text=example&scope=example&tags=example&departmentId=example&offset=50&count=25&createdBy=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"cannedResponses\": [\n    {\n      \"_id\": \"646c747ca8c3a3ba32d0e2e8\",\n      \"shortcut\": \"Denied\",\n      \"text\": \"This is an example\",\n      \"scope\": \"global\",\n      \"createdBy\": {\n        \"_id\": \"rbAXPnMktTFbNpwtJ\",\n        \"username\": \"kim.jane\"\n      },\n      \"_createdAt\": \"2023-05-23T08:08:28.241Z\",\n      \"_updatedAt\": \"2023-05-23T08:08:28.241Z\"\n    },\n    {\n      \"_id\": \"646c6ed9a8c3a3ba32d0e2db\",\n      \"shortcut\": \"my-new-canned\",\n      \"text\": \"This is an example\",\n      \"scope\": \"global\",\n      \"tags\": [\n        \"failed\",\n        \"card\"\n      ],\n      \"createdBy\": {\n        \"_id\": \"rbAXPnMktTFbNpwtJ\",\n        \"username\": \"doe.john\"\n      },\n      \"_createdAt\": \"2023-05-23T07:44:25.912Z\",\n      \"_updatedAt\": \"2023-05-23T07:44:25.912Z\"\n    },\n    {\n      \"_id\": \"646c7350a8c3a3ba32d0e2e0\",\n      \"shortcut\": \"my-new-canned-\",\n      \"text\": \"This is an example\",\n      \"scope\": \"hi\",\n      \"tags\": [\n        \"failed\",\n        \"card\"\n      ],\n      \"createdBy\": {\n        \"_id\": \"rbAXPnMktTFbNpwtJ\",\n        \"username\": \"jane.mary\"\n      },\n      \"_createdAt\": \"2023-05-23T08:03:28.148Z\",\n      \"_updatedAt\": \"2023-05-23T08:03:28.148Z\"\n    }\n  ],\n  \"count\": 3,\n  \"offset\": 0,\n  \"total\": 3,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-canned-responses
