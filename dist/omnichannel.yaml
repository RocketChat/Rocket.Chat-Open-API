  /api/v1/omnichannel/integrations:
    post:
      summary: Set up Omnichannel webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
      operationId: post-api-v1-omnichannel-integrations
      tags:
      - Omnichannel Webhooks
      description: "Set up a [webhook](https://docs.rocket.chat/docs/webhooks) to easily integrate Omnichannel with your CRM. Permission required: `view-livechat-manager`.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/omnichannel/integrations \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"LivechatWebhookUrl\": \"https://webhook/d548683u3-7f38ow-48ba-ieooefa-oejiduiw\",\n  \"LivechatSecretToken\": \"\",\n  \"LivechatHttpTimeout\": 5000,\n  \"LivechatWebhookOnStart\": true,\n  \"LivechatWebhookOnClose\": true,\n  \"LivechatWebhookOnChatTaken\": true,\n  \"LivechatWebhookOnChatQueued\": false,\n  \"LivechatWebhookOnForward\": false,\n  \"LivechatWebhookOnOfflineMsg\": true,\n  \"LivechatWebhookOnVisitorMessage\": true,\n  \"LivechatWebhookOnAgentMessage\": true\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                LivechatWebhookUrl:
                  type: string
                  description: The destination webhook URL where the data will be sent.
                LivechatSecretToken:
                  type: string
                  description: A secret token that can be used to verify the webhook.
                LivechatHttpTimeout:
                  type: integer
                  description: The request timeout value
                LivechatWebhookOnStart:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a new chat starts.
                LivechatWebhookOnClose:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a chat is closed.
                LivechatWebhookOnChatTaken:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a chat is taken.
                LivechatWebhookOnChatQueued:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a chat is queued.
                LivechatWebhookOnForward:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a chat is forwarded.
                LivechatWebhookOnOfflineMsg:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time offline messages are sent.
                LivechatWebhookOnVisitorMessage:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time a visitor sends a message.
                LivechatWebhookOnAgentMessage:
                  type: boolean
                  description: When set to true, data is sent to the configured webhook URL each time an agent sends a message.
            examples:
              WebhookData:
                value:
                  LivechatWebhookUrl: https://webhook/d548683u3-7f38ow-48ba-ieooefa-oejiduiw
                  LivechatSecretToken: ''
                  LivechatHttpTimeout: 5000
                  LivechatWebhookOnStart: true
                  LivechatWebhookOnClose: true
                  LivechatWebhookOnChatTaken: true
                  LivechatWebhookOnChatQueued: false
                  LivechatWebhookOnForward: false
                  LivechatWebhookOnOfflineMsg: true
                  LivechatWebhookOnVisitorMessage: true
                  LivechatWebhookOnAgentMessage: true
  /api/v1/livechat/webhook.test:
    post:
      summary: Test the Webhook Integration
      tags:
      - Omnichannel Webhooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
      operationId: post-api-v1-livechat-webhook.test
      description: "This endpoint sends sample data to test whether the [configured webhook URL](https://docs.rocket.chat/docs/webhooks) is functioning correctly. Permission required: `view-livechat-webhooks`.\n\nThe data you can expect on your webhook for this test follows this format:\n```\n{\n  \"type\": \"LivechatSession\",\n  \"_id\": \"fasd6f5a4sd6f8a4sdf\",\n  \"label\": \"title\",\n  \"topic\": \"asiodojf\",\n  \"createdAt\": \"2024-09-18T12:22:02.975Z\",\n  \"lastMessageAt\": \"2024-09-18T12:22:02.975Z\",\n  \"tags\": [\n    \"tag1\",\n    \"tag2\",\n    \"tag3\"\n  ],\n  \"customFields\": {\n    \"productId\": \"123456\"\n  },\n  \"visitor\": {\n    \"_id\": \"\",\n    \"name\": \"visitor name\",\n    \"username\": \"visitor-username\",\n    \"department\": \"department\",\n    \"email\": \"email@address.com\",\n    \"phone\": \"192873192873\",\n    \"ip\": \"123.456.7.89\",\n    \"browser\": \"Chrome\",\n    \"os\": \"Linux\",\n    \"customFields\": {\n      \"customerId\": \"123456\"\n    }\n  },\n  \"agent\": {\n    \"_id\": \"asdf89as6df8\",\n    \"username\": \"agent.username\",\n    \"name\": \"Agent Name\",\n    \"email\": \"agent@email.com\"\n  },\n  \"messages\": [\n    {\n      \"username\": \"visitor-username\",\n      \"msg\": \"message content\",\n      \"ts\": \"2024-09-18T12:22:02.975Z\"\n    },\n    {\n      \"username\": \"agent.username\",\n      \"agentId\": \"asdf89as6df8\",\n      \"msg\": \"message content from agent\",\n      \"ts\": \"2024-09-18T12:22:02.975Z\"\n    }\n  ]\n}\n```\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/webhook.test \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
