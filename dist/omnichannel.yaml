                          type: string
                        sortItem:
                          type: integer
                        dirty:
                          type: boolean
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    priorities:
                    - _id: 64007cc2fa0ed7dd905092e3
                      i18n: Lowest
                      sortItem: 5
                      dirty: false
                    - _id: 64007cc2fa0ed7dd905092e4
                      i18n: Low
                      sortItem: 4
                      dirty: false
                    - _id: 64007cc2fa0ed7dd905092e5
                      i18n: Medium
                      sortItem: 3
                      dirty: false
                    - _id: 64007cc2fa0ed7dd905092e6
                      i18n: High
                      sortItem: 2
                      dirty: false
                    - _id: 64007cc2fa0ed7dd905092e7
                      i18n: Highest
                      sortItem: 1
                      dirty: false
                    count: 5
                    offset: 0
                    total: 5
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
