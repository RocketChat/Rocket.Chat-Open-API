      operationId: get-api-v1-livechat-visitors.searchChats-room-roomId-visitor-visitorId
      description: "Get the Livechat information of a visitor. This endpoint returns only those chats that are served and closed.\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/livechat/visitors.searchChats/room/{roomId}/visitor/{visitorId}?offset=50&count=25&searchText=example&closedChatsOnly=example&servedChatsOnly=example&source=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"history\": [\n    {\n      \"_id\": \"hhMKhHnnbY79mGs9K\",\n      \"msgs\": 2,\n      \"fname\": \"Maria\",\n      \"ts\": \"2021-07-22T17:17:04.216Z\",\n      \"v\": {\n        \"_id\": \"QyBAKC5Wc8tcv6cco\",\n        \"username\": \"guest-537\",\n        \"token\": \"8s7e9ony6ctl27e1qf8kue\",\n        \"status\": \"online\",\n        \"lastMessageTs\": \"2021-07-22T17:17:04.937Z\"\n      }\n    }\n  ],\n  \"count\": 1,\n  \"offset\": 0,\n  \"total\": 1,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 25
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - schema: {}
        in: query
        name: sort
        description: 'Sort the events in the ascending (`1`) or descending (`-1`) order. By default, the result is sorted in descending order. The most recent chats are returned first. Enter the value as: `sort[ts]=1` or `sort[ts]=-1`. Here `ts` refers to timestamp.'
      - schema:
          type: string
        in: query
        name: searchText
        description: Enter the text to search for within the chat.
      - schema:
          type: string
        in: query
        name: closedChatsOnly
        description: Filter the results to display only closed chats. The value can be `"true"` or `"false"`.
      - schema:
          type: string
        in: query
        name: servedChatsOnly
        description: Filter the results to display only chats that are joined by agents. The value can be `"true"` or `"false"`.
      - schema:
          type: string
        in: query
        name: source
        description: 'Filter the results by the source of the chat. The value can be: `widget`, `sms`, `api`, `email`, `app`, `other`.'
