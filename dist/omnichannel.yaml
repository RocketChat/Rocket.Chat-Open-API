              examples:
                Success Example:
                  value:
                    visitor:
                      _id: 6a22b1765528fa64dd29de70
                      username: guest-10
                      status: online
                      ts: '2026-06-05T11:22:30.664Z'
                      _updatedAt: '2026-06-05T11:22:30.665Z'
                      name: Postman Test Visitor
                      phone:
                      - phoneNumber: '+15551234567'
                      token: test-token-12345
                      visitorEmails:
                      - address: postman-test@example.com
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: 'Match error: Missing key ''visitor'''
                Example 2:
                  value:
                    success: false
                    error: 'Match error: Missing key ''token'' in field visitor'
      description: "Register a visitor's information before creating a new Omnichannel room. You can set basic information such as name, phone, custom fields, and the initial department.\n\nThe response may include `externalIds` when the visitor has been linked to an external system by an omnichannel app. This field cannot be set through this endpoint's request body.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.4.0   | Added `externalIds` field to the visitor response. |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/visitor \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"visitor\": {\n    \"name\": \"Livechat Visitor\",\n    \"email\": \"visitor@rocket.chat\",\n    \"department\": \"Support\",\n    \"token\": \"iNKE8a6k6cjbqWhWd\",\n    \"phone\": \"55 51 5555-5555\",\n    \"customFields\": [\n      {\n        \"key\": \"address\",\n        \"value\": \"Rocket.Chat street\",\n        \"overwrite\": true\n      }\n    ]\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"visitor\": {\n    \"_id\": \"6a22b1765528fa64dd29de70\",\n    \"username\": \"guest-10\",\n    \"status\": \"online\",\n    \"ts\": \"2026-06-05T11:22:30.664Z\",\n    \"_updatedAt\": \"2026-06-05T11:22:30.665Z\",\n    \"name\": \"Postman Test Visitor\",\n    \"phone\": [\n      {\n        \"phoneNumber\": \"+15551234567\"\n      }\n    ],\n    \"token\": \"test-token-12345\",\n    \"visitorEmails\": [\n      {\n        \"address\": \"postman-test@example.com\"\n      }\n    ]\n  },\n  \"success\": true\n}\n```"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor:
                  type: object
                  description: Enter the body parameters in the `visitor` object.
                  required:
                  - token
                  properties:
                    name:
                      type: string
                      description: The visitor's name.
                    email:
                      type: string
                      description: The visitor's email.
                    department:
                      type: string
                      description: The department that the visitor wants to register to.
                    token:
                      type: string
                      description: Enter a random unique string as the visitor token.
                    phone:
                      type: string
                      description: The visitor's phone number.
                    username:
                      type: string
                      description: The agent's username.
                    customFields:
                      type: array
                      description: Enter the custom field key, value, and whether you want to overwrite this information.
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            example: address
                          value:
                            type: string
                            example: Rocket.Chat street
                          overwrite:
                            type: boolean
              required:
              - visitor
            examples:
              Example 1:
                value:
                  visitor:
                    name: Livechat Visitor
                    email: visitor@rocket.chat
                    department: Support
                    token: iNKE8a6k6cjbqWhWd
                    phone: 55 51 5555-5555
                    customFields:
                    - key: address
                      value: Rocket.Chat street
                      overwrite: true
