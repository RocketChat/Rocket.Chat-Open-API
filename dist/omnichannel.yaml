      operationId: put-api-v1-livechat-inquiry.setSLA
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The room ID.
                sla:
                  type: string
                  description: Name or ID of the SLA policy.
              required:
              - roomId
              - sla
            examples:
              Example 1:
                value:
                  roomId: ZDYMFPpvnXgptmzMs
                  sla: 6417f67528384134ed600dc6
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
