      description: "Create a new Omnichannel custom field or update an existing custom field. You can refer to the <a href='https://docs.rocket.chat/docs/omnichannel-custom-fields' target='_blank'>Omnichannel Custom Fields</a> user guide for details.\n\nPermission required: `view-livechat-manager`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.11.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/custom-fields.save \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"customFieldData\": {\n    \"field\": \"new1\",\n    \"label\": \"new11\",\n    \"visibility\": true,\n    \"scope\": \"visitor\",\n    \"type\": \"select\",\n    \"searchable\": true,\n    \"regexp\": \"\",\n    \"required\": false,\n    \"defaultValue\": \"\",\n    \"options\": \"optionA, optionB\",\n    \"public\": true\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"customField\": {\n    \"label\": \"address11\",\n    \"scope\": \"visitor\",\n    \"visibility\": \"hidden\",\n    \"type\": \"input\",\n    \"searchable\": true,\n    \"regexp\": \"\",\n    \"required\": false,\n    \"defaultValue\": \"\",\n    \"options\": \"\",\n    \"public\": true,\n    \"_updatedAt\": \"2025-10-06T06:52:40.102Z\"\n  },\n  \"success\": true\n}\n```"
