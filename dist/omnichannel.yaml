"2023-10-13T13:03:58.426Z\",\n      \"numAgents\": 3,\n      \"businessHourId\": \"650dc9cfa2f73c7460e18bea\"\n    }\n  ],\n  \"count\": 2,\n  \"offset\": 0,\n  \"total\": 2,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
