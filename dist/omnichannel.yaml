          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  visitor:
                    type: object
                    properties:
                      _id:
                        type: string
                      username:
                        type: string
                      status:
                        type: string
                      ts:
                        type: string
                      _updatedAt:
                        type: string
