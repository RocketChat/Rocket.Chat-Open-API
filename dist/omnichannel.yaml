        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-livechat-business-hours.save
      description: "Use this endpoint to create a new Omnichannel business hour.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/business-hours.save \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"name\": \"api-BH\",\n  \"timezoneName\": \"Asia/Bangkok\",\n  \"daysOpen\": [\n    \"Monday\",\n    \"Wednesday\"\n  ],\n  \"departmentsToApplyBusinessHour\": \"TEST-DEPT\",\n  \"active\": true,\n  \"type\": \"custom\",\n  \"workHours\": [\n    {\n      \"day\": \"Monday\",\n      \"start\": \"08:00:00\",\n      \"finish\": \"16:00:00\",\n      \"open\": true\n    },\n    {\n      \"day\": \"Wednesday\",\n      \"start\": \"08:00:00\",\n      \"finish\": \"16:00:00\",\n      \"open\": true\n    }\n  ],\n  \"_id\": \"6953b3bc6ff48667974be88e\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - timezoneName
              - daysOpen
              - departmentsToApplyBusinessHour
              - active
              - type
              - workHours
              properties:
                name:
                  type: string
                  description: Enter a name for the business hour.
                  example: Support Business Hour
                timezoneName:
                  type: string
                  description: Enter the timezone for the business hour. You can view the list of time zones from the Business Hours settings in the workspace.
                  example: Asia/Bangkok
                daysOpen:
                  type: array
                  description: Enter the days of the week that the business hour will apply to.
                  items:
                    type: string
                    example: '["Monday", "Tuesday", "Wednesday"]'
                departmentsToApplyBusinessHour:
                  type: string
                  description: Enter the department ID to which the business hour must be applied.
                  example: 68304887113ac52640bc1ca6
                active:
                  type: boolean
                  description: Enter whether or not the business hour must be active as soon as it is created.
                type:
                  type: string
                  description: Enter the type of the business hour. It can be `default` or `custom`.
                workHours:
                  type: array
                  description: Enter the work hours for each open day. Make sure to include the day you have added to the `daysOpen` parameter. Otherwise, it will not be included in the business hour.
                  items:
                    type: object
                    required:
                    - day
                    - start
                    - finish
                    - open
                    properties:
                      day:
                        type: string
                        description: Enter the day of the week.
                        example: Monday
                      start:
                        type: string
                        description: Enter the start time of the business hour.
                        example: 08:00:00
                      finish:
                        type: string
                        description: Enter the end time of the business hour.
                        example: '16:00:00'
                      open:
                        type: boolean
                        description: Enter whether or not this work hour is active. If you set this as `false`, the work hour will not be included in the business hour.
                        default: true
                _id:
                  type: string
                  description: Use this parameter to update an existing business hour.
                  example: 668c72e86dfe572b40b90e30
            examples:
              Example 1:
                value:
                  name: api-BH
                  timezoneName: Asia/Bangkok
                  daysOpen:
                  - Monday
                  - Wednesday
                  departmentsToApplyBusinessHour: TEST-DEPT
                  active: true
                  type: custom
                  workHours:
                  - day: Monday
                    start: 08:00:00
                    finish: '16:00:00'
                    open: true
                  - day: Wednesday
                    start: 08:00:00
                    finish: '16:00:00'
                    open: true
                  _id: 6953b3bc6ff48667974be88e
