  /api/v1/livechat/room.close:
    post:
      summary: Close Omnichannel Room by Visitor
      description: "If you are a visitor, use this endpoint to close the room.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/livechat/room.close \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"rid\": \"XFzMqgn33DcsQkpJp\",\n  \"token\": \"iNKE8a6k6cjbqWhWd\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"rid\": \"XFzMqgn33DcsQkpJp\",\n  \"comment\": \"Closed by visitor\",\n  \"success\": true\n}\n```"
      operationId: post-api-v1-livechat-room.close
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  rid:
                    type: string
                  comment:
                    type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    rid: XFzMqgn33DcsQkpJp
                    comment: Closed by visitor
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'token' [invalid-params]
                    errorType: invalid-params
                Example 2:
                  value:
                    success: false
                    error: must have required property 'rid' [invalid-params]
                    errorType: invalid-params
