  /api/v1/livechat/tags:
    get:
      tags:
      - Omnichannel Tags
      summary: Get List of Tags
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Enterprise%20tag.svg\" alt=\"Enterprise\" style=\"display: block; margin: auto;\"></div>\n\nRetrieves list of <a href='https://docs.rocket.chat/docs/tags' target='_blank'>tags</a>. Here are some important details to note when retrieving tags:\n- By default, only tags not linked to any department are returned.\n- To retrieve all tags in the workspace, set the `viewAll` parameter to `true`.\n- If a `department` is specified, the response includes both the tags associated with that department and those not linked to any department.\n\nAt least one of the following permissions is required:\n  * `view-l-room`\n  * `manage-livechat-tags`\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/livechat/tags?offset=50&count=25&text=example&department=example&viewAll=True' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"tags\": [\n    {\n      \"_id\": \"nNJntq2n6GBdR8JC4\",\n      \"name\": \"331\",\n      \"numDepartments\": 2,\n      \"departments\": [\n        \"kxL4qaa29SMpy3ZXG\",\n        \"WRY3EFGAT9Xh5NFBv\"\n      ],\n      \"_updatedAt\": \"2022-11-28T07:17:31.973Z\",\n      \"description\": \"xfgh\"\n    },\n    {\n      \"_id\": \"bhA8DPhSdeBEJ2C94\",\n      \"name\": \"QA-Passed\",\n      \"numDepartments\": 0,\n      \"departments\": [],\n      \"_updatedAt\": \"2022-08-30T12:14:54.173Z\"\n    },\n    {\n      \"_id\": \"b8mvKqZXiAw36pDqE\",\n      \"name\": \"VoIP\",\n      \"description\": \"voip test\",\n      \"numDepartments\": 0,\n      \"departments\": [],\n      \"_updatedAt\": \"2022-03-01T06:27:43.113Z\"\n    },\n    {\n      \"_id\": \"GR6zxTM5PMHxGwud6\",\n      \"name\": \"t1\",\n      \"description\": \"test1\",\n      \"numDepartments\": 1,\n      \"departments\": [\n        \"kxL4qaa29SMpy3ZXG\"\n      ],\n      \"_updatedAt\": \"2023-01-04T14:02:29.038Z\"\n    }\n  ],\n  \"count\": 4,\n  \"offset\": 0,\n  \"total\": 4,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-livechat-tags
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 25
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - schema:
          type: string
        in: query
        name: text
        description: Filter the search result with the text.
      - schema:
          type: string
        in: query
        name: department
        description: Enter the department ID.
      - schema:
          type: boolean
        in: query
        name: viewAll
        description: Select whether you want to view all tags.
      - schema: {}
        in: query
        name: sort
        description: "Sort tags in ascending (`1`) or descending (`-1`) order. The options are:\n * `name`: Sort by tag name. `sort={\"name\": 1}` (default) or `sort={\"name\": -1}`\n * `description`: Sort by tag description. `sort={\"description\": 1}` or `sort={\"description\": -1}`\n * `numDepartments`: Sort by number of departments associated with the tag.\n * `_createdAt`: Sort by date of tag creation.\n * `_updatedAt`: Sort by the update timestamp."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        numDepartments:
                          type: integer
                        departments:
                          type: array
                          items:
                            type: string
                        _updatedAt:
                          type: string
                        description:
                          type: string
                  count:
                    type: integer
