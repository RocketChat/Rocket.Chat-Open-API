      summary: Get List of Integrations
      description: "Any of the following permissions is required:\n* `manage-incoming-integrations`\n* `manage-own-incoming-integrations`\n* `manage-outgoing-integrations`\n* `manage-own-outgoing-integrations`\n\nThe endpoint returns the integrations based on the user permissions.\n### Changelog\n| Version      | Description | \n| ---------------- | ------------|\n|7.0.0            | Added `name` and `type` query parameters for filtering.       |\n|1.1.0            | Separate permissions in incoming and outgoing.       |\n|0.49.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/integrations.list?offset=50&count=50&fields=example&name=test&type=webhook-incoming' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"integrations\": [\n    {\n      \"_id\": \"WMQDChpnYTRmFre9h\",\n      \"enabled\": true,\n      \"username\": \"rocket.cat\",\n      \"alias\": \"Guggy\",\n      \"avatar\": \"https://image.crisp.im/avatar/website/17651a90-e082-43f6-b308-957cea6e323c/128\",\n      \"name\": \"Guggy\",\n      \"triggerWords\": [\n        \"!guggy\",\n        \"guggy\",\n        \"gif+\"\n      ],\n      \"urls\": [\n        \"http://text2gif.guggy.com/guggify\"\n      ],\n      \"token\": \"aobEdbYhXfu5hkeqG\",\n      \"script\": \"...\",\n      \"scriptEnabled\": true,\n      \"impersonateUser\": false,\n      \"scriptCompiled\": \"...\",\n      \"scriptError\": null,\n      \"type\": \"webhook-outgoing\",\n      \"userId\": \"rocket.cat\",\n      \"channel\": [],\n      \"_createdAt\": \"2017-01-05T17:06:05.660Z\",\n      \"_createdBy\": {\n        \"username\": \"graywolf336\",\n        \"_id\": \"R4jgcQaQhvvK6K3iY\"\n      },\n      \"_updatedAt\": \"2017-01-05T17:06:05.660Z\"\n    },\n    {\n      \"_id\": \"3aazpZ2WzoBP8msi9\",\n      \"type\": \"webhook-outgoing\",\n      \"name\": \"Testing via REST API\",\n      \"enabled\": false,\n      \"username\": \"rocket.cat\",\n      \"urls\": [\n        \"http://text2gif.guggy.com/guggify\"\n      ],\n      \"scriptEnabled\": false,\n      \"userId\": \"rocket.cat\",\n      \"channel\": [],\n      \"_createdAt\": \"2017-01-06T13:23:46.018Z\",\n      \"_createdBy\": {\n        \"username\": \"graywolf336\",\n        \"_id\": \"R4jgcQaQhvvK6K3iY\"\n      },\n      \"_updatedAt\": \"2017-01-06T13:23:46.018Z\"\n    }\n  ],\n  \"offset\": 0,\n  \"items\": 2,\n  \"total\": 2,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-integrations-list
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: query
        in: query
        description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": query=`{ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
        required: false
        schema: {}
      - name: fields
        in: query
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: fields=`{ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filter list by the name of the integration.
        schema:
          type: string
        example: test
      - name: type
        in: query
        description: Filter list by the type of the integration. It can be `webhook-outgoing` or `webhook-incoming`.
        schema:
          type: string
        example: webhook-incoming
      - schema: {}
        in: query
        name: sort
        description: "Sort the results in ascending (`1`) or descending order (`-1`). By default, the results are sorted in descending order of timestamp (`{\"ts\": -1}`). The additional options for the sort parameter are:\n * `name`: Sort by the integration name. `sort={\"name\": 1}` or `sort={\"name\": -1}`\n * `channel`: Sort by target channel. `sort={\"channel\": 1}` or `sort={\"channel\": -1}`\n * `_createdAt`: Sort by date of creation. `sort={\"_createdAt\": 1}` or `sort={\"_createdAt\": -1}`\n * `_createdBy`: Sort by user who created the integration. `sort={\"_createdBy\": 1}` or `sort={\"_createdBy\": -1}`\n * `username`: Sort by the value in the \"post-as\" username field. `sort={\"username\": 1}` or `sort={\"username\": -1}`\n * You can also use multiple options for one sort query. For example, `sort={\"_createdAt\": -1, \"name\": 1}`. This sorts by creation date in descending order, then by name in ascending order."
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items:
                      type: object
