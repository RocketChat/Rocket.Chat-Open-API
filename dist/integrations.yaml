openapi: 3.0.0
info:
  version: 1.0.0
  title: Integrations
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/integrations.create:
    post:
      tags:
      - Integration
      summary: Create Integration
      description: "Use this endpoint to create an incoming or outgoing integration. For details, you can refer to the <a href='https://docs.rocket.chat/docs/integrations' target='_blank'>Integrations user guide</a>.\n\nPermissions required to create incoming integrations:\n* `manage-incoming-integrations`\n* `manage-own-incoming-integrations`\n\nPermissions required to create outgoing integrations:\n* `manage-outgoing-integrations`\n* `manage-own-outgoing-integrations`\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.4.0            | Added `skipTranspile` field to opt-out of Babel transpilation |\n|1.1.0            | Separate permissions in incoming and outgoing.       |\n|0.49.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/integrations.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"type\": \"webhook-incoming\",\n  \"username\": \"test.cat\",\n  \"channel\": \"#general\",\n  \"scriptEnabled\": true,\n  \"name\": \"test.cat\",\n  \"enabled\": true\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"integration\": {\n    \"type\": \"webhook-incoming\",\n    \"username\": \"test.cat\",\n    \"channel\": [\n      \"#general\"\n    ],\n    \"scriptEnabled\": true,\n    \"name\": \"test.cat\",\n    \"enabled\": true,\n    \"scriptEngine\": \"isolated-vm\",\n    \"overrideDestinationChannelEnabled\": false,\n    \"token\": \"XuHp73MccmCvJ9m3fKdQK6HKW9tjhBcbTKKHCSSLsv7qn4fk\",\n    \"userId\": \"CkCPNcvsvCDfmWLqC\",\n    \"_createdAt\": \"2024-01-10T14:12:07.739Z\",\n    \"_createdBy\": {\n      \"_id\": \"CkCPNcvsvCDfmWLqC\",\n      \"username\": \"test.cat\"\n    },\n    \"_id\": \"659ea5b72dd9f928ada3e43e\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-integrations-create
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: "The type of integration to create. The possible values are:\r\n* `webhook-incoming`\r\n* `webhook-outgoing`"
                username:
                  type: string
                  description: The username to post this the messages as.
                channel:
                  type: string
                  description: The channel, group, or @username. The value can also be `all_public_channels`, `all_private_groups`, or `all_direct_messages`. Comma separated for more than one.
                  example: '#general'
                scriptEnabled:
                  type: boolean
                  description: Whether the script should be enabled.
                script:
                  type: string
                  description: The script that is triggered when this integration is triggered.
                name:
                  type: string
                  description: The name of the integration.
                enabled:
                  type: boolean
                  description: Whether this integration should be enabled or not.
                alias:
                  type: string
                  description: The alias which should be applied to messages when this integration is processed.
                avatar:
                  type: string
                  description: The logo to apply to the messages that this integration sends. For example, http://res.guggy.com/logo_128.png
                emoji:
                  type: string
                  description: The emoji which should be displayed as the avatar for messages from this integration.
                  example: ':ghost:'
                event:
                  type: string
                  description: "**Required for outgoing integrations.**\n\nThe type of event can be any of the following: \n* `sendMessage`\n* `fileUploaded`\n* `roomArchived`\n* `roomCreated`\n* `roomJoined`\n* `roomLeft`\n* `userCreated`"
                urls:
                  type: array
                  description: '**Required for outgoing integrations.**


                    The urls to call whenever this integration is triggered.'
                  items:
                    type: string
                triggerWords:
                  type: string
                  description: 'This is an outgoing integration parameter.

                    Specific words, separated by commas, that should trigger this integration.'
                token:
                  type: string
                  description: 'This is an outgoing integration parameter.

                    If your integration requires a special token from the server (API key), use this parameter.'
                skipTranspile:
                  type: boolean
                  description: "From 8.4.0, the optional `skipTranspile` field is available to opt out of Babel transpilation for the integration script.\nFrom 9.0.0, Babel will no longer be used for webhook integration script compilation. This is a breaking change for scripts that rely on sloppy-mode behavior. Admins must review the existing integrations. \n\nThis parameter lets you test each integration so you can fix any scripts that break and reliably upgrade to 9.0.0 with `scriptTranspile: false` set on every integration.\n\nWhen `skipTranspile` is true, the script is stored as-is without Babel processing, matching the 9.0.0 default. Defaults to false for backward compatibility. Refer to the <a href='https://docs.rocket.chat/docs/integrations#script-compatibility' target='_blank'>Script compatibility</a> section in the Integrations user guide for more details.\n\nNote: This parameter is deprecated and will be removed in the 9.0.0 version."
                  default: false
              required:
              - type
              - username
              - channel
              - scriptEnabled
              - name
              - enabled
              - event
              - urls
            examples:
              Incoming integration example:
                value:
                  type: webhook-incoming
                  username: test.cat
                  channel: '#general'
                  scriptEnabled: true
                  name: test.cat
                  enabled: true
              Outgoing integration example:
                value:
                  type: webhook-outgoing
                  username: test.cat
                  channel: '#general'
                  scriptEnabled: true
                  name: test.cat
                  enabled: true
                  event: sendMessage
                  urls:
                  - https://text2gif.guggy.com/guggify
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration:
                    type: object
                    properties:
                      type:
                        type: string
                      username:
                        type: string
                      channel:
                        type: array
                        items:
                          type: string
                      scriptEnabled:
                        type: boolean
                      name:
                        type: string
                      enabled:
                        type: boolean
                      scriptEngine:
                        type: string
                      overrideDestinationChannelEnabled:
                        type: boolean
                      token:
                        type: string
                      userId:
                        type: string
                      _createdAt:
                        type: string
                      _createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _id:
                        type: string
                  success:
                    type: boolean
              examples:
                Incoming integration example:
                  value:
                    integration:
                      type: webhook-incoming
                      username: test.cat
                      channel:
                      - '#general'
                      scriptEnabled: true
                      name: test.cat
                      enabled: true
                      scriptEngine: isolated-vm
                      overrideDestinationChannelEnabled: false
                      token: XuHp73MccmCvJ9m3fKdQK6HKW9tjhBcbTKKHCSSLsv7qn4fk
                      userId: CkCPNcvsvCDfmWLqC
                      _createdAt: '2024-01-10T14:12:07.739Z'
                      _createdBy:
                        _id: CkCPNcvsvCDfmWLqC
                        username: test.cat
                      _id: 659ea5b72dd9f928ada3e43e
                    success: true
                Outgoing integration example:
                  value:
                    integration:
                      type: webhook-outgoing
                      username: test.cat
                      channel:
                      - '#general'
                      scriptEnabled: true
                      name: test.cat
                      enabled: true
                      event: sendMessage
                      urls:
                      - https://text2gif.guggy.com/guggify
                      scriptEngine: isolated-vm
                      userId: CkCPNcvsvCDfmWLqC
                      _createdAt: '2024-01-10T14:12:52.201Z'
                      _createdBy:
                        _id: CkCPNcvsvCDfmWLqC
                        username: test.cat
                      _id: 659ea5e42dd9f928ada3e451
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: "must have required property 'type'\n must have required property 'type'\n must match exactly one schema in oneOf [invalid-params]"
                    errorType: invalid-params
                Example 2:
                  value:
                    success: false
                    error: "must have required property 'username'\n must have required property 'username'\n must match exactly one schema in oneOf [invalid-params]"
                    errorType: invalid-params
  /api/v1/integrations.get:
    get:
      tags:
      - Integration
      summary: Get Integration
      description: "Get the information of a specific incoming or outgoing integration.\n\nPermissions required:\n* `manage-incoming-integrations`\n* `manage-own-incoming-integrations`\n* `manage-outgoing-integrations`\n* `manage-own-outgoing-integrations`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|2.4.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/integrations.get?integrationId=ByehQjC44FwMeiLbX&createdBy=fn5u45ui34fvb' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"integration\": {\n    \"_id\": \"659ea5e42dd9f928ada3e451\",\n    \"type\": \"webhook-outgoing\",\n    \"username\": \"test.cat\",\n    \"channel\": [\n      \"#general\"\n    ],\n    \"scriptEnabled\": true,\n    \"name\": \"test.cat\",\n    \"enabled\": true,\n    \"event\": \"sendMessage\",\n    \"urls\": [\n      \"https://text2gif.guggy.com/guggify\"\n    ],\n    \"scriptEngine\": \"isolated-vm\",\n    \"userId\": \"CkCPNcvsvCDfmWLqC\",\n    \"_createdAt\": \"2024-01-10T14:12:52.201Z\",\n    \"_createdBy\": {\n      \"_id\": \"CkCPNcvsvCDfmWLqC\",\n      \"username\": \"test.cat\"\n    },\n    \"_updatedAt\": \"2024-01-10T14:12:52.203Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-integrations-get
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      - name: integrationId
        in: query
        description: The integration ID.
        required: true
        schema:
          type: string
        example: ByehQjC44FwMeiLbX
      - name: createdBy
        in: query
        description: The user ID who created the integration.
        schema:
          type: string
        example: fn5u45ui34fvb
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration:
                    type: object
                    properties:
                      _id:
                        type: string
                      type:
                        type: string
                      username:
                        type: string
                      channel:
                        type: array
                        items:
                          type: string
                      scriptEnabled:
                        type: boolean
                      name:
                        type: string
                      enabled:
                        type: boolean
                      event:
                        type: string
                      urls:
                        type: array
                        items:
                          type: string
                      scriptEngine:
                        type: string
                      userId:
                        type: string
                      _createdAt:
                        type: string
                      _createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _updatedAt:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    integration:
                      _id: 659ea5e42dd9f928ada3e451
                      type: webhook-outgoing
                      username: test.cat
                      channel:
                      - '#general'
                      scriptEnabled: true
                      name: test.cat
                      enabled: true
                      event: sendMessage
                      urls:
                      - https://text2gif.guggy.com/guggify
                      scriptEngine: isolated-vm
                      userId: CkCPNcvsvCDfmWLqC
                      _createdAt: '2024-01-10T14:12:52.201Z'
                      _createdBy:
                        _id: CkCPNcvsvCDfmWLqC
                        username: test.cat
                      _updatedAt: '2024-01-10T14:12:52.203Z'
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'integrationId' [invalid-params]
                    errorType: invalid-params
                Example 2:
                  value:
                    success: false
                    error: The integration does not exists.
  /api/v1/integrations.history:
    get:
      tags:
      - Integration
      summary: Get Integration History
      description: "Any of the following permissions is required:\n * `manage-incoming-integrations`\n * `manage-own-incoming-integrations`\n * `manage-outgoing-integrations`\n * `manage-own-outgoing-integrations`\n \n The endpoint returns the integration history based on the user permissions.\n ### Changelog\n |Version      | Description | \n | ---------------- | ------------|\n |1.1.0            | Separate permissions in incoming and outgoing.       |\n |0.53.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/integrations.history?id=nvdQuJQ6tE9HRFBzd&offset=50&count=50&fields=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"history\": [],\n  \"offset\": 0,\n  \"items\": 0,\n  \"total\": 0,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-integrations-history
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      - name: id
        in: query
        description: The integration ID.
        required: true
        schema:
          type: string
        example: nvdQuJQ6tE9HRFBzd
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: sort
        in: query
        description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, `{"value": -1, "_id": 1}`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
        required: false
        schema: {}
      - name: query
        in: query
        description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": query=`{ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
        required: false
        schema: {}
      - name: fields
        in: query
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: fields=`{ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                  offset:
                    type: integer
                  items:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Example 1:
                  value:
                    history: []
                    offset: 0
                    items: 0
                    total: 0
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'id' [invalid-params]
                    errorType: invalid-params
  /api/v1/integrations.clearHistory:
    post:
      tags:
      - Integration
      summary: Clear Integration History
      description: "Clear the history of an outgoing <a href='https://docs.rocket.chat/docs/integrations' target='_blank'>integration</a>. \n\nAny of the following permissions is required:\n  * `manage-outgoing-integrations`\n  * `manage-own-outgoing-integrations` (clears history only for integrations created by the calling user)\n\n### Changelog\n|Version      | Description |\n| ---------------- | ------------|\n|8.7.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/integrations.clearHistory \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"integrationId\": \"nvdQuJQ6tE9HRFBzd\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-integrations.clearHistory
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  description: The ID of the integration whose history you want to clear.
                  example: nvdQuJQ6tE9HRFBzd
              required:
              - integrationId
            examples:
              Example:
                value:
                  integrationId: nvdQuJQ6tE9HRFBzd
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Parameter:
                  value:
                    success: false
                    error: must have required property 'integrationId' [invalid-params]
                    errorType: invalid-params
                Invalid Integration:
                  value:
                    success: false
                    error: Invalid integration [error-invalid-integration]
                    errorType: error-invalid-integration
                Not Authorized for this Integration:
                  value:
                    success: false
                    error: Unauthorized [not_authorized]
                    errorType: not_authorized
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/integrations.replayOutgoing:
    post:
      tags:
      - Integration
      summary: Replay Outgoing Integration
      description: "Replay a history entry of an outgoing <a href='https://docs.rocket.chat/docs/integrations' target='_blank'>integration</a>, triggering the integration again with the recorded data. \n\nAny of the following permissions is required:\n  * `manage-outgoing-integrations`\n  * `manage-own-outgoing-integrations` (replays only integrations created by the calling user)\n\n### Changelog\n|Version      | Description |\n| ---------------- | ------------|\n|8.7.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/integrations.replayOutgoing \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"integrationId\": \"nvdQuJQ6tE9HRFBzd\",\n  \"historyId\": \"8G2GfBz3prSampleId\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-integrations.replayOutgoing
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user.
        required: true
        schema:
          type: string
        example: 9HqLlyZOugD_0YdwAJF8V47U3QHXSq
      - name: X-User-Id
        in: header
        description: The user ID of the user.
        required: true
        schema:
          type: string
        example: aobEdbYhXfu5hkeqG
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                integrationId:
                  type: string
                  description: The ID of the outgoing integration.
                  example: nvdQuJQ6tE9HRFBzd
                historyId:
                  type: string
                  description: The ID of the integration history to replay. Use the <a href='https://developer.rocket.chat/apidocs/get-integration-history' target='_blank'>Get Integration History</a> endpoint to list history entries.
                  example: 8G2GfBz3prSampleId
              required:
              - integrationId
              - historyId
            examples:
              Example:
                value:
                  integrationId: nvdQuJQ6tE9HRFBzd
                  historyId: 8G2GfBz3prSampleId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Parameter:
                  value:
                    success: false
                    errorType: invalid-params
                    error: must have required property 'historyId'
                Invalid Integration:
                  value:
                    success: false
                    error: Invalid integration [error-invalid-integration]
                    errorType: error-invalid-integration
                    details:
                      method: replayOutgoingIntegration
                Invalid Integration History:
                  value:
                    success: false
                    error: Invalid Integration History [error-invalid-integration-history]
                    errorType: error-invalid-integration-history
                    details:
                      method: replayOutgoingIntegration
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
