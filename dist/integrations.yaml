                        _createdAt:
                          type: string
                        _createdBy:
                          type: object
                          properties:
                            username:
                              type: string
                            _id:
                              type: string
                        _updatedAt:
                          type: string
                  offset:
                    type: integer
                  items:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    integrations:
                    - _id: WMQDChpnYTRmFre9h
