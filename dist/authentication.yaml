                  example: facebook
                accessToken:
                  type: string
                  description: Access token provided by Facebook oauth.
                  example: hash
                secret:
                  type: string
                  description: The secret provided by Facebook.
                  example: hash
                expiresIn:
                  type: integer
                  description: Lifetime of token (in seconds).
