  /api/v1/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: "Invalidate your REST API authentication token.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/logout \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"status\": \"success\",\n  \"data\": {\n    \"message\": \"You've been logged out!\"\n  }\n}\n```"
      operationId: post-api-v1-logout
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authorization token of the user
        required: true
        schema:
          type: string
      - name: X-User-Id
        in: header
        description: The user id of the user
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              examples:
                Example:
                  value:
                    status: success
                    data:
                      message: You've been logged out!
  /api/v1/loginCode.redeem:
    post:
      tags:
      - Authentication
      summary: Redeem Login Code
      description: "Redeems a one-time OAuth login code and returns the `loginToken` and `userId`. Use these values as the `X-Auth-Token` and `X-User-Id` headers in authenticated requests.\n\nThis endpoint does not require authentication. Each code is single-use, expires after 60 seconds, and is limited to 10 redemption requests per minute per caller.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.7.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/loginCode.redeem \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"code\": \"4f1d2c3b4a5968778695a4b3c2d1e0f1123456789abcdef00fedcba987654321\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"loginToken\": \"9HqLlyZOugoStsXCUfD_0YdwnNnunAJF8V47U3QHXSq\",\n  \"userId\": \"aobEdbYhXfu5hkeqG\",\n  \"success\": true\n}\n```"
      operationId: post-api-v1-loginCode.redeem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: The one-time login code issued by the server-side OAuth flow.
                  example: 4f1d2c3b4a5968778695a4b3c2d1e0f1123456789abcdef00fedcba987654321
              required:
              - code
            examples:
              Redeem login code:
                value:
                  code: 4f1d2c3b4a5968778695a4b3c2d1e0f1123456789abcdef00fedcba987654321
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginToken:
                    type: string
                  userId:
                    type: string
                  success:
                    type: boolean
                required:
                - loginToken
                - userId
                - success
              examples:
                Redemption successful:
                  value:
                    loginToken: 9HqLlyZOugoStsXCUfD_0YdwnNnunAJF8V47U3QHXSq
                    userId: aobEdbYhXfu5hkeqG
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid request:
                  value:
                    success: false
                    error: must NOT have fewer than 64 characters [invalid-params]
                    errorType: invalid-params
                Invalid or expired code:
                  value:
                    success: false
                    error: error-invalid-code
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                x-examples:
                  Authorization Error:
                    status: error
                    message: You must be logged in to do this.
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
