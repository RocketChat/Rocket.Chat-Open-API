: true,\n      \"notificationsSoundVolume\": 100\n    }\n  },\n  \"customFields\": {\n    \"twitter\": \"@userstwi\"\n  },\n  \"avatarUrl\": \"http://localhost:3000/avatar/test\",\n  \"success\": true\n}\n```"
