  /api/v1/users.2fa.enableEmail:
    post:
      tags:
      - Two-Factor Authentication
      summary: Enable 2FA via Email
      description: "Enable email two-factor authentication for your account. This endpoint only works if the user has at least one verified email.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.2fa.enableEmail \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.2fa.enableEmail
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
          example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
          example: rbAXPnMktTFbNpwtJ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                x-examples:
                  Success:
                    success: true
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                x-examples:
                  Authorization Error:
                    status: error
                    message: You must be logged in to do this.
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/users.2fa.sendEmailCode:
    parameters: []
    post:
      summary: Send 2FA Email Code
      operationId: post-api-v1-users.2fa.sendEmailCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                x-examples:
                  Success:
                    success: true
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: emailOrUsername is required [error-parameter-required]
                    errorType: error-parameter-required
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                x-examples:
                  Authorization Error:
                    status: error
                    message: You must be logged in to do this.
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      description: "\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.2fa.sendEmailCode \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"emailOrUsername\": \"test@email.com\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: false
        schema:
          type: string
          example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: false
        schema:
          type: string
          example: rbAXPnMktTFbNpwtJ
      tags:
      - Two-Factor Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emailOrUsername:
                  type: string
                  description: Enter the email or username.
                  example: test@email.com
              required:
              - emailOrUsername
            examples:
              Example 1:
                value:
                  emailOrUsername: test@email.com
  /api/v1/users.2fa.disableEmail:
    post:
      tags:
      - Two-Factor Authentication
      summary: Disable 2FA via Email
      description: "Disable two-factor authentication via email. The 2FA code is required.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.2fa.disableEmail \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-2fa-Code: example\" \\\n     -H \"X-2fa-method: example\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.2fa.disableEmail
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
          example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
          example: rbAXPnMktTFbNpwtJ
      - name: X-2fa-Code
        in: header
        description: 'The 2FA code. '
        required: true
        schema:
          type: string
      - schema:
          type: string
        in: header
        name: X-2fa-method
        description: The 2FA method. It can be `email`, `totp`, or `password`.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                x-examples:
                  Success:
                    success: true
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: "TOTP Required \n\nThe 2FA code is passed as the `X-2fa-Code` query parameter.\n\nIt's important to note the **required TOTP method** returned from the response.\n\n- If it's `password`, add the hashed password of the user as the `X-2fa-Code` header parameter. \n- If it's `email`, add the 2FA code sent via email as the `X-2fa-Code` header parameter.\n- If it's `totp`, add the code from your authenticator app as the `X-2fa-Code` header parameter."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      codeGenerated:
                        type: boolean
                      availableMethods:
                        type: array
                        items:
                          type: object
              examples:
                TOTP Required:
                  value:
                    success: false
                    error: TOTP Required [totp-required]
                    errorType: totp-required
                    details:
                      method: password
                      codeGenerated: false
                      availableMethods: []
  /api/v1/twoFactorChallenges.sendEmailCode:
    post:
      tags:
      - Two-Factor Authentication
      summary: Send Two-Factor Challenge Email Code
      description: "Sends a new email code for an OAuth two-factor authentication challenge.\n\nThis endpoint does not require authentication. The challenge must exist, must not be expired, and must use the `email` method. Requests are limited to 5 per minute per caller.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.7.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/twoFactorChallenges.sendEmailCode \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"challengeId\": \"8f4c2d1e9a7b6c5d3e2f1a0b\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-twoFactorChallenges.sendEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                challengeId:
                  type: string
                  description: The ID of the pending two-factor challenge returned by the login flow.
                  example: 8f4c2d1e9a7b6c5d3e2f1a0b
              required:
              - challengeId
            examples:
              Send email code:
                value:
                  challengeId: 8f4c2d1e9a7b6c5d3e2f1a0b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                x-examples:
                  Success:
                    success: true
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Missing challengeId:
                  value:
                    success: false
                    error: challengeId is required
                    errorType: error-parameter-required
                Challenge not found:
                  value:
                    success: false
                    error: challenge not found
                    errorType: error-challenge-not-found
                Challenge expired:
                  value:
                    success: false
                    error: challenge expired
                    errorType: error-challenge-expired
                Invalid challenge method:
                  value:
                    success: false
                    error: invalid challenge method
                    errorType: error-invalid-challenge-method
                User not found:
                  value:
                    success: false
                    error: user not found
                    errorType: error-user-not-found
  /api/v1/twoFactorChallenges.verifyChallenge:
    post:
      tags:
      - Two-Factor Authentication
      summary: Verify Two-Factor Challenge
      description: "Verifies the email or TOTP code for an OAuth two-factor authentication challenge and returns the `loginToken` and `userId`.\n\nThis endpoint does not require authentication. Requests are limited to 5 per minute per caller. The challenge is removed when the maximum number of failed attempts is reached.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.7.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/twoFactorChallenges.verifyChallenge \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"challengeId\": \"8f4c2d1e9a7b6c5d3e2f1a0b\",\n  \"code\": \"482913\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"loginToken\": \"exampleLoginTokenString123\",\n  \"userId\": \"aobEdbYhXfu5hkeqG\",\n  \"success\": true\n}\n```"
      operationId: post-api-v1-twoFactorChallenges.verifyChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                challengeId:
                  type: string
                  description: The ID of the pending two-factor challenge returned by the login flow.
                  example: 8f4c2d1e9a7b6c5d3e2f1a0b
                code:
                  type: string
                  description: The two-factor code provided by the user for the challenge.
                  example: '482913'
              required:
              - challengeId
              - code
            examples:
              Verify challenge:
                value:
                  challengeId: 8f4c2d1e9a7b6c5d3e2f1a0b
                  code: '482913'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  loginToken:
                    type: string
                  userId:
                    type: string
                  success:
                    type: boolean
                required:
                - loginToken
                - userId
                - success
              examples:
                Verification successful:
                  value:
                    loginToken: exampleLoginTokenString123
                    userId: aobEdbYhXfu5hkeqG
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Missing parameters:
                  value:
                    success: false
                    error: challengeId and code are required
                    errorType: error-parameter-required
                Invalid code:
                  value:
                    success: false
                    error: Invalid code
                    errorType: error-invalid-code
                Challenge not found:
                  value:
                    success: false
                    error: challenge not found
                    errorType: error-challenge-not-found
                Challenge expired:
                  value:
                    success: false
                    error: challenge expired
                    errorType: error-challenge-expired
                User not found:
                  value:
                    success: false
                    error: user not found
                    errorType: error-user-not-found
                Max attempts reached:
                  value:
                    success: false
                    error: TOTP Maximun Failed Attempts Reached
                    errorType: totp-max-attempts
