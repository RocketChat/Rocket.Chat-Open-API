  /api/v1/teams.info:
    get:
      tags:
      - Teams
      summary: Get Team Info
      description: "Gets a team's information. If the team is not public, the request sender must be a member of the team, or must have the `view-all-teams` permission.\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/teams.info?teamId=63f3efc4b000b6b6d86704b2&teamName=livestream' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"teamInfo\": {\n    \"_id\": \"607e0d9b49d493189836bfac\",\n    \"name\": \"Team1\",\n    \"type\": 1,\n    \"createdAt\": \"2021-04-19T23:09:15.106Z\",\n    \"createdBy\": {\n      \"_id\": \"FL2fZL4ERhwA3gWiS\",\n      \"username\": \"some.username\"\n    },\n    \"_updatedAt\": \"2021-04-19T23:09:15.106Z\",\n    \"roomId\": \"Dgh2xwJ3NFKWvKSqY\"\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-teams.info
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: teamId
        in: query
        description: The team id.  It is required if the `teamName` is not provided.
        schema:
          type: string
        example: 63f3efc4b000b6b6d86704b2
      - name: teamName
        in: query
        description: The team name.  It is required if the `teamId` is not provided.
        required: false
        schema:
          type: string
        example: livestream
      responses:
        '200':
          description: 'OK


            Note that the `roomId` is main room id of the team.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  teamInfo:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
