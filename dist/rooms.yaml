                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/rooms.delete:
    post:
      tags:
      - Rooms
      summary: Delete Room
      description: "Delete a room from the workspace. The following permissions are required:\n* `delete-c`: To delete a public room.\n* `delete-d`: To delete direct messages.\n* `delete-p`: To delete private rooms.\n* `delete-team`: To delete a team.\n* `delete-team-channel`: To delete a channel within a team, also requires the `delete-c` permission.\n* `delete-team-group`: To delete a private channel within a team, also requires the `delete-p` permission.\n\n> You can't use this endpoint to delete a team's main room. Use [Delete a Team endpoint](https://developer.rocket.chat/apidocs/delete-a-team) instead.\n\n### Changelog\n| Version | Description   |\n| ------- | --------------|\n| 5.4.0   | Added         |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.delete \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"ByehQjC44FwMeiLbX\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: get-api-v1-rooms.delete
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - roomId
              properties:
                roomId:
                  type: string
                  example: ByehQjC44FwMeiLbX
                  description: The room ID that you want to delete.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                'Example 1: Missing roomId':
                  value:
                    success: false
                    error: The 'roomId' param is required
                'Example 2: Missing Permission':
                  value:
                    success: true
                    error: string
                'Example 3: Cannot Delete Team Channel':
                  value:
                    success: false
                    error: Cannot delete a team channel [error-cannot-delete-team-channel]
                    errorType: error-cannot-delete-team-channel
                    details:
                      method: eraseRoom
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
