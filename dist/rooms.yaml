  /api/v1/teams.update:
    post:
      tags:
      - Teams
      summary: Update a Team
      description: "Updates an existing team (name and type). \n\nPermission required: `edit-team`\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/teams.update \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"teamId\": \"ByehQjC44FwMeiLbX\",\n  \"data\": {\n    \"name\": \"newTeamName\",\n    \"type\": 1\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-teams.update
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: The team ID.
                data:
                  type: object
                  description: The new team name and type (0 - public, 1 - private).
                  properties:
                    name:
                      type: string
                    type:
                      type: integer
              required:
              - teamId
              - data
            examples:
              Example:
                value:
                  teamId: ByehQjC44FwMeiLbX
                  data:
                    name: newTeamName
                    type: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
