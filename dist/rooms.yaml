  /api/v1/rooms.join:
    post:
      tags:
      - Rooms
      summary: Join a Room
      description: "Join a room of any type, including public channels, private groups, and discussions. Unlike the <a href='https://developer.rocket.chat/apidocs/join-a-channel' target='_blank'>channels.join</a> endpoint, which only joins public channels, this endpoint applies to all kinds of rooms. \n\n### Changelog\n| Version      | Description |\n| ------------ | ----------- |\n| 8.6.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.join \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"ByehQjC44FwMeiLbX\",\n  \"joinCode\": \"1234\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"room\": {\n    \"_id\": \"ByehQjC44FwMeiLbX\",\n    \"name\": \"general\",\n    \"fname\": \"general\",\n    \"t\": \"c\",\n    \"msgs\": 8,\n    \"usersCount\": 2,\n    \"u\": {\n      \"_id\": \"rocketchat.internal.admin.test\",\n      \"username\": \"rocketchat.internal.admin.test\"\n    },\n    \"ts\": \"2026-01-16T12:00:04.783Z\",\n    \"ro\": false,\n    \"sysMes\": true,\n    \"default\": true,\n    \"_updatedAt\": \"2026-01-16T12:06:30.426Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-rooms.join
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  roomId:
                    type: string
                    description: The ID of the room to join. Provide either `roomId` or `roomName`.
                    example: ByehQjC44FwMeiLbX
                  joinCode:
                    type: string
                    description: The join code of the room. Rooms can be password-protected. In that case, users must enter the password for access. The join code isn't needed if the user has the `join-without-join-code` permission.
                    example: '1234'
                required:
                - roomId
                additionalProperties: false
              - type: object
                properties:
                  roomName:
                    type: string
                    description: The name of the room to join. Provide either `roomId` or `roomName`.
                    example: general
                  joinCode:
                    type: string
                    description: The join code of the room. Rooms can be password-protected. In that case, users must enter the password for access. The join code isn't needed if the user has the `join-without-join-code` permission.
                    example: '1234'
                required:
                - roomName
                additionalProperties: false
            examples:
              Join by room ID:
                value:
                  roomId: ByehQjC44FwMeiLbX
                  joinCode: '1234'
              Join by room name:
                value:
                  roomName: general
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      fname:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
