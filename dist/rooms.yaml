      operationId: get-api-v1-rooms.membersOrderedByRole
      description: "Get room members ordered by their roles. This endpoint sorts the members according to their role in the room in the order `Owners` > `Moderators` > all other members. This can be reversed using the query paramter `sort={\"rolePriority\":-1}`. You need not be a member of the room.\n\nIf the room is a broadcast room, you need the `view-broadcast-member-list` permission to view the room members.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 7.3.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.membersOrderedByRole?roomId=66cd971f6fcbb8e8b3cf8e69&roomName=test-team&filter=user&offset=50&count=50&sort=example&status=[\"example\"]' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"members\": [\n    {\n      \"_id\": \"C38WSSzrGd2NCjzqJ\",\n      \"username\": \"test.cat\",\n      \"status\": \"online\",\n      \"_updatedAt\": \"2025-01-22T07:49:47.830Z\",\n      \"name\": \"test.cat\",\n      \"roles\": [\n        \"owner\"\n      ]\n    },\n    {\n      \"_id\": \"P2dgWPPw5veigwcdK\",\n      \"status\": \"offline\",\n      \"_updatedAt\": \"2025-01-22T07:13:19.734Z\",\n      \"name\": \"Fun Smith\",\n      \"username\": \"fun.smith\",\n      \"roles\": [\n        \"moderator\"\n      ]\n    },\n    {\n      \"_id\": \"CNmyTxexxauJ4wrTW\",\n      \"username\": \"agent1\",\n      \"status\": \"offline\",\n      \"_updatedAt\": \"2025-01-22T07:32:57.238Z\",\n      \"name\": \"agent1\"\n    },\n    {\n      \"_id\": \"FSA63o85Poa2EQvAH\",\n      \"status\": \"offline\",\n      \"name\": \"cat kate\",\n      \"username\": \"cat.kate\",\n      \"_updatedAt\": \"2025-01-22T08:04:12.251Z\",\n      \"roles\": [\n        \"leader\"\n      ]\n    }\n  ],\n  \"count\": 4,\n  \"offset\": 0,\n  \"total\": 4,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - schema:
          type: string
          example: 66cd971f6fcbb8e8b3cf8e69
        in: query
        name: roomId
        description: Enter the room ID.
        required: true
      - schema:
          type: string
          example: test-team
        in: query
        name: roomName
        description: Instead of using the room ID, you can enter the room name.
      - schema:
          type: string
          example: user
        in: query
        name: filter
        description: Filter the results by using the text that you want to view.
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - schema:
          type: string
        in: query
        name: sort
        description: "Sort the rooms in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON string. The options are as follows:\n * `rolePriority`: Sort by priority of role (`Owners` > `Moderators` > all other members). For example, `sort={\"rolePriority\":-1}`\n * `username`: Sort by usernames. For example, `sort={\"username\":-1}`"
      - schema:
          type: array
          items:
            type: string
        in: query
        name: status
        description: Enter the user status for which you want the results. For example, `online`, `away`, `offline`.
  /api/v1/teams.create:
    post:
      tags:
      - Teams
      summary: Create a New Team
      description: "Create a new public or private team in the workspace.\n\nPermission required: `create-team`. When you create a team from an existing room by passing `room.id`, you also need the `edit-room` permission for that room.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.7.0   | Enforced room permission checks when creating a team from an existing room. |\n| 3.13.0  | Added |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/teams.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"name\": \"teamName\",\n  \"type\": 0,\n  \"members\": [\n    \"8dugqGhuRvCBLdZft\"\n  ],\n  \"room\": {\n    \"readOnly\": true\n  },\n  \"sidepanel\": {\n    \"items\": [\n      \"discussions\",\n      \"channels\"\n    ]\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"team\": {\n    \"_id\": \"651619e3a2f73c7460e18cc5\",\n    \"name\": \"teamName\",\n    \"type\": 0,\n    \"createdAt\": \"2023-09-29T00:27:15.189Z\",\n    \"createdBy\": {\n      \"_id\": \"rbAXPnMktTFbNpwtJ\",\n      \"username\": \"roxie\"\n    },\n    \"_updatedAt\": \"2023-09-29T00:27:15.189Z\",\n    \"roomId\": \"651619e3a2f73c7460e18cc7\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-teams.create
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The team name.
                type:
                  type: integer
                  description: Privacy of the team (0 - Public, 1 - Private).
                members:
                  type: array
                  description: The user IDs to add to the team when it is created.
                  items:
                    type: string
                room:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of an existing room to use as the team's main room.
                    readOnly:
                      type: boolean
                sidepanel:
                  type: object
                  description: List the team's channels or discussions to be displayed in the sidepanel.
                  properties:
                    items:
                      type: array
                      description: The options are `discussions` and `channels`.
                      items:
                        type: string
                        example: '["discussions", "channels"]'
                owner:
                  type: string
                  description: Set the owner of the team.
              required:
              - name
              - type
            examples:
              Create a public team:
                value:
                  name: teamName
                  type: 0
                  members:
                  - 8dugqGhuRvCBLdZft
                  room:
                    readOnly: true
                  sidepanel:
                    items:
                    - discussions
                    - channels
              Create a team from an existing room:
                value:
                  name: teamName
                  type: 0
                  room:
                    id: 6513afeda2f73c7460e18c86
      responses:
        '200':
          description: 'OK


            Note that the `roomId` is main room ID of the team.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _updatedAt:
                        type: string
                      roomId:
                        type: string
                  success:
                    type: boolean
              examples:
                Team created:
                  value:
                    team:
                      _id: 651619e3a2f73c7460e18cc5
                      name: teamName
                      type: 0
                      createdAt: '2023-09-29T00:27:15.189Z'
                      createdBy:
                        _id: rbAXPnMktTFbNpwtJ
                        username: roxie
                      _updatedAt: '2023-09-29T00:27:15.189Z'
                      roomId: 651619e3a2f73c7460e18cc7
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
