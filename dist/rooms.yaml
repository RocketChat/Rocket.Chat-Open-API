      summary: Get Channel History
      description: "Retrieves the history of a channel. You must be a member of the channel or have the `preview-c-room` permission.\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.75.0 | Added offset property      |\n| 0.47.0  | Added                     |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/channels.history?roomId=dlpfuijw7ej&roomName=general&count=50&offset=50&latest=2016-09-30T13:42:25.304Z&oldest=2016-05-30T13:42:25.304Z&inclusive=True&showThreadMessages=True&unreads=False' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"messages\": [\n    {\n      \"_id\": \"AkzpHAvZpdnuchw2a\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"msg\": \"hi\",\n      \"ts\": \"2016-12-09T12:50:51.555Z\",\n      \"u\": {\n        \"_id\": \"y65tAmHs93aDChMWu\",\n        \"username\": \"testing\"\n      },\n      \"_updatedAt\": \"2016-12-09T12:50:51.562Z\"\n    },\n    {\n      \"_id\": \"vkLMxcctR4MuTxreF\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2016-12-08T15:41:37.730Z\",\n      \"msg\": \"testing2\",\n      \"u\": {\n        \"_id\": \"bRtgdhzM6PD9F8pSx\",\n        \"username\": \"testing2\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2016-12-08T16:03:25.235Z\"\n    },\n    {\n      \"_id\": \"bfRW658nEyEBg75rc\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2016-12-07T15:47:49.099Z\",\n      \"msg\": \"testing\",\n      \"u\": {\n        \"_id\": \"nSYqWzZ4GsKTX4dyK\",\n        \"username\": \"testing1\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2016-12-07T15:47:49.099Z\"\n    },\n    {\n      \"_id\": \"pbuFiGadhRZTKouhB\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2016-12-06T17:57:38.635Z\",\n      \"msg\": \"testing\",\n      \"u\": {\n        \"_id\": \"y65tAmHs93aDChMWu\",\n        \"username\": \"testing\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2016-12-06T17:57:38.635Z\"\n    }\n  ],\n  \"success\": true\n}\n```"
      operationId: get-api-v1-channels.history
      parameters:
      - name: X-Auth-Token
        in: header
