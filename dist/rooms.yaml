              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
              examples:
                No permission:
                  value:
                    success: false
                    error: Not allowed [error-not-allowed]
                    errorType: error-not-allowed
                    details:
                      method: eraseRoom
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
