  /api/v1/rooms.export:
    post:
      tags:
      - Rooms
      summary: Export Room
      description: "Export room messages to a file or email. When exporting to a file, the ZIP file is stored in the `/tmp` directory on the Rocket.Chat server, and its details are recorded in the `rocketchat_user_data_files` collection in MongoDB.\n\nPermission required: `mail-messages`\n\n### Changelog\n\n| Version | Description                          |\n| ------- | ------------------------------------ |\n| 3.8.0   | Added                                |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.export \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"rid\": \"iu7jtPAhvEeAS5tNq\",\n  \"type\": \"file\",\n  \"dateFrom\": \"2000-01-01\",\n  \"dateTo\": \"2021-11-25\",\n  \"format\": \"html\",\n  \"toUsers\": [\n    \"test.user\"\n  ],\n  \"toEmails\": [\n    \"test@test.com\"\n  ],\n  \"messages\": [\n    \"yd6NBgNoiWATgDoFt\",\n    \"BoCjicj9DdYoMHHeo\",\n    \"tajMB3aX3sawFWe8W\"\n  ],\n  \"subject\": \"Test Subject \"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-rooms.export
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rid:
                  type: string
                  description: The room ID.
                type:
                  type: string
                  description: How you want the room to be exported. The type of export selected determines the remaining required parameters. It can be either `email` or `file`.
                dateFrom:
                  type: string
                  description: Start date to begin fetching. Use `dateFrom` if  the type is `file`. By default, it selects the oldest possible date.
                dateTo:
                  type: string
                  description: End date for fetching. By default it selects the current date. Use `dateTo` if  the `type` is  `file`.
                format:
                  type: string
                  description: The file type to export as. It can either be `html` or `json`. Use `format` if  the `type` is  `file`.
                toUsers:
                  type: array
                  items:
                    type: string
                  description: An array of users that should recieve the export. ecieve the export. It is required if `type` is `email`.
                toEmails:
                  type: array
                  items:
                    type: string
                  description: 'An array of any additional emails that should recieve the export. It is required if `type` is `email`. '
                messages:
                  type: array
                  items:
                    type: string
                  description: 'An array of  messageId for  the messages that should be exported. It is required if `type` is `email`.  '
                subject:
                  type: string
                  description: 'The subject of the email. It is required if `type` is `email`. '
              required:
              - rid
              - type
            examples:
              Example:
                value:
                  rid: iu7jtPAhvEeAS5tNq
                  type: file
                  dateFrom: '2000-01-01'
                  dateTo: '2021-11-25'
                  format: html
                  toUsers:
                  - test.user
                  toEmails:
                  - test@test.com
                  messages:
                  - yd6NBgNoiWATgDoFt
                  - BoCjicj9DdYoMHHeo
                  - tajMB3aX3sawFWe8W
                  subject: 'Test Subject '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid Room ID:
                  value:
                    success: false
                    error: '[error-invalid-room]'
                    errorType: error-invalid-room
                Invalid Format:
                  value:
                    success: false
                    error: '[error-invalid-format]'
                    errorType: error-invalid-format
                Invalid Params:
                  value:
                    success: false
                    error: '[error-invalid-params]'
                    errorType: error-invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
  /api/v1/rooms.muteUser:
    post:
      tags:
      - Rooms
      summary: Mute User in Room
      description: "Mute a particular user in a room. Permission required: `mute-user`. The room becomes read-only for the muted user. They can still view messages but cannot send any until unmuted.\n\n### Changelog\n\n| Version | Description                          |\n| ------- | ------------------------------------ |\n| 6.8.0   | Added                                |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.muteUser \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"userId\": \"CkCPNfjfhiwWLqC\",\n  \"roomId\": \"JZ8Y2dLfYhsg323Rf\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-rooms.muteUser
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              - roomId
              properties:
                userId:
                  type: string
                  example: CkCPNfjfhiwWLqC
                  description: The user that you want to mute. Alternatively, use the `username` parameter and enter the username as the value.
                roomId:
                  type: string
                  example: JZ8Y2dLfYhsg323Rf
                  description: The room ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Invalid User:
                  value:
                    success: false
                    error: The required "userId" or "username" param provided does not match any users [error-invalid-user]
                    errorType: error-invalid-user
                Invalid Params:
                  value:
                    success: false
                    error: "must have required property 'userId'\n must have required property 'username'\n must match exactly one schema in oneOf [invalid-params]"
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
