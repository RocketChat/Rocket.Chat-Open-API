      operationId: get-api-v1-rooms.roles
      description: "Get the list of roles in a specific room. This endpoint returns users with the `Owner`, `Leader`, and `Moderator` room roles. You can refer to the <a href='https://docs.rocket.chat/docs/roles-in-rocketchat' target='_blank'>Roles user guide</a> for more details on roles in Rocket.Chat.\n\n### Changelog\n| Version | Description                          |\n| ------- | ------------------------------------ |\n| 7.10.0   | Added                               |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.roles?rid=658282732dd9f928ad989e98' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"roles\": [\n    {\n      \"_id\": \"668c75b2b319fc80bf0ed3a1\",\n      \"rid\": \"658282732dd9f928ad989e98\",\n      \"u\": {\n        \"_id\": \"P2dgWPPw5veigwcdK\",\n        \"username\": \"jane.doe\",\n        \"name\": \"Jane Doe\"\n      },\n      \"roles\": [\n        \"moderator\"\n      ]\n    },\n    {\n      \"_id\": \"6819edfa30c9c71254e45d18\",\n      \"rid\": \"658282732dd9f928ad989e98\",\n      \"u\": {\n        \"_id\": \"74HrDgvTTxT56o8R8\",\n        \"username\": \"mary.shelley\",\n        \"name\": \"Mary Shelley\"\n      },\n      \"roles\": [\n        \"leader\"\n      ]\n    },\n    {\n      \"_id\": \"668c7717b319fc80bf0ed3b0\",\n      \"rid\": \"658282732dd9f928ad989e98\",\n      \"u\": {\n        \"_id\": \"qHWhoJwwgk4bwcoNq\",\n        \"username\": \"test.user\"\n      },\n      \"roles\": [\n        \"moderator\"\n      ]\n    },\n    {\n      \"_id\": \"6690c37ab319fc80bf0ed407\",\n      \"rid\": \"658282732dd9f928ad989e98\",\n      \"u\": {\n        \"_id\": \"C38WSSzrGd2NCjzqJ\",\n        \"username\": \"test.cat\"\n      },\n      \"roles\": [\n        \"owner\"\n      ]\n    }\n  ],\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - schema:
          type: string
          example: 658282732dd9f928ad989e98
        in: query
        name: rid
        description: Enter the room ID for which you want to view the room roles.
        required: true
  /api/v1/rooms.isMember:
    get:
      summary: Check Room Member
      tags:
      - Rooms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isMember:
                    type: boolean
                  success:
                    type: boolean
              examples:
                Example 1:
                  value:
                    isMember: true
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                User not available in room:
                  value:
                    success: false
                    error: error-user-not-found
                Missing user ID parameter:
                  value:
                    success: false
                    error: "must have required property 'userId'\n must have required property 'username'\n must match exactly one schema in oneOf [invalid-params]"
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: get-api-v1-rooms.isMember
      description: "Use this endpoint to check whether or not a user is a member of a specific room. If the user is not a member of the room, an error response (`error-user-not-found`) is returned. You can only get the results for the rooms that you are a member of. Otherwise, you get a forbidden error response.\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.isMember?roomId=example&userId=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"isMember\": true,\n  \"success\": true\n}\n```"
      parameters:
      - schema:
          type: string
        in: query
        name: roomId
        description: Enter the room ID in which you want to check for the user.
        required: true
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - schema:
          type: string
        in: query
        name: userId
        description: Enter the user ID that you want to check. Alternatively, you can use the `username` parameter and provide the user name instead of the user ID.
        required: true
