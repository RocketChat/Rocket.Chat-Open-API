openapi: 3.0.0
info:
  version: 1.0.0
  title: Rooms
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/channels.create:
    post:
      tags:
      - Channels
      summary: Create Channel
      description: "Create a public channel. Optionally, include specified users. The channel creator is included as a member by default. Permission required: `create-c`.\nChannel naming has restraints following the regex filter `[0-9a-zA-Z-_.]+` by default. See <a href=\"https://docs.rocket.chat/docs/general#utf8\" target=\"_blank\">UTF8 Settings</a> to modify regex filter for channel names. Channel names must not allow for any whitespaces.\n\n### Changelog\n\n| Version | Description               |\n| ------- | ------------------------- |\n| 6.4.1   | Added `excludeSelf` param |\n| 0.13.0  | Added                     |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"name\": \"channelname\",\n  \"members\": [\n    \"rocket.cat\"\n  ],\n  \"readOnly\": true,\n  \"excludeSelf\": true,\n  \"customFields\": {\n    \"type\": \"default\"\n  },\n  \"extraData\": {\n    \"broadcast\": true,\n    \"encrypted\": false,\n    \"teamId\": \"658441562dd9f928ad9951aa\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"channel\": {\n    \"_id\": \"ByehQjC44FwMeiLbX\",\n    \"name\": \"channelname\",\n    \"t\": \"c\",\n    \"usernames\": [\n      \"example\"\n    ],\n    \"msgs\": 0,\n    \"u\": {\n      \"_id\": \"aobEdbYhXfu5hkeqG\",\n      \"username\": \"example\"\n    },\n    \"ts\": \"2016-05-30T13:42:25.304Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.create
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the channel.
                members:
                  type: array
                  description: An array of the users to be added to the channel when it is created.
                  items:
                    type: string
                readOnly:
                  type: boolean
                  description: Set if the channel is read only or not. It is `false` by default.
                excludeSelf:
                  type: boolean
                  description: If set to true, the user calling the endpoint is not automatically added as a member of the channel. The default `value` is false.
                customFields:
                  type: object
                  description: If you have defined custom fields for your workspace, you can provide them in this object parameter. For details, see the <a href='https://docs.rocket.chat/docs/custom-fields' target='_blank'>Custom Fields</a> document.
                extraData:
                  type: object
                  description: 'Enter the following details for the object:

                    - `broadcast`: Whether the channel should be a broadcast room.

                    - `encrypted`: Whether the channel should be encrypted.

                    - `teamId`: Enter an existing team ID for this channel. You need the `create-team-channel` permission to add a team to a channel.


                    For more information, see <a href=''https://docs.rocket.chat/use-rocket.chat/user-guides/rooms/channels#channel-privacy-and-encryption'' target=''_blank''>Channels</a>'
              required:
              - name
            examples:
              Example:
                value:
                  name: channelname
                  members:
                  - rocket.cat
                  readOnly: true
                  excludeSelf: true
                  customFields:
                    type: default
                  extraData:
                    broadcast: true
                    encrypted: false
                    teamId: 658441562dd9f928ad9951aa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    properties:
                      _id:
                        type: string
                      fname:
                        type: string
                      _updatedAt:
                        type: string
                      customFields:
                        type: object
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                          name:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      default:
                        type: boolean
                      sysMes:
                        type: boolean
                  success:
                    type: boolean
              examples:
                Example:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      name: channelname
                      t: c
                      usernames:
                      - example
                      msgs: 0
                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: example
                      ts: '2016-05-30T13:42:25.304Z'
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.addAll:
    post:
      tags:
      - Channels
      summary: Add all Users to a Channel
      description: "Adds all users in the workspace to a public room. Permission required: `add-all-to-room`.\nThe maximum number of users you can add at once depends on your workspace's REST API settings. To access this setting, go to **Manage** > **Workspace** > **Settings** > **General** > **REST API** > **User Limit for Adding All Users to Channel**.\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n|0.55.0   | Added `activeUsersOnly` param |\n|0.48.0   | Renamed to `channels.addAll` from `channel.addAll`|\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.addAll \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"WDuJLFkjwk6L7LdFC\",\n  \"activeUsersOnly\": true\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"channel\": {\n    \"_id\": \"ByehQjC44FwMeiLbX\",\n    \"name\": \"channelname\",\n    \"t\": \"c\",\n    \"usernames\": [\n      \"example\",\n      \"rocket.cat\"\n    ],\n    \"msgs\": 0,\n    \"u\": {\n      \"_id\": \"aobEdbYhXfu5hkeqG\",\n      \"username\": \"example\"\n    },\n    \"ts\": \"2016-05-30T13:42:25.304Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.addAll
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel's ID.
                activeUsersOnly:
                  type: boolean
                  description: Add only active users. It is `false` by default.
              required:
              - roomId
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  activeUsersOnly: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    properties:
                      _id:
                        type: string
                      fname:
                        type: string
                      customFields:
                        type: object
                      topic:
                        type: string
                      broadcast:
                        type: boolean
                      encrypted:
                        type: boolean
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      default:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                      lastMessage:
                        type: object
                        properties:
                          _id:
                            type: string
                          rid:
                            type: string
                          msg:
                            type: string
                          ts:
                            type: string
                          u:
                            type: object
                            properties:
                              _id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          _updatedAt:
                            type: string
                          urls:
                            type: array
                            items:
                              type: object
                          mentions:
                            type: array
                            items:
                              type: object
                          channels:
                            type: array
                            items:
                              type: object
                          md:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                value:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                      value:
                                        type: string
                      lm:
                        type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      name: channelname
                      t: c
                      usernames:
                      - example
                      - rocket.cat
                      msgs: 0
                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: example
                      ts: '2016-05-30T13:42:25.304Z'
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.addLeader:
    post:
      tags:
      - Channels
      summary: Add Channel Leader
      description: "Assign the role of `leader` to a channel member. See <a href='https://docs.rocket.chat/docs/room-roles' target='_blank'>Room Roles</a> for details about the roles.\n\nPermission required: `set-leader`\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.75.0   | Added                    |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.addLeader \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"WDuJLFkjwk6L7LdFC\",\n  \"userId\": \"b66oZ8i9pkeSko33v\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.addLeader
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID.
                userId:
                  type: string
                  description: The ID of the user to be made leader.
              required:
              - roomId
              - userId
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  userId: b66oZ8i9pkeSko33v
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                User is a leader:
                  value:
                    success: false
                    error: User is already a leader [error-user-already-leader]
                    errorType: error-user-already-leader
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.addModerator:
    post:
      tags:
      - Channels
      summary: Add Channel Moderator
      description: "Assign the `moderator` role to a channel member. See <a href='https://docs.rocket.chat/docs/room-roles' target='_blank'>Room Roles</a> for details about the roles.\n\nPermission required: `set-moderator`\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.49.4  | Added                     |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.addModerator \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"WDuJLFkjwk6L7LdFC\",\n  \"userId\": \"b66oZ8i9pkeSko33v\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.addModerator
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID.
                userId:
                  type: string
                  description: The user ID that you want to set as the moderator.
              required:
              - roomId
              - userId
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  userId: b66oZ8i9pkeSko33v
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                User is already a moderator:
                  value:
                    success: false
                    error: User is already a moderator [error-user-already-moderator]
                    errorType: error-user-already-moderator
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.addOwner:
    post:
      tags:
      - Channels
      summary: Add Channel Owner
      description: "Assign the `owner` role to a channel member. See <a href='https://docs.rocket.chat/docs/room-roles' target='_blank'>Room Roles</a> for details about the roles.\n\nPermission required:  `set-owner`\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.49.4   | Added                    |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.addOwner \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"WDuJLFkjwk6L7LdFC\",\n  \"userId\": \"b66oZ8i9pkeSko33v\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.addOwner
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID.
                userId:
                  type: string
                  description: The user ID that you want to set as the channel owner.
              required:
              - roomId
              - userId
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  userId: b66oZ8i9pkeSko33v
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
              examples:
                User is alrready an owner:
                  value:
                    success: false
                    error: User is already an owner [error-user-already-owner]
                    errorType: error-user-already-owner
                    details:
                      method: addRoomOwner
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.anonymousread:
    get:
      tags:
      - Channels
      summary: Read Channel Messages Anonymously
      description: "Fetch the messages in a public channel to an anonymous user. You must enable `Accounts_AllowAnonymousRead` <a href=\"https://docs.rocket.chat/docs/accounts\" target=\"_blank\">setting</a> in the workspace.\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 1.2.0   | Added                     |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/channels.anonymousread?roomId=dlpfuijw7ej&roomName=general&offset=50&count=50&fields=example'\n```\n\n### Example success response\n\n```json\n{\n  \"messages\": [\n    {\n      \"_id\": \"xadufzmxzYQp4H9py\",\n      \"alias\": \"test\",\n      \"msg\": \"Example message\",\n      \"attachments\": [],\n      \"parseUrls\": true,\n      \"bot\": {\n        \"i\": \"MnQyfhWt5LqZotyfc\"\n      },\n      \"groupable\": false,\n      \"ts\": \"2018-10-05T01:10:47.524Z\",\n      \"u\": {\n        \"_id\": \"rocket.cat\",\n        \"username\": \"rocket.cat\",\n        \"name\": \"Rocket.Cat\"\n      },\n      \"rid\": \"GENERAL\",\n      \"_updatedAt\": \"2018-10-05T13:42:51.163Z\",\n      \"reactions\": {\n        \":grin:\": {\n          \"usernames\": [\n            \"marco.zoo\"\n          ]\n        }\n      },\n      \"mentions\": [],\n      \"channels\": [],\n      \"starred\": {\n        \"_id\": \"KPkEYwKKBKZnEEPpt\"\n      }\n    },\n    {\n      \"_id\": \"id-1538701845987\",\n      \"rid\": \"GENERAL\",\n      \"msg\": \"This message was edited via API\",\n      \"alias\": \"Gruggy\",\n      \"emoji\": \":smirk:\",\n      \"avatar\": \"http://res.guggy.com/logo_128.png\",\n      \"attachments\": [\n        {\n          \"collapsed\": false,\n          \"color\": \"#ff0000\",\n          \"text\": \"Yay for gruggy!\",\n          \"ts\": \"2016-12-09T16:53:06.761Z\",\n          \"message_link\": \"https://google.com\",\n          \"thumb_url\": \"http://res.guggy.com/logo_128.png\",\n          \"author_name\": \"Bradley Hilton\",\n          \"author_link\": \"https://rocket.chat/\",\n          \"author_icon\": \"https://avatars.githubusercontent.com/u/850391?v=3\",\n          \"title\": \"Attachment Example\",\n          \"title_link\": \"https://youtube.com\",\n          \"title_link_download\": true,\n          \"image_url\": \"http://res.guggy.com/logo_128.png\",\n          \"audio_url\": \"http://www.w3schools.com/tags/horse.mp3\",\n          \"video_url\": \"http://www.w3schools.com/tags/movie.mp4\",\n          \"fields\": [\n            {\n              \"short\": true,\n              \"title\": \"Test\",\n              \"value\": \"Testing out something or other\"\n            },\n            {\n              \"short\": true,\n              \"title\": \"Another Test\",\n              \"value\": \"<a href=\\\"https://google.com\\\" target=\\\"_blank\\\">Link</a> something and this and that.\"\n            }\n          ]\n        }\n      ],\n      \"ts\": \"2018-10-05T01:10:45.994Z\",\n      \"u\": {\n        \"_id\": \"rocketchat.internal.admin.test\",\n        \"username\": \"rocketchat.internal.admin.test\",\n        \"name\": \"RocketChat Internal Admin Test\"\n      },\n      \"_updatedAt\": \"2018-10-05T01:10:47.064Z\",\n      \"editedBy\": {\n        \"_id\": \"rocketchat.internal.admin.test\",\n        \"username\": \"rocketchat.internal.admin.test\"\n      },\n      \"editedAt\": \"2018-10-05T01:10:46.384Z\",\n      \"reactions\": {\n        \":smile:\": {\n          \"usernames\": [\n            \"rocketchat.internal.admin.test\"\n          ]\n        },\n        \":squid:\": {\n          \"usernames\": [\n            \"rocketchat.internal.admin.test\"\n          ]\n        },\n        \":bee:\": {\n          \"usernames\": [\n            \"rocketchat.internal.admin.test\"\n          ]\n        },\n        \":ant:\": {\n          \"usernames\": [\n            \"rocketchat.internal.admin.test\"\n          ]\n\n  ... (truncated)\n```"
      operationId: get-api-v1-channels.anonymousread
      parameters:
      - name: roomId
        in: query
        description: The room ID. It is required if the `roomName` is not provided.
        schema:
          type: string
        example: dlpfuijw7ej
      - name: roomName
        in: query
        description: The room name.  It is required if the `roomId` is not provided.
        required: false
        schema:
          type: string
        example: general
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: sort
        in: query
        description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, {"value": -1, "_id": 1}. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
        required: false
        schema: {}
      - name: query
