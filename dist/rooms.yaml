      operationId: post-api-v1-rooms.mediaConfirm-rid-fileId
      description: "Use this endpoint to send a specific file to a room. You can use this endpoint only after calling the <a href='https://developer.rocket.chat/apidocs/upload-media-files-to-a-room' target='_blank'>Upload Media Files to a Room</a> endpoint and getting the file ID.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.mediaConfirm/{rid}/{fileId} \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"alias\": \"test\",\n  \"avatar\": \"https://picsum.photos/200\",\n  \"description\": \"file upload description parameter\",\n  \"groupable\": false,\n  \"msg\": \"file upload message parameter\",\n  \"customFields\": \"{\\\"priority\\\": \\\"low\\\"}\",\n  \"emoji\": \":one:\",\n  \"tmid\": \"ZSnsznbWKqppnRny5\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"message\": {\n    \"_id\": \"2ZABtFgt89fYYSw3Q\",\n    \"rid\": \"GENERAL\",\n    \"ts\": \"2025-12-17T05:49:55.825Z\",\n    \"msg\": \"\",\n    \"file\": {\n      \"_id\": \"69424442ddfe6ceaf280f93f\",\n      \"name\": \"44.jpg\",\n      \"type\": \"image/jpeg\",\n      \"size\": 71224,\n      \"format\": \"jpeg\"\n    },\n    \"files\": [\n      {\n        \"_id\": \"69424442ddfe6ceaf280f93f\",\n        \"name\": \"44.jpg\",\n        \"type\": \"image/jpeg\",\n        \"size\": 71224,\n        \"format\": \"jpeg\"\n      },\n      {\n        \"_id\": \"69424483ddfe6ceaf280f941\",\n        \"name\": \"thumb-44.jpg\",\n        \"type\": \"image/jpeg\",\n        \"size\": 13473,\n        \"format\": \"jpeg\"\n      }\n    ],\n    \"attachments\": [\n      {\n        \"title\": \"44.jpg\",\n        \"title_link\": \"/file-upload/69424442ddfe6ceaf280f93f/44.jpg\",\n        \"title_link_download\": true,\n        \"image_dimensions\": {\n          \"width\": 368,\n          \"height\": 360\n        },\n        \"image_preview\": \"/9j/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQgsW+OGY6OKR5o3hGJfr6n3n5JkvPdSpXal1BmuoReom//Z\",\n        \"image_url\": \"/file-upload/69424483ddfe6ceaf280f941/44.jpg\",\n        \"image_type\": \"image/jpeg\",\n        \"image_size\": 71224,\n        \"type\": \"file\"\n      }\n    ],\n    \"u\": {\n      \"_id\": \"C38WSSzrGd2NCjzqJ\",\n      \"username\": \"test.cat\",\n      \"name\": \"test cat\"\n    },\n    \"_updatedAt\": \"2025-12-17T05:49:55.959Z\",\n    \"urls\": []\n  },\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Enter a file description.
                  example: file description
                emoji:
                  type: string
                  description: The emoji you enter will be displayed as the avatar when the message is sent.
                  example: ':one:'
                groupable:
                  type: boolean
                  description: Whether or not multiple messages can be grouped.
                msg:
                  type: string
                  description: Enter a message to be sent with the file.
                  example: hello world
                tmid:
                  type: string
                  description: If you want to send the file to a thread, enter the thread ID here.
                  example: ZSnsznbWKqppnRny5
                avatar:
                  type: string
