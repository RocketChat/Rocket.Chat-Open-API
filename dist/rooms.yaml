      - Channels
      summary: Convert Channel to Team
      description: "Convert a channel to a team.\n\nPermissions required: `create-team`, `edit-room`. Both permissions are checked against the target channel, whether you identify it by `channelId` or `channelName`.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.7.0   | Enforced room permission checks regardless of whether the channel is identified by ID or name. |\n| 3.13.0  | Added |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.convertToTeam \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"channelId\": \"6513afeda2f73c7460e18c86\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"team\": {\n    \"_id\": \"65149c7ea2f73c7460e18cab\",\n    \"name\": \"messages\",\n    \"type\": 0,\n    \"createdAt\": \"2023-09-27T21:19:58.972Z\",\n    \"createdBy\": {\n      \"_id\": \"rbAXPnMktTFbNpwtJ\",\n      \"username\": \"roxie\"\n    },\n    \"_updatedAt\": \"2023-09-27T21:19:58.972Z\",\n    \"roomId\": \"6513afeda2f73c7460e18c86\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.convertToTeam
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channelId:
                  type: string
                  description: The channel's ID. Provide either `channelId` or `channelName`, but not both.
                channelName:
                  type: string
                  description: The channel's name. Provide either `channelName` or `channelId`, but not both.
              oneOf:
              - required:
                - channelId
              - required:
                - channelName
            examples:
              Convert channel by ID:
                value:
                  channelId: 6513afeda2f73c7460e18c86
              Convert channel by name:
                value:
                  channelName: messages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      type:
                        type: integer
                      createdAt:
                        type: string
                      createdBy:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      _updatedAt:
                        type: string
                      roomId:
                        type: string
                  success:
                    type: boolean
              examples:
                Channel converted to team:
                  value:
                    team:
                      _id: 65149c7ea2f73c7460e18cab
                      name: messages
                      type: 0
                      createdAt: '2023-09-27T21:19:58.972Z'
                      createdBy:
                        _id: rbAXPnMktTFbNpwtJ
                        username: roxie
