      description: "Remove a channel from the user's list of channels in the workspace sidebar. You can access it again from the **Directory**.\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.48.0  | Added                     |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.close \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"ByehQjC44FwMeiLbX\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.close
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID that you want to close from your list.
              required:
              - roomId
            examples:
              Example:
                value:
                  roomId: ByehQjC44FwMeiLbX
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Channel is already closed:
                  value:
                    success: false
                    error: The channel, dlp, is already closed to the sender
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.counters:
    get:
      tags:
      - Channels
      summary: Get Channel Counters
      description: "Gets channel counter for the authenticated user.\n\nPermission required: `view-room-administration`\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.65.0  | Added                     |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/channels.counters?roomId=dlpfuijw7ej&roomName=general&userId=RtycPC29hqLJfT9xj' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"joined\": true,\n  \"members\": 23,\n  \"unreads\": 2,\n  \"unreadsFrom\": \"2023-09-12T16:33:11.644Z\",\n  \"msgs\": 7345,\n  \"latest\": \"2023-09-25T22:50:07.979Z\",\n  \"userMentions\": 0,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-channels.counters
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: roomId
        in: query
        description: The room ID. It is required if the `roomName` is not provided.
        schema:
          type: string
        example: dlpfuijw7ej
      - name: roomName
        in: query
        description: The room name.  It is required if the `roomId` is not provided.
        required: false
        schema:
          type: string
        example: general
      - name: userId
        in: query
        description: The user ID.
        schema:
          type: string
          example: RtycPC29hqLJfT9xj
      responses:
        '200':
          description: "OK\n\n**Note** \n- `joined` boolean flag whether the user has joined the room or not.\n- `members` is the count of current room members.\n- `unreads` is the count of unread messages for the specified user (for the calling user or the provided user ID).\n- `unreadsFrom` is the start date-time of unread interval for the specified user.\n- `msgs` is the count of messages in the room.\n- `latest` is the end date-time of unread interval for the specified user (or date-time of last posted message).\n- `userMentions` is the count of user mentions in messages."
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:
                    type: boolean
                  members:
                    type: integer
                  unreads:
                    type: integer
                  unreadsFrom:
                    type: string
                  msgs:
                    type: integer
                  latest:
                    type: string
                  userMentions:
                    type: integer
                  success:
                    type: boolean
              examples:
                Example:
                  value:
                    joined: true
                    members: 23
                    unreads: 2
                    unreadsFrom: '2023-09-12T16:33:11.644Z'
                    msgs: 7345
                    latest: '2023-09-25T22:50:07.979Z'
                    userMentions: 0
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
