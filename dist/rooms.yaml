                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: The parameter "roomId" or "roomName" is required [error-roomid-param-not-provided]
                    errorType: error-roomid-param-not-provided
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/rooms.getDiscussions:
