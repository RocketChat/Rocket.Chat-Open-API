                  type: array
                  description: The users (IDs and roles) to add to the team.
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
              required:
              - teamId
              - members
            examples:
              Example:
                value:
                  teamId: 63f3efc4b000b6b6d86704b2
                  members:
                  - userId: rYhzFRd2QZjNwAAXX
                    roles:
                    - member
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
