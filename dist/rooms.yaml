                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      operationId: post-api-v1-uploads.delete
      description: "Delete a specific file uploaded to a room. The response includes the list of files that were successfully removed. It may include additional files such as image thumbnails. \n\nUsers can delete messages only in the following cases:\n * The **Allow Message Deleting** setting is enabled in the workspace's **<a href='https://docs.rocket.chat/docs/message' target='_blank'>Message</a>** settings.\n * If the `Block Message Deleting After (n) Minutes` message setting has a non-zero value, the `bypass-time-limit-edit-and-delete` permission is required to delete messages after the defined time limit.\n * In read-only rooms, the `post-readonly` permission is required to delete messages.\n * The `delete-own-message` permission is required to delete users' own messages.\n * The `delete-message` permission is required for users to delete messages from other users.\n \n ### Changelog\n | Version | Description |\n | ------- | ----------- |\n | 8.2.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/uploads.delete \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"fileId\": \"699e6b8a8eddae7c5eaed9c3\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"deletedFiles\": [\n    \"699e6b8a8eddae7c5eaed9c3\",\n    \"699e6b8b8eddae7c5eaed9c5\"\n  ],\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - fileId
              properties:
                fileId:
                  type: string
                  description: Enter the file ID of the file that you want to delete. You can get this value from the <a href='https://developer.rocket.chat/apidocs/get-room-images' target='_blank'>Get Room Images</a> endpoint.
                  example: 699e6b8a8eddae7c5eaed9c3
            examples:
              Example 1:
                value:
                  fileId: 699e6b8a8eddae7c5eaed9c3
