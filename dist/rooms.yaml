  /api/v1/groups.history:
    get:
      tags:
      - Groups
      summary: Get Group History
      description: "Retrieves the messages from a private channel you belong to.\n\n### Changelog\n| Version | Description             |\n| ------- | ----------------------- |\n| 0.75.0  | Added `offset` property |\n| 0.48.0  | Added                   |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/groups.history?roomId=jdiue8TGkodp&latest=2025-09-30T13:42:25.304Z&oldest=2025-05-30T13:42:25.304Z&inclusive=True&unreads=False&offset=50&count=50' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"messages\": [\n    {\n      \"_id\": \"AkzpHAvZpdnuchw2a\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"msg\": \"hi\",\n      \"ts\": \"2025-12-09T12:50:51.555Z\",\n      \"u\": {\n        \"_id\": \"y65tAmHs93aDChMWu\",\n        \"username\": \"testing\"\n      },\n      \"_updatedAt\": \"2025-12-09T12:50:51.562Z\"\n    },\n    {\n      \"_id\": \"vkLMxcctR4MuTxreF\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2025-12-08T15:41:37.730Z\",\n      \"msg\": \"testing2\",\n      \"u\": {\n        \"_id\": \"bRtgdhzM6PD9F8pSx\",\n        \"username\": \"testing2\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2025-12-08T16:03:25.235Z\"\n    },\n    {\n      \"_id\": \"bfRW658nEyEBg75rc\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2025-12-07T15:47:49.099Z\",\n      \"msg\": \"testing\",\n      \"u\": {\n        \"_id\": \"nSYqWzZ4GsKTX4dyK\",\n        \"username\": \"testing1\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2025-12-07T15:47:49.099Z\"\n    },\n    {\n      \"_id\": \"pbuFiGadhRZTKouhB\",\n      \"t\": \"uj\",\n      \"rid\": \"ByehQjC44FwMeiLbX\",\n      \"ts\": \"2025-12-06T17:57:38.635Z\",\n      \"msg\": \"testing\",\n      \"u\": {\n        \"_id\": \"y65tAmHs93aDChMWu\",\n        \"username\": \"testing\"\n      },\n      \"groupable\": false,\n      \"_updatedAt\": \"2025-12-06T17:57:38.635Z\"\n    }\n  ],\n  \"success\": true\n}\n```"
      operationId: get-api-v1-groups.history
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: roomId
        in: query
        description: The room id.
        required: true
        schema:
          type: string
        example: jdiue8TGkodp
      - name: latest
        in: query
        description: The end of the time range of messages to retrieve. The default value is the current date and time.
        schema:
          type: string
        example: '2025-09-30T13:42:25.304Z'
      - name: oldest
        in: query
        description: The start of the time range to retrieve messages.
        schema:
          type: string
        example: '2025-05-30T13:42:25.304Z'
      - name: inclusive
        in: query
        description: Whether messages sent on the latest and oldest dates should be included. The default value is false.
        schema:
          type: boolean
        example: true
      - name: unreads
        in: query
        description: Whether unread messages should be included in the response. The default value is false.
        schema:
          type: boolean
        example: false
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        rid:
                          type: string
                        msg:
                          type: string
