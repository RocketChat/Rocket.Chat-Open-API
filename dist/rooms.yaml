      description: "Hide rooms without restrictions based on type. You can only hide a room if you have access to it.\n\n### Changelog\n\n| Version | Description                          |\n| ------- | ------------------------------------ |\n| 7.4.0   | Added                                |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.hide \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"6759dea438288929cff551c\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
  /api/v1/findOrCreateInvite:
    post:
