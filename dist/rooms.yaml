      description: "Join a public channel.\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.49.0  | Added                  |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.join \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"ByehQjC44FwMeiLbX\",\n  \"joinCode\": \"1234\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"channel\": {\n    \"_id\": \"nxXKHF2o2nzKYtFMM\",\n    \"name\": \"test\",\n    \"fname\": \"test\",\n    \"t\": \"c\",\n    \"msgs\": 8,\n    \"usersCount\": 2,\n    \"u\": {\n      \"_id\": \"rocketchat.internal.admin.test\",\n      \"username\": \"rocketchat.internal.admin.test\"\n    },\n    \"customFields\": {},\n    \"broadcast\": false,\n    \"encrypted\": false,\n    \"ts\": \"2019-01-16T12:00:04.783Z\",\n    \"ro\": false,\n    \"sysMes\": true,\n    \"default\": false,\n    \"_updatedAt\": \"2019-01-16T12:06:30.426Z\",\n    \"joinCodeRequired\": true\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.join
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID.
                joinCode:
                  type: string
                  description: 'The join code of the room. Channels can be password-protected. In that case, users must enter the password for access. See <a href=''https://docs.rocket.chat/docs/channels#channel-information'' target=''_blank''>Channel information</a> for details.

                    The join code isn''t needed if the user has the `join-without-join-code` permission.'
              required:
              - roomId
            examples:
