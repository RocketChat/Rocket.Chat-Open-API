          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    days:
                      type: integer
                    maxUses:
                      type: integer
                    rid:
                      type: string
                    userId:
                      type: string
                    createdAt:
                      type: string
                    expires:
                      type: string
                      nullable: true
                    uses:
                      type: integer
                    _updatedAt:
                      type: string
              examples:
