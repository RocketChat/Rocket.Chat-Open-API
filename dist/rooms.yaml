      description: "List the public and private rooms whose names match a given string, excluding discussions, DMs, and omnichannel rooms. The endpoint is valuable when performing search operations. It returns only rooms that the user belongs to. This endpoint includes pagination query parameters.\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.autocomplete.channelAndPrivate.withPagination?count=50&offset=50&selector={\"name\":\"api\"}' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"items\": [\n    {\n      \"_id\": \"66c82e1e237405fc05fc1ef4\",\n      \"fname\": \"api-team\",\n      \"name\": \"api-team\",\n      \"t\": \"c\"\n    },\n    {\n      \"_id\": \"66c88dae237405fc05fc1f06\",\n      \"fname\": \"api-team2\",\n      \"name\": \"api-team2\",\n      \"t\": \"p\"\n    }\n  ],\n  \"total\": 4,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: sort
        in: query
        description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, {"value": -1, "_id": 1}. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
        required: false
        schema: {}
      - schema:
          type: string
          example: '{"name":"api"}'
        in: query
        name: selector
        description: The search term to be completed. It only applies to the room name.
        required: true
