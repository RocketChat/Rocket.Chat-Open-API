                    description: The channel's ID.
                    example: nSYqWzZ4GsKTX4dyK
                  userId:
                    type: string
                    description: The user id to be invited.
                    example: ByehQjC44FwMeiLbX
                required:
                - roomId
                - userId
              - type: object
                properties:
                  roomId:
                    type: string
                    description: The channel's id
