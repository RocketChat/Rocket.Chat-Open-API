      operationId: post-api-v1-channels.delete
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  example: ByehQjC44FwMeiLbX
                  description: Enter the room ID. This parameter is required if no `roomName` is provided.
                roomName:
                  type: string
                  example: general
                  description: Enter the room name. This parameter is required if no `roomId` is provided.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
