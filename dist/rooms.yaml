  /api/v1/channels.setType:
    post:
      tags:
      - Channels
      summary: Set Channel Type
      description: "Set the channel type. The channel type can be either `c` (public) or `p` (private). The following permissions are required:\n* `create-c`: To change a private group to a public channel.\n* `create-p`: To change a public channel to a private room.\n\nFor ABAC-managed private rooms, changing the type from `p` to `c` is rejected with `error-action-not-allowed`.\nWhen the type changes to `c` (public) and the room has ABAC attributes, all ABAC attributes on the room are cleared as part of the conversion.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.5.0   | Added ABAC behavior for `p` -> `c`: ABAC-managed private rooms are rejected, and successful conversions to public clear room ABAC attributes. |\n| 0.49.0  | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.setType \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"WDuJLFkjwk6L7LdFC\",\n  \"type\": \"p\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"channel\": {\n    \"_id\": \"ByehQjC44FwMeiLbX\",\n    \"name\": \"testing0\",\n    \"t\": \"p\",\n    \"msgs\": 0,\n    \"u\": {\n      \"_id\": \"aiPqNoGkjpNDiRx6d\",\n      \"username\": \"goose160\"\n    },\n    \"ts\": \"2017-01-05T18:02:50.754Z\",\n    \"ro\": false,\n    \"sysMes\": true,\n    \"_updatedAt\": \"2017-01-05T19:02:24.429Z\",\n    \"usernames\": [\n      \"goose160\",\n      \"graywolf336\"\n    ],\n    \"joinCodeRequired\": true,\n    \"muted\": []\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.setType
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel's ID. Alternatively, enter the `channelName` parameter and provide the channel's name as the value.
                type:
                  type: string
                  description: "The channel's type. The type of room this channel should be, either c or p. \n\n`c` is for channel and `p` is for private."
              required:
              - roomId
              - type
            examples:
              Example:
                value:
                  roomId: WDuJLFkjwk6L7LdFC
                  type: p
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                      usernames:
                        type: array
                        items:
                          type: string
                      joinCodeRequired:
                        type: boolean
                      muted:
                        type: array
                        items:
                          type: object
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    channel:
                      _id: ByehQjC44FwMeiLbX
                      name: testing0
                      t: p
                      msgs: 0
                      u:
                        _id: aiPqNoGkjpNDiRx6d
                        username: goose160
                      ts: '2017-01-05T18:02:50.754Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2017-01-05T19:02:24.429Z'
                      usernames:
                      - goose160
                      - graywolf336
                      joinCodeRequired: true
                      muted: []
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
