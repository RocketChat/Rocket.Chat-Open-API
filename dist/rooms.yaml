  /api/v1/rooms.saveNotification:
    post:
      tags:
      - Rooms
      summary: Set Room Notifications
      description: "Set the <a href='https://docs.rocket.chat/docs/room-actions#manage-room-notifications' target='_blank'>notification settings</a> of a specific room.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n|0.63.0  | Added        |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.saveNotification \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"5of4weEXaH7yncxz9\",\n  \"notifications\": {\n    \"desktopNotifications\": \"all\",\n    \"disableNotifications\": 0,\n    \"emailNotifications\": \"nothing\",\n    \"audioNotificationValue\": \"beep\",\n    \"desktopNotificationDuration\": \"2\",\n    \"audioNotifications\": \"all\",\n    \"unreadAlert\": \"nothing\",\n    \"hideUnreadStatus\": 0,\n    \"mobilePushNotifications\": \"mentions\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-rooms.saveNotification
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel's id
                notifications:
                  type: object
                  description: The object that contains the following parameters.
                  properties:
                    desktopNotifications:
                      type: string
                      description: "The value for desktop notifications. The options are: \n- nothing\n- mentions\n- all\n- default"
                    disableNotifications:
                      type: string
                      description: "The value to disable/enable channel's notifications. \n\nThe options are:\n- 0\n- 1"
                    emailNotifications:
                      type: string
                      description: "The value for email notifications. \nThe options are:\n- nothing\n- mentions\n- all\n- default"
                    audioNotificationValue:
                      type: string
                      description: The value for audio notification sound.
                    desktopNotificationDuration:
                      type: string
                      description: The value for desktop notification duration.
                    audioNotifications:
                      type: string
                      description: "The value for audio notifications. \n\nThe options are:\n- nothing\n- mentions\n- all\n- default"
                    unreadAlert:
                      type: string
                      description: "The value for unread alerts notifications. \n\nThe options are:\n- nothing\n- mentions\n- all\n- default"
                    hideUnreadStatus:
                      type: string
                      description: "The value to disable/enable number of unread messages. \nThe options are:\n- 0\n- 1"
                    mobilePushNotifications:
                      type: string
                      description: "The value for mobile push notifications. \n\nThe options are:\n- nothing\n- mentions\n- all\n- default"
              required:
              - roomId
              - notifications
            examples:
              Example:
                value:
                  roomId: 5of4weEXaH7yncxz9
                  notifications:
                    desktopNotifications: all
                    disableNotifications: 0
                    emailNotifications: nothing
                    audioNotificationValue: beep
                    desktopNotificationDuration: '2'
                    audioNotifications: all
                    unreadAlert: nothing
                    hideUnreadStatus: 0
                    mobilePushNotifications: mentions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/rooms.adminRooms:
    get:
      tags:
      - Rooms
      summary: Get All Room Admins
      description: "Retrieves all rooms and admin information.\n\nPermission required: `view-room-administration`\n\n### Changelog\n| Version | Description  |\n| ------- |--------------|\n| 8.7.0  | Restored `customFields` in the response |\n| 2.4.0  | Added         |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.adminRooms?types=[\"example\"]&filter=example&count=50&offset=50&sort=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"rooms\": [\n    {\n      \"_id\": \"654c9d1ca2f73c7460e1918b\",\n      \"fname\": \"animalGeography\",\n      \"topic\": \"\",\n      \"broadcast\": false,\n      \"name\": \"animalGeography\",\n      \"t\": \"p\",\n      \"msgs\": 4,\n      \"usersCount\": 1,\n      \"u\": {\n        \"_id\": \"CkCPNcvsvCDfmWLqC\",\n        \"username\": \"kim.jane\",\n        \"name\": \"kim.jane\"\n      },\n      \"ro\": false,\n      \"default\": false,\n      \"customFields\": {\n        \"department\": \"engineering\",\n        \"priority\": \"high\"\n      }\n    }\n  ],\n  \"count\": 1,\n  \"offset\": 0,\n  \"total\": 1,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-rooms.adminRooms
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: types
        in: query
        description: "The room types. The possible room types are:\n - `d`: Direct messages\n - `c`: Public channel\n - `p`: Private channel\n - `discussions`: Team or channel discussions\n - `teams`: Workspace teams\n - `l`: Livechat\n - `v`: Omnichannel VoIP rooms"
        schema:
          type: array
          items:
            type: string
      - name: filter
        in: query
        description: The rooms name
        schema:
          type: string
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - schema:
          type: string
        in: query
        name: sort
        description: "Sort the channels in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON object. The options are as follows:\n * `ts`: Sort by creation timestamp. For example, `sort={\"ts\":-1}`\n * `usersCount`: Sort by number of users. For example, `sort={\"usersCount\":1}`\n * `name`: Sort by the room name. For example, `sort={\"name\":1}`"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        fname:
                          type: string
                        description:
                          type: string
                        broadcast:
                          type: boolean
                        federated:
                          type: boolean
                        name:
                          type: string
                        t:
                          type: string
                        msgs:
                          type: integer
                        usersCount:
                          type: integer
                        u:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                        ro:
                          type: boolean
                        default:
                          type: boolean
                        topic:
                          type: string
                        announcement:
                          type: string
                        customFields:
                          type: object
                          description: The custom fields set on the room.
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    rooms:
                    - _id: 654c9d1ca2f73c7460e1918b
                      fname: animalGeography
                      topic: ''
                      broadcast: false
                      name: animalGeography
                      t: p
                      msgs: 4
                      usersCount: 1
                      u:
                        _id: CkCPNcvsvCDfmWLqC
                        username: kim.jane
                        name: kim.jane
                      ro: false
                      default: false
                      customFields:
                        department: engineering
                        priority: high
                    count: 1
                    offset: 0
                    total: 1
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/rooms.cleanHistory:
    post:
      tags:
      - Rooms
      summary: Clear Room History
      description: "Cleans up a room by removing messages from the provided time range. For details, see the <a href='https://docs.rocket.chat/docs/room-actions#prune-messages-from-a-room' target='_blank'>Prune messages from a room</a> section.\n\nPermission required: `clean-channel-history`\n\n### Changelog\n| Version | Description            |\n| ------- | ---------------------- |\n| 0.64.0  | Added                  |\n| 0.67.0  | Added fields `limit`, `excludePinned`, `filesOnly` and `users` |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.cleanHistory \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"roomId\",\n  \"latest\": \"2016-12-09T13:42:25.304Z\",\n  \"oldest\": \"2016-08-30T13:42:25.304Z\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: get-api-v1-rooms.cleanHistory
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The room ID.
                latest:
                  type: string
                  description: The end of time range of messages.
                oldest:
                  type: string
                  description: The start of the time range of messages.
                inclusive:
                  type: boolean
                  description: Whether messages which land on the latest and oldest dates should be included. By default, the value is false.
                excludePinned:
                  type: boolean
                  description: Whether pinned messages should be deleted. By default, the value is false.
                filesOnly:
                  type: boolean
                  description: Whether to only delete files and keep messages intact. By default, the value is false.
                users:
                  type: array
                  items:
                    type: string
                  description: Specific set of users whose content to delete. By default, the value is [], that is, everyone.
                limit:
                  type: integer
                  description: The amount of messages to prune. By default, the value is 0 (all).
                ignoreDiscussion:
                  type: boolean
                  description: Determines if messages from discussions should be pruned. By default, the value is true.
                ignoreThreads:
                  type: boolean
                  description: Determines if messages from threads should be pruned. By default, the value is true.
              required:
              - roomId
              - latest
              - oldest
            examples:
              Example:
                value:
                  roomId: roomId
                  latest: '2016-12-09T13:42:25.304Z'
                  oldest: '2016-08-30T13:42:25.304Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/rooms.info:
    get:
      tags:
      - Rooms
      summary: Get Room Information
      description: "Retrieves the information about the room.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n|0.72.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/rooms.info?roomId=dlpfuijw7ej&roomName=general&fields=example' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"room\": {\n    \"_id\": \"66ed2dba40141d95f32c292b\",\n    \"fname\": \"new-channel\",\n    \"_updatedAt\": \"2024-09-20T12:29:08.284Z\",\n    \"customFields\": {},\n    \"topic\": \"\",\n    \"broadcast\": false,\n    \"encrypted\": false,\n    \"name\": \"new-channel\",\n    \"t\": \"p\",\n    \"msgs\": 3,\n    \"usersCount\": 2,\n    \"u\": {\n      \"_id\": \"C38WSSzrGd2NCjzqJ\",\n      \"username\": \"test.cat\",\n      \"name\": \"test.cat\"\n    },\n    \"ts\": \"2024-09-20T08:09:30.417Z\",\n    \"ro\": false,\n    \"teamId\": \"66c82d78237405fc05fc1ef1\",\n    \"default\": false,\n    \"sysMes\": true,\n    \"lastMessage\": {\n      \"_id\": \"xZhJfE4rmaosjHZCe\",\n      \"rid\": \"66ed2dba40141d95f32c292b\",\n      \"msg\": \"testing\",\n      \"alias\": null,\n      \"ts\": \"2024-09-20T12:27:53.356Z\",\n      \"u\": {\n        \"_id\": \"C38WSSzrGd2NCjzqJ\",\n        \"username\": \"test.cat\",\n        \"name\": \"test.cat\"\n      },\n      \"_updatedAt\": \"2024-09-20T12:27:53.397Z\",\n      \"urls\": [],\n      \"mentions\": [],\n      \"channels\": [],\n      \"md\": [\n        {\n          \"type\": \"PARAGRAPH\",\n          \"value\": [\n            {\n              \"type\": \"PLAIN_TEXT\",\n              \"value\": \"testing\"\n            }\n          ]\n        }\n      ]\n    },\n    \"lm\": \"2024-09-20T12:27:53.356Z\"\n  },\n  \"team\": {\n    \"_id\": \"66c82d78237405fc05fc1ef1\",\n    \"name\": \"test-team\",\n    \"type\": 0,\n    \"roomId\": \"66c82d78237405fc05fc1eef\"\n  },\n  \"parent\": {\n    \"_id\": \"66c82d78237405fc05fc1eef\",\n    \"fname\": \"test-team\",\n    \"name\": \"test-team\",\n    \"t\": \"c\"\n  },\n  \"success\": true\n}\n```"
      operationId: get-api-v1-rooms.info
      parameters:
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: roomId
        in: query
        description: The room ID. It is required if the `roomName` is not provided.
        schema:
          type: string
        example: dlpfuijw7ej
      - name: roomName
        in: query
        description: The room name.  It is required if the `roomId` is not provided.
        required: false
        schema:
          type: string
        example: general
      - name: fields
        in: query
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: `fields={ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 'OK


            The response includes the following objects:

            * `parent`: Represents the parent of a room. For discussions, this is the room where the discussion was created, identified by `prid`. For rooms inside a team, the parent will be the team''s main room, identified by `team.roomId`. For other rooms, this property is undefined.

            * `team`: Represents the team a room is part of. For rooms inside a team, this is the team identified by the `teamId` property. For everything else, this is undefined.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    properties:
                      _id:
                        type: string
                      ts:
                        type: string
                      t:
                        type: string
                      name:
                        type: string
                      usernames:
                        type: array
                        items:
                          type: object
                          properties: {}
                      msgs:
                        type: integer
                      usersCount:
                        type: integer
                      _updatedAt:
                        type: string
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                          name:
                            type: string
                      default:
                        type: boolean
                      lastMessage:
                        type: object
                        properties:
                          _id:
                            type: string
                          t:
                            type: string
                          rid:
                            type: string
                          ts:
                            type: string
                          msg:
                            type: string
                          alias:
                            type: string
                            nullable: true
                          attachments:
                            type: array
                            items:
                              type: object
                          file:
                            type: object
                            properties:
                              _id:
                                type: string
                              name:
                                type: string
                              type:
                                type: string
                          u:
                            type: object
                            properties:
                              _id:
                                type: string
                              username:
                                type: string
                              name:
                                type: string
                          groupable:
                            type: boolean
                          drid:
                            type: string
                          _updatedAt:
                            type: string
                      lm:
                        type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    room:
                      _id: 66ed2dba40141d95f32c292b
                      fname: new-channel
                      _updatedAt: '2024-09-20T12:29:08.284Z'
                      customFields: {}
                      topic: ''
                      broadcast: false
                      encrypted: false
                      name: new-channel
                      t: p
                      msgs: 3
                      usersCount: 2
                      u:
                        _id: C38WSSzrGd2NCjzqJ
                        username: test.cat
                        name: test.cat
                      ts: '2024-09-20T08:09:30.417Z'
                      ro: false
                      teamId: 66c82d78237405fc05fc1ef1
                      default: false
                      sysMes: true
                      lastMessage:
                        _id: xZhJfE4rmaosjHZCe
                        rid: 66ed2dba40141d95f32c292b
                        msg: testing
                        alias: null
                        ts: '2024-09-20T12:27:53.356Z'
                        u:
                          _id: C38WSSzrGd2NCjzqJ
                          username: test.cat
                          name: test.cat
                        _updatedAt: '2024-09-20T12:27:53.397Z'
                        urls: []
                        mentions: []
                        channels: []
                        md:
                        - type: PARAGRAPH
                          value:
                          - type: PLAIN_TEXT
                            value: testing
                      lm: '2024-09-20T12:27:53.356Z'
                    team:
                      _id: 66c82d78237405fc05fc1ef1
                      name: test-team
                      type: 0
                      roomId: 66c82d78237405fc05fc1eef
                    parent:
                      _id: 66c82d78237405fc05fc1eef
                      fname: test-team
                      name: test-team
                      t: c
                    success: true
        '400':
