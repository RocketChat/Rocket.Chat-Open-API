  /api/v1/groups.counters:
    get:
      tags:
      - Groups
      summary: Get Group Counters
      description: "Get the private channel information for the authenticated user. \n\nPermission required: `view-room-administration`\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 0.65.0  | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/groups.counters?roomId=dlpfuijw7ej&roomName=general&userId=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"joined\": true,\n  \"members\": 1,\n  \"unreads\": 1,\n  \"unreadsFrom\": \"2018-02-18T21:51:20.091Z\",\n  \"msgs\": 1,\n  \"latest\": \"2018-02-23T17:20:17.345Z\",\n  \"userMentions\": 0,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-groups.counters
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: roomId
        in: query
        description: The room ID. It is required if the `roomName` is not provided.
        schema:
          type: string
        example: dlpfuijw7ej
      - name: roomName
        in: query
        description: The room name.  It is required if the `roomId` is not provided.
        required: false
        schema:
          type: string
        example: general
      - name: userId
        in: query
        description: Counters for provided user ID (you need to have the `view-room-administration` permission for calling user). This parameter is optional
        schema:
          type: string
      responses:
        '200':
          description: 'OK


            **Note** The response returns the following information:

            - joined - Boolean flag that shows the particular user has joined the room or not.

            - members - Count of current room members.

            - unreads - Count of unread messages for specified user (calling user or for the provided `userId`).

            - unreadsFrom - Start date-time of unread interval for specified user.

            - msgs - Count of messages in the room.

            - latest - End date-time of unread interval for specified user (or date-time of last posted message).

            - userMentions - Count of user mentions in messages.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined:
                    type: boolean
                  members:
                    type: integer
                  unreads:
                    type: integer
                  unreadsFrom:
                    type: string
                  msgs:
                    type: integer
                  latest:
                    type: string
                  userMentions:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    joined: true
                    members: 1
                    unreads: 1
                    unreadsFrom: '2018-02-18T21:51:20.091Z'
                    msgs: 1
                    latest: '2018-02-23T17:20:17.345Z'
                    userMentions: 0
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: The required "roomId" or "roomName" param provided does not match any group [error-room-not-found]
                    errorType: error-room-not-found
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/groups.create:
    post:
      tags:
      - Groups
      summary: Create Group
      description: "Create a new private channel, optionally including specified users. Refer to the <a href='https://docs.rocket.chat/docs/channels' target='_blank'>Channels</a> documents for information on the available room options.\n\nThe following permissions are required:\n* `create-p`: This permission is required to create a private channel.\n* `create-team-group`: This permission is required if you want to create a private channel from an existing team.\n\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 6.4.1   | Added `excludeSelf` param |\n| 0.35.0  | Added                     |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/groups.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"name\": \"groupname\",\n  \"members\": [\n    \"rocket.cat\"\n  ],\n  \"readOnly\": true,\n  \"excludeSelf\": true,\n  \"customFields\": {\n    \"type\": \"default\"\n  },\n  \"extraData\": {\n    \"broadcast\": true,\n    \"encrypted\": false,\n    \"teamId\": \"658441562dd9f928ad9951aa\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"group\": {\n    \"_id\": \"NtR6RQ7NvzA9ejecX\",\n    \"name\": \"testing\",\n    \"t\": \"p\",\n    \"msgs\": 0,\n    \"u\": {\n      \"_id\": \"aobEdbYhXfu5hkeqG\",\n      \"username\": \"tester\"\n    },\n    \"ts\": \"2016-12-09T16:53:06.761Z\",\n    \"ro\": false,\n    \"sysMes\": true,\n    \"_updatedAt\": \"2016-12-09T16:53:06.761Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-groups.create
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the new private group.
                  example: groupname
                readOnly:
                  type: boolean
                  description: Set if the private channel is read-only or not. The default value is false.
                  example: false
                members:
                  type: array
                  description: The users to add to the private channel when it is created.
                  items:
                    type: string
                    example: rocket.cat
                excludeSelf:
                  type: boolean
                  description: If set to true, the user calling the endpoint is not added as a member of the private channel. The default value is false.
                  example: false
                customFields:
                  type: object
                  description: 'You add custom fields for private rooms using this parameter. Enter the key and value that you want to associate with this room. For example, `{ "company": "sell-and-more" }`. The custom fields are not displayed in the workspace UI.'
                extraData:
                  type: object
                  description: 'Enter the following details for the object:


                    Note: For more information, see <a href="https://docs.rocket.chat/docs/channels" target="_blank">Channels</a>.'
                  properties:
                    broadcast:
                      type: boolean
                      description: Whether the group should be a broadcast group. False by default.
                    encrypted:
                      type: boolean
                      description: Whether the group should be encrypted. False by default.
                    teamId:
                      type: string
                      description: Enter the team ID for which you want to create a group. You will get an error if the team does not exist.
              required:
              - name
            examples:
              Example:
                value:
                  name: groupname
                  members:
                  - rocket.cat
                  readOnly: true
                  excludeSelf: true
                  customFields:
                    type: default
                  extraData:
                    broadcast: true
                    encrypted: false
                    teamId: 658441562dd9f928ad9951aa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      t:
                        type: string
                      msgs:
                        type: integer
                      u:
                        type: object
                        properties:
                          _id:
                            type: string
                          username:
                            type: string
                      ts:
                        type: string
                      ro:
                        type: boolean
                      sysMes:
                        type: boolean
                      _updatedAt:
                        type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    group:
                      _id: NtR6RQ7NvzA9ejecX
                      name: testing
                      t: p
                      msgs: 0
                      u:
                        _id: aobEdbYhXfu5hkeqG
                        username: tester
                      ts: '2016-12-09T16:53:06.761Z'
                      ro: false
                      sysMes: true
                      _updatedAt: '2016-12-09T16:53:06.761Z'
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: Body param "name" is required
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
