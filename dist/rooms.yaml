                        username:
                          type: string
                        status:
                          type: string
                        _updatedAt:
                          type: string
                        name:
                          type: string
                        nickname:
                          type: string
                        avatarETag:
                          type: string
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    members:
                    - _id: rbAXPnMktTFbNpwtJ
                      username: roxie
                      status: offline
                      _updatedAt: '2023-09-24T22:27:33.610Z'
                      name: test test
                      nickname: baby girl
                    - _id: 5fRTXMt7DMJbpPJfh
