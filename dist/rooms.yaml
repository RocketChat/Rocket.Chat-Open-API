      description: "Lists all online users of a particular group (private channel). You will not be able to view the users if you are not a member of this private channel, unless you have admin permissions.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 0.52.0  | Added       |\n|7.0.0   | Replaced `query` parameter with `_id` parameter       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/groups.online?_id=5HmCfpoB7jp2uibTC' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"online\": [\n    {\n      \"_id\": \"47cRd58HnWwpqxhaZ\",\n      \"username\": \"test\"\n    },\n    {\n      \"_id\": \"BsxzC22xQ43taWdff\",\n      \"username\": \"uniqueusername\"\n    }\n  ],\n  \"success\": true\n}\n```"
      operationId: get-api-v1-groups.online
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: _id
        in: query
        description: 'Enter the group''s ID. You can find list of groups IDs using any of the following endpoints:

          * <a href=''https://developer.rocket.chat/apidocs/get-list-of-user-groups'' target=''_blank''>Get List of User Groups</a>: This endpoint returns all private channels in the workspace, if you have the required permissions to view them.

          * <a href=''https://developer.rocket.chat/apidocs/get-groups'' target=''_blank''>Get Groups</a>: This endpoint returns the private channels that you are a member of.'
        required: true
        schema:
          type: string
          example: 5HmCfpoB7jp2uibTC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  online:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        username:
                          type: string
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    online:
                    - _id: 47cRd58HnWwpqxhaZ
                      username: test
                    - _id: BsxzC22xQ43taWdff
                      username: uniqueusername
