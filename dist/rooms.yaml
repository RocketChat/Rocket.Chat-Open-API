  /api/v1/rooms.createDiscussion:
    post:
      tags:
      - Rooms
      summary: Create Discussion
      description: "Creates a new discussion for the room. It requires at least one of the following permissions: `start-discussion` OR `start-discussion-other-user`, AND must be with the following setting enabled: `Discussion_enabled`.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 1.0.0   | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.createDiscussion \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"prid\": \"GENERAL\",\n  \"t_name\": \"Discussion Name\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"discussion\": {\n    \"rid\": \"cgk88DHLHexwMaFWh\",\n    \"name\": \"WJNEAM7W45wRYitHo\",\n    \"fname\": \"Discussion Name\",\n    \"t\": \"p\",\n    \"msgs\": 0,\n    \"usersCount\": 0,\n    \"u\": {\n      \"_id\": \"rocketchat.internal.admin.test\",\n      \"username\": \"rocketchat.internal.admin.test\"\n    },\n    \"topic\": \"general\",\n    \"prid\": \"GENERAL\",\n    \"ts\": \"2019-04-03T01:35:32.271Z\",\n    \"ro\": false,\n    \"sysMes\": true,\n    \"default\": false,\n    \"_updatedAt\": \"2019-04-03T01:35:32.280Z\",\n    \"_id\": \"cgk88DHLHexwMaFWh\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-rooms.createDiscussion
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prid:
                  type: string
                  description: Parent room ID of the discussion.
                t_name:
                  type: string
                  description: Discussion name.
                users:
                  type: array
                  items:
