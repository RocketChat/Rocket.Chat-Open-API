  /api/v1/useInviteToken:
    post:
      tags:
      - Room Invites
      summary: Use Invite Token
      description: "Uses an invite token to join a channel or room.\n\nThis endpoint also checks whether the user is banned from the target room before\nallowing them to use the invite link. A banned user must be unbanned first\nbefore they can join via an invite token.\n\n### Changelog\n| Version | Change |\n|---------|--------|\n| 8.4.0   | Added ban check — banned users can no longer join via invite token |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/useInviteToken \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"token\": \"R4VDXJ9KJZB8M2QW\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"room\": {\n    \"_id\": \"sN9KJZX2aX7aXqB2a\",\n    \"name\": \"general\",\n    \"topic\": \"General discussion\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-useInviteToken
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The invite token to use.
              required:
              - token
            examples:
              Use Invite Token:
                value:
                  token: R4VDXJ9KJZB8M2QW
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    description: The room information.
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      topic:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    room:
                      _id: sN9KJZX2aX7aXqB2a
                      name: general
                      topic: General discussion
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
