  /api/v1/channels.archive:
    post:
      tags:
      - Channels
      summary: Archive Channel
      description: "Archive a channel. Permission required: `archive-room`\n### Changelog\n| Version | Description               |\n| ------- | ------------------------- |\n| 0.48.0  | Added                    |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/channels.archive \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"roomId\": \"ByehQjC44FwMeiLbX\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-channels.archive
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  description: The channel ID that you want to archive.
              required:
              - roomId
            examples:
              Example:
                value:
                  roomId: ByehQjC44FwMeiLbX
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Channel is already archived:
                  value:
                    success: false
                    error: The channel, add-room-websocket, is archived [error-room-archived]
                    errorType: error-room-archived
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/channels.close:
