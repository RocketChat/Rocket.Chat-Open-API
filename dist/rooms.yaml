  /api/v1/channels.members:
    get:
      tags:
      - Channels
      summary: Get Members of a Channel
      description: "Lists all channel users. The list of elements a user can use to sort the list is limited. The current sortable element is: `username`.\n\nIf the channel is a broadcast channel, you need the `view-broadcast-member-list` permission.\n\n### Changelog\n| Version | Description                                  |\n| ------- | -------------------------------------------- |\n| 0.59.0  | Added                                        |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/channels.members?roomId=dlpfuijw7ej&roomName=general&status=['online', 'away']&filter=my-nickname&count=50&offset=50' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"members\": [\n    {\n      \"_id\": \"rbAXPnMktTFbNpwtJ\",\n      \"username\": \"roxie\",\n      \"status\": \"offline\",\n      \"_updatedAt\": \"2023-09-24T22:27:33.610Z\",\n      \"name\": \"test test\",\n      \"nickname\": \"baby girl\"\n    },\n    {\n      \"_id\": \"5fRTXMt7DMJbpPJfh\",\n      \"username\": \"test.test\",\n      \"status\": \"offline\",\n      \"_updatedAt\": \"2023-09-16T08:33:38.123Z\",\n      \"name\": \"Testtest\",\n      \"avatarETag\": \"GFoEi6wv3uAxnzDcD\",\n      \"nickname\": \"test.test\"\n    }\n  ],\n  \"count\": 2,\n  \"offset\": 0,\n  \"total\": 2,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-channels.members
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: roomId
        in: query
        description: The room ID. It is required if the `roomName` is not provided.
        schema:
          type: string
        example: dlpfuijw7ej
      - name: roomName
        in: query
        description: The room name.  It is required if the `roomId` is not provided.
        required: false
        schema:
          type: string
        example: general
      - name: status
        in: query
        description: The user's status (search filter).
        schema:
          type: array
          items:
            type: string
          example: '[''online'', ''away'']'
      - name: filter
        in: query
        description: Extra search filters to be applied to the fields defined in the `Accounts_SearchFields`setting.
        schema:
          type: string
          example: my-nickname
      - name: sort
        in: query
        description: 'List of fields to order by, and in which direction. This is a JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, {"value": -1, "_id": 1}. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
        required: false
        schema: {}
      - name: count
        in: query
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      - name: offset
        in: query
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
        required: false
        schema:
          type: integer
        example: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
