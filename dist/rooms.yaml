      operationId: post-api-v1-rooms.media
      description: "To upload media files to a room, follow these steps:\n 1. Call this endpoint first. This endpoint uploads the file to the database and returns a file object with the file ID and URL data. Save the file ID, we will need this to send the file in the next step.\n 2. To send the file to a room, use the <a href='https://developer.rocket.chat/apidocs/check-uploaded-file' target='_blank'>Confirm Uploaded File</a> endpoint.\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/rooms.media/{rid} \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"file\": \"example\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"file\": {\n    \"_id\": \"67109d6c25682c7469486008\",\n    \"url\": \"/file-upload/67109d6c25682c7469486008/Screenshot%202024-10-15%20at%2010.17.39.png\"\n  },\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
    parameters:
    - schema:
        type: string
        example: 674eca3e43725ce31dd9a2e8
      name: rid
      in: path
      required: true
      description: The room ID.
