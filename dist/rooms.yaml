              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                x-examples:
                  Example 1:
                    success: false
                    error: error-not-authorized
              examples:
                Missing required ABAC permissions:
                  value:
                    success: false
                    error: error-not-authorized
      operationId: get-abac-audit
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Defense.svg\" alt=\"Defense\" style=\"display: block; margin: auto\"></div>\n\n- Lists ABAC audit events.\n- Returns a paginated audit log of ABAC-related actions (attribute changes, room attribute changes/removals, and ABAC actions), filterable by time range (`start`, `end`) and optional `actor`, with optional sorting.\n- Requires the ABAC and Auditing licenses, the `abac-management` and `view-abac-admin-audit` permissions.\n\n### Changelog\n| Version | Description |\n| ------- | ----------- |\n| 8.0.0   | Added |\n| 8.5.0   | Added the `view-abac-admin-audit` granular permission requirement. |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/abac/audit?start=example&end=example&actor=example&offset=1&count=1&sort=example' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true,\n  \"events\": [\n    {\n      \"_id\": \"EVENT_ID\",\n      \"t\": \"abac.object.attribute.changed\",\n      \"ts\": \"2026-01-30T12:34:56.789Z\",\n      \"actor\": {\n        \"_id\": \"USER_ID\",\n        \"username\": \"admin\",\n        \"name\": \"Admin\"\n      },\n      \"data\": {}\n    }\n  ],\n  \"offset\": 0,\n  \"count\": 25,\n  \"total\": 1\n}\n```"
      parameters:
      - schema:
          type: string
        in: query
        name: start
        description: start of time range (defaults to epoch if omitted)
      - schema:
          type: string
        in: query
        name: end
        description: end of time range (defaults to now if omitted)
      - schema:
          type: string
        in: query
        description: Filter by actor fields
        name: actor
      - schema:
          type: number
        in: query
        name: offset
        description: Pagination offset (default 0)
      - schema:
          type: number
        in: query
        name: count
        description: Page size (default 25)
      - schema:
          type: string
        in: query
        name: sort
        description: 'Sorting, typically { "ts": -1 } or { "ts": 1 }'
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
    parameters: []
  /api/v1/abac/pdp/health:
    get:
      tags:
      - ABAC
      summary: Get PDP Health Status
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/Defense.svg\" alt=\"Defense\" style=\"display: block; margin: auto\"></div>\n\nChecks the health and availability of the configured Policy Decision Point (PDP)\nfor Attribute-Based Access Control (ABAC).\n\nThis endpoint is used by administrators to verify that the external PDP service\nis operational and properly configured. It includes rate limiting to prevent abuse.\n\nPermissions required: `abac-management` and `manage-abac-admin-settings`.\n\n### Changelog\n| Version | Change |\n|---------|--------|\n| 8.0.0   | Added |\n| 8.5.0   | Added the `manage-abac-admin-settings` granular permission requirement. |\n| 8.4.0   | Added endpoint to check external PDP health status |\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/abac/pdp/health \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"available\": true,\n  \"message\": \"ABAC_PDP_Health_OK\",\n  \"success\": true\n}\n```"
      operationId: get-abac-pdp-health
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      responses:
        '200':
          description: OK - PDP is available and healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Indicates whether the PDP is available.
                    enum:
                    - true
                  message:
                    type: string
                    description: Health check message.
                  success:
                    type: boolean
                    description: Indicates if the request was successful.
              examples:
                PDP Healthy:
                  value:
                    available: true
                    message: ABAC_PDP_Health_OK
                    success: true
        '400':
          description: Bad Request - PDP is unavailable or unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Indicates whether the PDP is available.
                    enum:
                    - false
                  message:
                    type: string
                    description: Error message describing why the PDP is unavailable.
                  success:
                    type: boolean
                    description: Indicates if the request was successful.
              examples:
                PDP Unavailable:
                  value:
                    available: false
                    message: ABAC_PDP_Health_Not_OK
                    success: false
                Connection Error:
                  value:
                    available: false
                    message: Failed to connect to external PDP service
                    success: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: You do not have permission to manage ABAC
  /api/v1/subscriptions.get:
    get:
      summary: Get All Subscriptions
      description: "Get the room notification subscription details and the latest updates. Note that the unread counter value depends on your settings in the **Manage** > **Workspace** > <a href='https://docs.rocket.chat/docs/general' target='_blank'>**General**</a> section.\n\n### Changelog\n| Version      | Description | \n| ---------------- | ------------|\n|0.60.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/subscriptions.get?updatedSince=2017-11-25T15:08:17.248Z' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"update\": [\n    {\n      \"t\": \"c\",\n      \"ts\": \"2017-11-25T15:08:17.249Z\",\n      \"name\": \"general\",\n      \"fname\": null,\n      \"rid\": \"GENERAL\",\n      \"u\": {\n        \"_id\": \"EoyAmF4mxx5HxJHJB\",\n        \"username\": \"rocket.cat\",\n        \"name\": \"Rocket Cat\"\n      },\n      \"open\": true,\n      \"alert\": true,\n      \"unread\": 1,\n      \"userMentions\": 1,\n      \"groupMentions\": 0,\n      \"_updatedAt\": \"2017-11-25T15:08:17.249Z\",\n      \"_id\": \"5ALsG3QhpJfdMpyc8\"\n    }\n  ],\n  \"remove\": [],\n  \"success\": true\n}\n```"
      operationId: get-api-v1-subscriptions.get
      parameters:
      - name: X-Auth-Token
        in: header
        description: The `authToken` of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The `userId` of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - schema:
          type: string
          example: '2017-11-25T15:08:17.248Z'
        in: query
        name: updatedSince
        description: 'Date and time from which to fetch changes. Format: ISO 8601 datetime. Optional seconds, optional milliseconds, optional timezone, always with colon time separators.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        open:
                          type: boolean
                        alert:
                          type: boolean
                        unread:
                          type: integer
                        userMentions:
                          type: integer
                        groupMentions:
                          type: integer
                        ts:
                          type: string
                        rid:
                          type: string
                        name:
                          type: string
                        fname:
                          type: string
                          nullable: true
                        t:
                          type: string
                        u:
                          type: object
                          properties:
                            _id:
                              type: string
                            username:
                              type: string
                            name:
                              type: string
                        _updatedAt:
                          type: string
                        ls:
                          type: string
                        E2EKey:
                          type: string
                  remove:
                    type: array
                    items:
                      type: object
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    update:
                    - t: c
                      ts: '2017-11-25T15:08:17.249Z'
                      name: general
                      fname: null
                      rid: GENERAL
                      u:
                        _id: EoyAmF4mxx5HxJHJB
                        username: rocket.cat
                        name: Rocket Cat
                      open: true
                      alert: true
                      unread: 1
                      userMentions: 1
                      groupMentions: 0
                      _updatedAt: '2017-11-25T15:08:17.249Z'
                      _id: 5ALsG3QhpJfdMpyc8
                    remove: []
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      tags:
      - Subscriptions
