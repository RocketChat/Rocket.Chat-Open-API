                              type: boolean
                      type:
                        type: string
                      status:
                        type: string
                      active:
                        type: boolean
                      roles:
                        type: array
                        items:
                          type: string
                      name:
                        type: string
                      requirePasswordChange:
                        type: boolean
                      lastLogin:
                        type: string
                      statusConnection:
                        type: string
                      utcOffset:
                        type: integer
                      freeSwitchExtension:
                        type: string
                      canViewAllInfo:
                        type: boolean
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    user:
                      _id: 5fRTXMt7DMJbpPJfh
                      createdAt: '2023-07-10T16:44:58.548Z'
                      services:
                        password: true
                        email2fa:
                          enabled: true
                          changedAt: '2023-07-10T16:44:58.546Z'
                        resume:
                          loginTokens:
                          - when: '2023-10-05T18:55:02.996Z'
                            hashedToken: '...'
                          - when: '2023-10-05T19:09:30.415Z'
                            hashedToken: '....'
                          - when: '2023-10-10T23:40:46.098Z'
                            hashedToken: '....'
                      username: test.john
                      emails:
                      - address: test.john@test.com
                        verified: true
