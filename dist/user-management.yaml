openapi: 3.0.0
info:
  version: 1.0.0
  title: User Management
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/permissions.listAll:
    get:
      tags:
      - Permissions
      summary: List All Permissions
      description: "Returns the list of <a href='https://docs.rocket.chat/docs/permissions' target='_blank'>permissions</a> from the workspace.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.73.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/permissions.listAll?updatedSince=2017-11-25T15:08:17.248Z' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"update\": [\n    {\n      \"_id\": \"access-permissions\",\n      \"_updatedAt\": \"2018-11-28T11:55:49.106Z\",\n      \"roles\": [\n        \"admin\"\n      ]\n    },\n    {\n      \"_id\": \"add-oauth-service\",\n      \"_updatedAt\": \"2018-11-28T12:59:51.974Z\",\n      \"roles\": [\n        \"admin\",\n        \"user\"\n      ]\n    }\n  ],\n  \"remove\": [],\n  \"success\": true\n}\n```"
      operationId: get-permissions.listAll
      parameters:
      - name: updatedSince
        in: query
        description: 'Date as ISO string. If you include this parameter, the `update` and

          `remove` fields in the response will contain only those permissions

          updated and removed since this date and time.'
        schema:
          type: string
        example: '2017-11-25T15:08:17.248Z'
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        _updatedAt:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                  remove:
                    type: array
                    items:
                      type: object
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    update:
                    - _id: access-permissions
                      _updatedAt: '2018-11-28T11:55:49.106Z'
                      roles:
                      - admin
                    - _id: add-oauth-service
                      _updatedAt: '2018-11-28T12:59:51.974Z'
                      roles:
                      - admin
                      - user
                    remove: []
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/permissions.update:
    post:
      summary: Update Permissions
      description: "Update the <a href='https://docs.rocket.chat/docs/permissions' target='_blank'>permissions</a> on the workspace.\nPermission required: `access-permissions`\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.66.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/permissions.update \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"permissions\": [\n    {\n      \"_id\": \"access-permissions\",\n      \"roles\": [\n        \"admin\"\n      ]\n    }\n  ]\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"permissions\": [\n    {\n      \"_id\": \"access-permissions\",\n      \"roles\": [\n        \"admin\"\n      ]\n    }\n  ],\n  \"success\": true\n}\n```"
      operationId: post-api-v1-permissions.update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  description: The array of roles to overwrite.
                  items:
                    type: object
                    properties:
                      _id:
                        type: string
                        description: Enter the permission ID.
                        example: access-permissions
                      roles:
                        type: array
                        items:
                          type: string
                          description: For default Rocket.Chat roles, you can enter the role names such as `admin`, `user`, `owner`, etc. If you are updating the permissions for a custom role, enter the custom role ID instead of the role name. Use the <a href='https://developer.rocket.chat/apidocs/get-roles' target='_blank'>Get Roles</a> endpoint to get the list of roles with IDs in your workspace.
                          example: admin
              required:
              - permissions
            examples:
              Example 1:
                value:
                  permissions:
                  - _id: access-permissions
                    roles:
                    - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    permissions:
                    - _id: access-permissions
                      roles:
                      - admin
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: Invalid body params
                    errorType: error-invalid-body-params
                Example 2:
                  value:
                    success: false
                    error: Editing permissions is not allowed
                    errorType: error-edit-permissions-not-allowed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      tags:
      - Permissions
  /api/v1/permissions.addRole:
    post:
      tags:
      - Permissions
      summary: Add Permission to a Role
      description: "Grant a <a href='https://docs.rocket.chat/docs/permissions' target='_blank'>permission</a> to a role. \n\nPermission required: `access-permissions`. \n\nTo modify a setting-level permission, the `access-setting-permissions` permission is also required.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.7.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/permissions.addRole \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"permissionId\": \"create-team-channel\",\n  \"role\": \"user\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-permissions.addRole
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionId:
                  type: string
                  description: The permission ID.
                  example: create-team-channel
                role:
                  type: string
                  description: The role to grant the permission to. For default Rocket.Chat roles, enter the role name, such as `admin` or `user`. For custom roles, enter the role ID.
                  example: user
              required:
              - permissionId
              - role
            examples:
              Example:
                value:
                  permissionId: create-team-channel
                  role: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      action:
                        type: string
              examples:
                Invalid Parameters:
                  value:
                    success: false
                    error: must have required property 'role'
                    errorType: invalid-params
                Permission does not exist:
                  value:
                    success: false
                    error: Permission does not exist [error-invalid-permission]
                    errorType: error-invalid-permission
                    details:
                      method: authorization:addPermissionToRole
                      action: Adding_permission
                Invalid Role:
                  value:
                    success: false
                    error: Role does not exist [error-invalid-role]
                    errorType: error-invalid-role
                    details:
                      method: authorization:addPermissionToRole
                      action: Adding_permission
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
  /api/v1/permissions.removeRole:
    post:
      tags:
      - Permissions
      summary: Remove Role from Permission
      description: "Revoke a <a href='https://docs.rocket.chat/docs/permissions' target='_blank'>permission</a> from a role. \n\nPermission required: `access-permissions`. \n\nTo modify a setting-level permission, the `access-setting-permissions` permission is also required.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.7.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/permissions.removeRole \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"permissionId\": \"create-team-channel\",\n  \"role\": \"user\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: post-api-v1-permissions.removeRole
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissionId:
                  type: string
                  description: The permission ID.
                  example: create-team-channel
                role:
                  type: string
                  description: The role to revoke the permission from. For default Rocket.Chat roles, enter the role name, such as `admin` or `user`. For custom roles, enter the role ID.
                  example: user
              required:
              - permissionId
              - role
            examples:
              Example:
                value:
                  permissionId: create-team-channel
                  role: user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
              examples:
                Invalid Parameters:
                  value:
                    success: false
                    error: must have required property 'role'
                    errorType: invalid-params
                Permission not found:
                  value:
                    success: false
                    error: Permission not found [error-permission-not-found]
                    errorType: error-permission-not-found
                    details:
                      method: authorization:removeRoleFromPermission
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: User does not have the permissions required for this action [error-unauthorized]
  /api/v1/roles.create:
    post:
      tags:
      - Roles
      summary: Create Role
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/premium.svg\" alt=\"Premium tag\" style=\"display: block; margin: auto;\"></div>\n\nCreate a new <a href='https://docs.rocket.chat/docs/roles-in-rocketchat' target='_blank'>role</a> in the workspace. See <a href='https://docs.rocket.chat/v1/docs/custom-roles' target='_blank'>Custom Roles</a> for further information.\n\n* You can't create new roles with the same name as existing roles. For example, it is not possible to create a new role with the name `admin`.\n* The scope can either be `Users`(user level) or `Subscriptions`(room level).\n* Permission required: `access-permissions`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|6.0.0            | Moved to Enterprise plan.       |\n|3.15.0            | The endpoint is no longer used to update roles.       |\n|0.70.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/roles.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"name\": \"Test Role\",\n  \"scope\": \"Users\",\n  \"description\": \"Testing Role for API\",\n  \"mandatory2fa\": false\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"role\": {\n    \"_id\": \"646c431fa8c3a3ba32d0e1c4\",\n    \"name\": \"support1\",\n    \"scope\": \"Subscriptions\",\n    \"description\": \"Role support tier 1\",\n    \"protected\": false,\n    \"mandatory2fa\": false,\n    \"_updatedAt\": \"2023-05-23T04:37:51.161Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-roles.create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Enter the new role's name.
                  example: newRole
                scope:
                  type: string
                  description: The new role's scope. The scope can either be Users (user level) or Subscriptions (room level). The default value is `Users`.
                  example: Subscriptions
                description:
                  type: string
                  description: Enter a description for the new role.
                  example: Role description
                mandatory2fa:
                  type: boolean
                  description: Whether the role should have a mandatory 2FA. The default value is `false`. If set to true, users assigned to this role are prompted to enter a 2FA code for certain activities.
                  default: false
              required:
              - name
            examples:
              Example 1:
                value:
                  name: Test Role
                  scope: Users
                  description: Testing Role for API
                  mandatory2fa: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      scope:
                        type: string
                      description:
                        type: string
                      protected:
                        type: boolean
                      mandatory2fa:
                        type: boolean
                      _updatedAt:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    role:
                      _id: 646c431fa8c3a3ba32d0e1c4
                      name: support1
                      scope: Subscriptions
                      description: Role support tier 1
                      protected: false
                      mandatory2fa: false
                      _updatedAt: '2023-05-23T04:37:51.161Z'
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: The role properties are invalid. [error-invalid-role-properties]
                    errorType: error-invalid-role-properties
                Example 2:
                  value:
                    success: false
                    error: Role name already exists [error-duplicate-role-names-not-allowed]
                    errorType: error-duplicate-role-names-not-allowed
                Example 3:
                  value:
                    success: false
                    error: Accessing permissions is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
  /api/v1/roles.update:
    post:
      tags:
      - Roles
      summary: Update Role
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/premium.svg\" alt=\"Premium tag\" style=\"display: block; margin: auto;\"></div>\n\nUpdate a role in the workspace.\n\nPermission required: `access-permissions`\n        \n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|6.0.0            | Moved to Enterprise plan.       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/roles.update \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"roleId\": \"646c431fa8c3a3ba32d0e1c4\",\n  \"name\": \"Test Role\",\n  \"scope\": \"Users\",\n  \"description\": \"Testing Role for API\",\n  \"mandatory2fa\": false\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"role\": {\n    \"_id\": \"646c431fa8c3a3ba32d0e1c4\",\n    \"name\": \"update role\",\n    \"scope\": \"Users\",\n    \"description\": \"Update Role support tier 1\",\n    \"protected\": false,\n    \"mandatory2fa\": false,\n    \"_updatedAt\": \"2023-05-23T05:33:33.730Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-roles.update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId:
                  type: string
                  example: 646c431fa8c3a3ba32d0e1c4
                  description: The role ID that you want to update.
                name:
                  type: string
                  example: newRole
                  description: The updated name of the role.
                scope:
                  type: string
                  example: Subscriptions
                  description: The updated  scope of the role. The scope can either be Users (user level) or Subscriptions (room level). The default value is `Users`.
                description:
                  type: string
                  example: Role description
                  description: Updated description for the role.
                mandatory2fa:
                  type: boolean
                  default: false
                  description: Whether the role should have a mandatory 2FA. The default value is `false`. If set to true, users assigned to this role are prompted to enter a 2FA code for certain activities.
              required:
              - roleId
              - name
            examples:
              Example 1:
                value:
                  roleId: 646c431fa8c3a3ba32d0e1c4
                  name: Test Role
                  scope: Users
                  description: Testing Role for API
                  mandatory2fa: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: object
                    properties:
                      _id:
                        type: string
                      name:
                        type: string
                      scope:
                        type: string
                      description:
                        type: string
                      protected:
                        type: boolean
                      mandatory2fa:
                        type: boolean
                      _updatedAt:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    role:
                      _id: 646c431fa8c3a3ba32d0e1c4
                      name: update role
                      scope: Users
                      description: Update Role support tier 1
                      protected: false
                      mandatory2fa: false
                      _updatedAt: '2023-05-23T05:33:33.730Z'
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: The role properties are invalid. [error-invalid-role-properties]
                    errorType: error-invalid-role-properties
                Example 2:
                  value:
                    success: false
                    error: Accessing permissions is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
  /api/v1/roles.addUserToRole:
    post:
      tags:
      - Roles
      summary: Assign Role to User
      description: "Assign a role to a user. Optionally, you can set this role to a user for a specific room.\n\n**Permissions required**:\n- `access-permissions`: Required to modify permissions for various roles\n- `assign-admin-role`: Permission to assign the admin role to other users\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.70.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/roles.addUserToRole \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"roleId\": \"6579adcf2dd9f9d9514f6\",\n  \"username\": \"test.fun\",\n  \"roomId\": \"64adb09baa5ad4273bfc\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"role\": {\n    \"_id\": \"auditor-log\",\n    \"scope\": \"Users\",\n    \"description\": \"\",\n    \"mandatory2fa\": false,\n    \"name\": \"auditor-log\",\n    \"protected\": true,\n    \"_updatedAt\": \"2023-07-10T23:20:56.702Z\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-roles.addUserToRole
      requestBody:
        description: "By default, the three major room roles are available in Rocket.Chat are **Owner**, **Leader**, and **Moderator**. \n[Creating custom roles](https://docs.rocket.chat/use-rocket.chat/user-management/custom-roles) is exclusively available on the Enterprise plan. \nRefer to [Roles](https://docs.rocket.chat/setup-and-configure/roles-in-rocket.chat) for more information."
