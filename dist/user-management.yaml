      description: "Use this endpoint to get the list of roles other than `user`, such as admin, livechat, and custom roles.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|7.10.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET https://<your-workspace-url>/api/v1/roles.getUsersInPublicRoles \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"users\": [\n    {\n      \"_id\": \"kb2WBkjkut4YJpFQk\",\n      \"username\": \"agent2\",\n      \"roles\": [\n        \"livechat-agent\"\n      ]\n    },\n    {\n      \"_id\": \"Ahgf5k9Ca4YEdMjwX\",\n      \"username\": \"test.agent\",\n      \"roles\": [\n        \"admin\",\n        \"livechat-agent\"\n      ]\n    }\n  ],\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
  /api/v1/users.create:
    post:
      tags:
      - Users
      summary: Create User
      description: "Create a new user in your workspace. This endpoint is typically used by admins to create user accounts in the workspace.\n\nPermissions required:\n- `create-user`: Permission to create users\n- `edit-other-user-active-status`: Permission to enable or disable other accounts\n\n\n### Changelog\n| Version      | Description | \n| ---------------- | ------------|\n|0.48.0            | `role` property is now `roles` which is an array of strings for the roles to create the user with.       |\n|0.45.0            | Users created via this now join the default channels.       |\n|0.40.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.create \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"name\": \"Test User\",\n  \"email\": \"email@user.tld1\",\n  \"password\": \"anypassyouwant\",\n  \"username\": \"uniqueusername1\",\n  \"active\": true,\n  \"nickname\": \"testusername\",\n  \"bio\": \"All about the user\",\n  \"joinDefaultChannels\": true,\n  \"statusText\": \"On a vacation\",\n  \"requirePasswordChange\": false,\n  \"setRandomPassword\": false,\n  \"sendWelcomeEmail\": false,\n  \"verified\": false,\n  \"customFields\": {\n    \"clearance\": \"High\",\n    \"team\": \"Queen\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"BsNr28znDkG8aeo7W\",\n    \"createdAt\": \"2016-09-13T14:57:56.037Z\",\n    \"services\": {\n      \"password\": {\n        \"bcrypt\": \"$2a$i7BFS55uFYRf5TE4ErSUH8HymMNAbpMAvsOcl2C\"\n      }\n    },\n    \"username\": \"uniqueusername\",\n    \"emails\": [\n      {\n        \"address\": \"email@user.tld\",\n        \"verified\": false\n      }\n    ],\n    \"type\": \"user\",\n    \"status\": \"offline\",\n    \"active\": true,\n    \"roles\": [\n      \"user\"\n    ],\n    \"_updatedAt\": \"2016-09-13T14:57:56.175Z\",\n    \"name\": \"name\",\n    \"settings\": {}\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.create
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - username
              properties:
                name:
                  type: string
                  description: The display name of the user.
                  example: Test User
                email:
                  type: string
                  description: The email address for the user.
                  example: email@user.tld1
                password:
                  type: string
                  description: The password for the user.
                  example: anypassyouwant
                username:
                  type: string
                  description: The username for the user.
                  example: uniqueusername1
                active:
                  type: boolean
                  description: Set the users' active status.  If the user is deactivated, they can not login. By default, the user is active.
                  example: true
                  default: true
                nickname:
                  type: string
                  description: 'The nickname for the user. '
                  example: testusername
                bio:
                  type: string
                  description: The bio for the user.
                  example: All about the user
                joinDefaultChannels:
                  type: boolean
                  description: Select whether users should automatically join default channels once they are created. By default, it is set to `true`.
                  example: true
                  default: true
                statusText:
                  type: string
                  description: The status text of the user.
                  example: On a vacation
                roles:
                  type: array
                  description: "The roles to be assigned to this user. If it is not specified, the `user` role is assigned by default.\n**Note:**\n* For default roles, the role name and ID are the same. For custom roles, the name and ID are different. \n* If you are setting a custom role for a user, make sure to enter the custom role ID, and not the role name.\nRefer to [Roles](https://docs.rocket.chat/use-rocket.chat/workspace-administration/permissions#roles) for more information."
                  items:
                    type: string
                    example: bot
                requirePasswordChange:
                  type: boolean
                  description: Should the user be required to change their password when they login? It is set to `false` by default
                  example: false
                  default: false
                setRandomPassword:
                  type: boolean
                  description: Should the user be assigned a random password once they are created? It is set to `false` by defualt.
                  example: false
                  default: false
                sendWelcomeEmail:
                  type: boolean
                  description: Should the user get a welcome email? It is set to `true` by default.
                  example: false
                  default: false
                verified:
                  type: boolean
                  description: Should the user's email address be verified when created? It is set to `false` by default.
                  example: false
                  default: false
                customFields:
                  type: object
                  example:
                    clearance: High
                    team: Queen
                  description: 'A valid JSON object of key-value pairs consisting of additional fields to be

                    added during user registration. By default, the value is `undefined`.

                    To save custom fields, you must first define them in the [workspace admin settings](https://docs.rocket.chat/use-rocket.chat/workspace-administration/settings/accounts/custom-fields).

                    For information on how to view the custom fields, see the [Get Users List](https://developer.rocket.chat/reference/api/rest-api/endpoints/user-management/users-endpoints/get-users-list) endpoint.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      createdAt:
                        type: string
                      username:
                        type: string
                      emails:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            verified:
                              type: boolean
                      type:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
                      status:
                        type: string
                      active:
                        type: boolean
                      _updatedAt:
                        type: string
                      bio:
                        type: string
                      name:
                        type: string
                      nickname:
                        type: string
                      requirePasswordChange:
                        type: boolean
                      settings:
                        type: object
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    user:
                      _id: BsNr28znDkG8aeo7W
                      createdAt: '2016-09-13T14:57:56.037Z'
                      services:
                        password:
                          bcrypt: $2a$i7BFS55uFYRf5TE4ErSUH8HymMNAbpMAvsOcl2C
                      username: uniqueusername
                      emails:
                      - address: email@user.tld
                        verified: false
                      type: user
                      status: offline
                      active: true
                      roles:
                      - user
                      _updatedAt: '2016-09-13T14:57:56.175Z'
                      name: name
                      settings: {}
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      action:
                        type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: Adding user is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
                    details:
                      method: insertOrUpdateUser
                      action: Adding_user
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/users.register:
    post:
      tags:
      - Users
      summary: Register User
      description: "* An external member can use this endpoint to create an account on the workspace.\n* The number of requests you can make and the interval between each request depends on the workspace's rate limiter settings. You can find the settings from **Manage** > **Workspace** > **Settings** > **Rate Limiter** > **API Rate Limiter**.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.50.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.register \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"username\": \"rogersmith\",\n  \"email\": \"roger@example.com\",\n  \"pass\": \"passw0rd\",\n  \"name\": \"Roger Smith\",\n  \"secretURL\": \"Jjwjg6gouWLXhMGKW\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"nSYqWzZ4GsKTX4dyK\",\n    \"type\": \"user\",\n    \"status\": \"offline\",\n    \"active\": true,\n    \"name\": \"Example User\",\n    \"utcOffset\": 0,\n    \"username\": \"example\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The username for the user.
                  example: rogersmith
                email:
                  type: string
                  description: The email for the user.
                  example: roger@example.com
                pass:
                  type: string
                  description: The password for the user.
                  example: passw0rd
                name:
                  type: string
                  description: "The name of the user. \nThe value can be an empty string if `Require Name For Signup` is disabled in [account registration](https://docs.rocket.chat/use-rocket.chat/workspace-administration/settings/accounts#registration)."
                  example: Roger Smith
                secretURL:
                  type: string
                  description: You may have been provided with a secret URL. It includes a string appended to the registration URL. For example, `https://workspacedomain.com/register/my-secret-code`. For this parameter, enter the additional string at the end of the URL.
                  example: Jjwjg6gouWLXhMGKW
              required:
              - username
              - email
              - pass
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      type:
                        type: string
                      status:
                        type: string
                      active:
                        type: boolean
                      name:
                        type: string
                      utcOffset:
                        type: integer
                      username:
                        type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    user:
                      _id: nSYqWzZ4GsKTX4dyK
                      type: user
                      status: offline
                      active: true
                      name: Example User
                      utcOffset: 0
                      username: example
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'pass' [invalid-params]
                    errorType: invalid-params
    parameters: []
  /api/v1/users.update:
    post:
      tags:
      - Users
      summary: Update User Details
      description: "Use this endpoint to update the details of an existing user. This endpoint requires 2FA.\n\n**Permissions required**:\n- `edit-other-user-password`: Permission to modify other user's passwords\n- `edit-other-user-info_description`: Permission to change other user's name, username or email address\n- `edit-other-user-active-status`: Permission to enable or disable other accounts\n\n### Changelog\n| Version      | Description | \n| ---------------- | ------------|\n|7.0.0             | Removed upsert behaviour and stopped allowing `joinDefaultChannels` param|\n|0.48.0            | Renamed to `users.update`       |\n|0.35.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.update \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"x-2fa-code: your-2fa-code\" \\\n     -H \"x-2fa-method: totp\" \\\n     -d '{\n  \"userId\": \"PMGoujw82oETsaw9828rQh2oXM\",\n  \"data\": {\n    \"name\": \"Agent 2 Updated\",\n    \"email\": \"agent2@agent.com\",\n    \"password\": \"passw0rd\",\n    \"username\": \"example\",\n    \"active\": true,\n    \"roles\": [\n      \"example\"\n    ],\n    \"requirePasswordChange\": false,\n    \"sendWelcomeEmail\": false,\n    \"freeSwitchExtension\": \"example\",\n    \"verified\": true,\n    \"customFields\": {\n      \"clearance\": \"High\",\n      \"team\": \"Queen\"\n    }\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"PMGoujw82oETsaw9828rQh2oXM\",\n    \"createdAt\": \"2026-02-24T23:22:54.986Z\",\n    \"username\": \"agent2\",\n    \"emails\": [\n      {\n        \"address\": \"agent2@agent.com\",\n        \"verified\": false\n      }\n    ],\n    \"type\": \"user\",\n    \"roles\": [\n      \"user\",\n      \"livechat-agent\"\n    ],\n    \"status\": \"offline\",\n    \"active\": true,\n    \"inactiveReason\": null,\n    \"name\": \"Agent 2 Updated\",\n    \"_updatedAt\": \"2026-02-25T14:25:59.157Z\",\n    \"__rooms\": [\n      \"GENERAL\"\n    ],\n    \"requirePasswordChange\": false,\n    \"settings\": {},\n    \"statusText\": \"\",\n    \"livechatStatusSystemModified\": false,\n    \"statusLivechat\": \"not-available\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.update
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: x-2fa-code
        in: header
        required: true
        description: Enter the 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
        schema:
          type: string
        example: '148750'
      - name: x-2fa-method
        in: header
        required: true
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The user ID to update. This value must not be empty.
                  example: PMGoujw82oETsaw9828rQh2oXM
                data:
                  type: object
                  description: 'The object that includes the user information to update with the following parameters. Note: If you provide an empty object, the user details are returned.'
                  properties:
                    name:
                      type: string
                      description: The name of the user.
                      example: Agent 2 Updated
                    email:
                      type: string
                      example: agent2@agent.com
                      description: The email ID of the user.
                    password:
                      type: string
                      example: passw0rd
                      description: The password for the user.
                    username:
                      type: string
                      example: example
                      description: The username for the user.
                    active:
                      type: boolean
                      description: Whether the user is active, which determines if they can login or not.
                      default: true
                    roles:
                      type: array
                      description: The roles the user has been assigned.
                      items:
                        type: string
                    requirePasswordChange:
                      type: boolean
                      description: Whether the user should be required to change their password when they login.
                      default: false
                    sendWelcomeEmail:
                      type: boolean
                      default: false
                      description: Whether the user should get a welcome email.
                    freeSwitchExtension:
                      type: string
                      description: The voice call extension.
                    verified:
                      type: boolean
                      description: Whether the user's email address should be verified.
                      default: true
                    customFields:
                      type: object
                      example:
                        clearance: High
                        team: Queen
                      description: 'Any custom fields the user should have on their account.

                        To save custom fields, you must first define the custom fields in the admin panel (Manage > Workspace > Settings > Accounts > Registration > Custom Fields). For details on how to configure this field, see [Custom Fields](https://docs.rocket.chat/use-rocket.chat/workspace-administration/settings/accounts/custom-fields).

                        For information on how to view the custom fields, see the [Get Users List](https://developer.rocket.chat/reference/api/rest-api/endpoints/user-management/users-endpoints/get-users-list) endpoint.'
              required:
              - userId
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      _id:
                        type: string
                      createdAt:
                        type: string
                      username:
                        type: string
                      emails:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            verified:
                              type: boolean
                      type:
                        type: string
                      roles:
                        type: array
                        items:
                          type: string
                      status:
                        type: string
                      active:
                        type: boolean
                      inactiveReason:
                        type: string
                      name:
                        type: string
                      _updatedAt:
                        type: string
                      __rooms:
                        type: array
                        items:
                          type: string
                      requirePasswordChange:
                        type: boolean
                      settings:
                        type: object
                        properties: {}
                      statusText:
                        type: string
                      livechatStatusSystemModified:
                        type: boolean
                      statusLivechat:
                        type: string
                  success:
                    type: boolean
              examples:
                Example:
                  value:
                    user:
                      _id: PMGoujw82oETsaw9828rQh2oXM
                      createdAt: '2026-02-24T23:22:54.986Z'
                      username: agent2
                      emails:
                      - address: agent2@agent.com
                        verified: false
                      type: user
                      roles:
                      - user
                      - livechat-agent
                      status: offline
                      active: true
                      inactiveReason: null
                      name: Agent 2 Updated
                      _updatedAt: '2026-02-25T14:25:59.157Z'
                      __rooms:
                      - GENERAL
                      requirePasswordChange: false
                      settings: {}
                      statusText: ''
                      livechatStatusSystemModified: false
                      statusLivechat: not-available
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      action:
                        type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: Editing user is not allowed [error-action-not-allowed]
                    errorType: error-action-not-allowed
                    details:
                      method: insertOrUpdateUser
                      action: Editing_user
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/users.updateOwnBasicInfo:
    post:
      tags:
      - Users
      summary: Update Own Basic Information
      description: "Update your account information using this endpoint.\n* To change your email or password, you must confirm it using TOTP. If you don't have 2FA enabled in your account (token code or email), TOTP will require the current password method. Note that if 2FA is not enabled in the workspace, the 2FA headers are not required.\n* If you add the `currentPassword` encrypted in SHA256 to the request body, the request won't require TOTP again.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|6.4.0            | Add `bio` and `statusType` parameters.       |\n|0.62.2            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.updateOwnBasicInfo \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"data\": {\n    \"email\": \"example@example.com\",\n    \"newPassword\": \"passw0rd\",\n    \"currentPassword\": \"5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5\",\n    \"nickname\": \"cake\",\n    \"bio\": \"Engineer\",\n    \"username\": \"example\",\n    \"name\": \"Example User\",\n    \"statusType\": \"offline\",\n    \"statusText\": \"On a vacation\"\n  }\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"user\": {\n    \"_id\": \"rbAXPnMktTFbNpwtJ\",\n    \"createdAt\": \"2023-02-20T13:42:07.119Z\",\n    \"services\": {\n      \"password\": {\n        \"bcrypt\": \"$2b$10$E9ppW3T2itbMEcDvOdWBR.NXiW3YbifRHwBhjVkt26r1XS8yNhh6u\"\n      },\n      \"email2fa\": {\n        \"enabled\": true,\n        \"changedAt\": \"2023-02-20T13:42:07.118Z\"\n      },\n      \"resume\": {\n        \"loginTokens\": [\n          {\n            \"when\": \"2023-09-16T09:27:10.959Z\",\n            \"hashedToken\": \"A1jmsVCHHH2SkXHrEJDfumN+VtUP3tcuJ/OGseGrRbA=\",\n            \"twoFactorAuthorizedHash\": \"3067196228a830eacd6181a6977fe86a\",\n            \"twoFactorAuthorizedUntil\": \"2023-09-19T16:40:58.767Z\"\n          },\n          {\n            \"when\": \"2023-09-18T10:37:58.218Z\",\n            \"hashedToken\": \"RLdxvu9dDnk6QRwFdaK3my1AoPeGaR5lTkK+zEhTuPk=\"\n          },\n          {\n            \"when\": \"2023-09-18T10:41:25.814Z\",\n            \"hashedToken\": \"zWZ8wW9PNlVuI2Q65vK/9vytaONk1BXxaWcNld4qvEc=\"\n          }\n        ]\n      },\n      \"email\": {\n        \"verificationTokens\": [\n          {\n            \"token\": \"lHq_4L8Orgxu2p5NhfVb0V9kA7kO1VaBXA5GmaJiuX3\",\n            \"address\": \"test@test.com\",\n            \"when\": \"2023-05-23T18:47:07.142Z\"\n          }\n        ]\n      },\n      \"totp\": {\n        \"enabled\": false\n      },\n      \"passwordHistory\": [\n        \"$2b$10$n1.FV8S2mxz7GzXA392V5OaDa5X0WR1DQ4eGGFKI/wpdhS9sVIC6S\",\n        \"$2b$10$4I68O5mlR.C8dRhtZ4Mj6us6EMwRHNIUqEWQe/nOhISs4e8RtOliW\",\n        \"$2b$10$AU9Ncfd8bO5TpE.5iLMjyujdd6RVJaoeKckVqo3MMO9Ngc3oyMAs2\"\n      ]\n    },\n    \"username\": \"roxie\",\n    \"emails\": [\n      {\n        \"address\": \"test@test.com\",\n        \"verified\": true\n      }\n    ],\n    \"type\": \"user\",\n    \"status\": \"offline\",\n    \"active\": true,\n    \"_updatedAt\": \"2023-09-19T16:10:58.873Z\",\n    \"__rooms\": [\n      \"GENERAL\",\n      \"siyr2oWQJBjQjhLwr\",\n      \"6GFJ3tbmHiyHbahmC\",\n      \"64f0f82c2c26843a68c1f7ba\"\n    ],\n    \"roles\": [\n      \"user\",\n      \"admin\",\n      \"livechat-agent\",\n      \"livechat-manager\"\n    ],\n    \"name\": \"test test\",\n    \"settings\": {\n      \"preferences\": {\n        \"themeAppearence\": \"light\"\n      },\n      \"profile\": {}\n    },\n    \"lastLogin\": \"2023-09-19T16:00:19.657Z\",\n    \"statusConnection\": \"away\",\n    \"utcOffset\": 1,\n    \"banners\": {\n      \"versionUpdate-6_0_0\": {\n        \"id\": \"versionUpdate-6_0_0\",\n        \"priority\": 10,\n        \"title\": \"Update_your_RocketChat\",\n        \"text\": \"New_version_available_(s)\",\n        \"textArguments\": [\n          \"6.0.0\"\n        ],\n        \"link\": \"https://github.com/RocketChat/Rocket.Chat/releases/tag/6.0.0\",\n        \"modifiers\": [],\n        \"read\": true\n      },\n      \"versionUpdate-6_2_8\": {\n        \"id\": \"versionUpdate-6_2_8\",\n        \"priority\": 10,\n        \"title\": \"Update_your_RocketChat\",\n        \"text\": \"New_version_available_(s)\",\n        \"textArguments\": [\n          \"6.2.8\"\n        ],\n        \"link\": \"https://github.com/RocketChat/Rocket.Chat/releases/tag/6.2.8\",\n        \"modifiers\": []\n      }\n    },\n    \"statusDefault\": \"offline\",\n    \"st\n  ... (truncated)\n```"
