          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: Body parameter "password" is required.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/users.createToken:
    post:
      tags:
      - Users
      summary: Create Users Token
      description: "As a workspace admin, you can create temporary authentication tokens for users. This is the same type of session authentication token a user gets via <a href=\"https://developer.rocket.chat/apidocs/login-with-username-and-password\" target=\"_blank\">login</a> and expires the same way.\n* To use this endpoint, you must set a secret with the `CREATE_TOKENS_FOR_USERS_SECRET` <a href=\"https://docs.rocket.chat/docs/deployment-environment-variables\" target=\"_blank\">environment variable</a> in your deployment configuration. This secret will be used to authorize all requests made to this endpoint.\n* For SaaS workspaces, <a href=\"https://desk.rocket.chat/portal/en/signin\" target=\"_blank\">contact</a> support to set this variable.\n* Permission required: `user-generate-access-token`. This permission is required only when you generate a token for another user; it is not required when you generate a token for your own account.\n* The maximum number of login tokens per user is 50. See this <a href='https://github.com/RocketChat/Rocket.Chat/pull/32216' target='_blank'>GitHub PR</a> for details.\n  \n### Changelog\n  | Version      | Description |\n  | ---------------- | ------------|\n  |8.7.0             | Enforced the `user-generate-access-token` permission when generating a token for another user.|\n  |8.0.0             | Added `CREATE_TOKENS_FOR_USERS_SECRET` <a href=\"https://docs.rocket.chat/docs/deployment-environment-variables\" target=\"_blank\">environment variable</a> to define a shared secret that will be used to authorize this endpoint.|\n  |2.1.0            | Added ENV VAR to be able to use this endpoint (process.env.CREATE_TOKENS_FOR_USERS).       |\n  |0.56.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.createToken \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"userId\": \"BsNr28znDkG8aeo7W\",\n  \"secret\": \"pass123\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"data\": {\n    \"userId\": \"BsNr28znDkG8aeo7W\",\n    \"authToken\": \"2jdk99wuSjXPO201XlAks9sjDjAhSJmskAKW301mSuj9Sk\"\n  },\n  \"success\": true\n}\n```"
      operationId: post-api-v1-users.createToken
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: The ID of the user you want to generate a token for.
                  example: BsNr28znDkG8aeo7W
                secret:
                  type: string
                  description: The secret defined in the `CREATE_TOKENS_FOR_USERS_SECRET` <a href="https://docs.rocket.chat/docs/deployment-environment-variables" target="_blank">environment variable</a>. Without the valid secret, you can't access this endpoint.
                  example: pass123
              required:
              - userId
              - secret
            examples:
