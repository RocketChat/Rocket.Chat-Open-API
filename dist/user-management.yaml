                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      authToken:
                        type: string
                  success:
                    type: boolean
              examples:
                Token created:
                  value:
                    data:
                      userId: BsNr28znDkG8aeo7W
                      authToken: 2jdk99wuSjXPO201XlAks9sjDjAhSJmskAKW301mSuj9Sk
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
