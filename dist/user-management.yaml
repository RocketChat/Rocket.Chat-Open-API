      - name: freeSwitchExtension
        in: query
        required: false
        description: The FreeSwitch voice call extension assigned to the user. Alternatively, you can use `userId`, `username`, `importId`, or `email` to retrieve user information.
        schema:
          type: string
        example: '1234'
      responses:
        '200':
          description: OK
          content:
