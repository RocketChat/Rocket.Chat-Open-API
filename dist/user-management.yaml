      description: "Ensure that you have configured the <a href='https://docs.rocket.chat/docs/email' target='_blank'>email settings</a> in your workspace to send emails. \n\nPermission required: `send-mail`\n\n### Changelog\n| Version      | Description |\n| ------------ | ------------|\n|6.8.0         | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.sendWelcomeEmail \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"email\": \"test@email.com\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      operationId: get-api-v1-users.sendWelcomeEmail
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The user's email address to which you want to send the welcome email.
              required:
              - email
            examples:
              Example 1:
                value:
                  email: test@email.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
              examples:
                SMPT not configured:
                  value:
                    success: false
                    error: SMTP is not configured [error-email-send-failed]
                    errorType: error-email-send-failed
                    details:
                      method: sendWelcomeEmail
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
