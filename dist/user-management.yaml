  /api/v1/users.setStatus:
    post:
      summary: Set User Status
      operationId: post-api-v1-users.setStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Missing status or message parameter:
                  value:
                    success: false
                    error: 'Match error: Failed Match.OneOf, Match.Maybe or Match.Optional validation'
                Invalid expiresAt date:
                  value:
                    success: false
                    error: expiresAt must be a future date [error-invalid-date]
                    errorType: error-invalid-date
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      description: "* You can set the status for yourself or another user. The `AllowUserStatusMessageChange` setting must be enabled in the `Accounts` workspace settings.\n* To change another user's status, you must have the `edit-other-user-info` permission.\n* According to your workspace settings (under **Accounts**), you will only be able to set the invisible or `offline` status if the `Allow Invisible status option` setting is enabled.\n  \n  ### Changelog\n  | Version      | Description |\n  | ---------------- | ------------|\n  |8.6.0            | Added `expiresAt` request parameter for timed status expiration. |\n  |1.2.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.setStatus \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"message\": \"My status update\",\n  \"status\": \"online\",\n  \"expiresAt\": \"2026-06-22T18:00:00.000Z\",\n  \"userId\": \"zXuq7SvPKYbzYmfpo\",\n  \"username\": \"bob\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The user's status message. At least one of the `message` or `status` parameters is required.
                  example: My status update
                status:
                  type: string
                  description: The user's status like `online`, `away`, `busy`, or `offline`. At least one of the `message` or `status` parameters is required.
                  example: online
                expiresAt:
                  type: string
                  description: Date as an ISO 8601 string. Sets an expiration time for the status. When this time passes, the presence engine restores the user's previous status. Must be a future date. Omit this parameter to keep the status until it is changed again.
                  example: '2026-06-22T18:00:00.000Z'
                userId:
                  type: string
                  example: zXuq7SvPKYbzYmfpo
                  description: The user ID for which you want to set the status. You don't need to add this if you are setting the status for yourself. Alternatively, you can use the `username` parameter and enter the username for which you want to set the status.
            examples:
              Example 1:
                value:
                  message: My status update
                  status: online
                  expiresAt: '2026-06-22T18:00:00.000Z'
                  userId: zXuq7SvPKYbzYmfpo
                  username: bob
      tags:
      - Users
  /api/v1/users.getStatus:
    get:
      tags:
      - Users
      summary: Get Status
      description: "Gets a user's status in your workspace.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.6.0            | Added `statusSource` and `statusExpiresAt` response fields. |\n|1.2.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/users.getStatus?userId=W7NHuX5ri2e3mu2Fc'\n```\n\n### Example success response\n\n```json\n{\n  \"_id\": \"W7NHuX5ri2e3mu2Fc\",\n  \"connectionStatus\": \"online\",\n  \"status\": \"online\",\n  \"statusSource\": \"manual\",\n  \"statusExpiresAt\": \"2026-06-22T18:00:00.000Z\",\n  \"success\": true\n}\n```"
      operationId: get-api-v1-users.getStatus
      parameters:
      - name: userId
        in: query
        description: 'The `userId` of the user. Alternatively, you can use the `username` property and value. If the value is not provided, the authenticated user is used. '
        schema:
          type: string
        example: W7NHuX5ri2e3mu2Fc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: The user ID.
                  connectionStatus:
                    type: string
                    description: The connection status. Returned when requesting the authenticated user's own status.
                  status:
                    type: string
                  statusSource:
                    type: string
                    description: The claim that set the current status. One of `internal`, `manual`, or `external`. Omitted when the user has no recorded status source.
                  statusExpiresAt:
                    type: string
                    description: Date as an ISO 8601 string indicating when the current status expires. Omitted when the status has no expiration.
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    _id: W7NHuX5ri2e3mu2Fc
                    connectionStatus: online
                    status: online
                    statusSource: manual
                    statusExpiresAt: '2026-06-22T18:00:00.000Z'
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
