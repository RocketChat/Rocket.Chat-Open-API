  /api/v1/users.generatePersonalAccessToken:
    parameters: []
    post:
      summary: Generate Personal Access Token
      operationId: post-api-v1-users.generatePersonalAccessToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    token: 2jdk99wuSjXPO201XlAks9sjDjAhSJmskAKW301mSuj9Sk
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      codeGenerated:
                        type: boolean
                      availableMethods:
                        type: array
                        items:
                          type: object
                          properties: {}
              examples:
                Example 1:
                  value:
                    success: false
                    error: TOTP Required [totp-required]
                    errorType: totp-required
                    details:
                      method: password
                      codeGenerated: false
                      availableMethods: []
                Example 2:
                  value:
                    success: false
                    error: The 'tokenName' param is required
                Example 3:
                  value:
                    success: false
                    error: Not Authorized [not-authorized]
                    errorType: not-authorized
                    details:
                      method: personalAccessTokens:generateToken
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      description: "Permission required: `create-personal-access-tokens`. \n\n* This endpoint requires <a href=\"https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication\" target=\"_blank\">two-factor authentication</a>.\n\n* Note that the generated access tokens are irrecoverable, so storing them safely is essential. If a token is lost or forgotten, it can be regenerated or deleted.\n* When making calls to the API that mandate authentication, include the generated token in the `X-Auth-Token` header and your user ID in the `X-User-Id` header to authenticate the requests.\nVisit the <a href=\"https://docs.rocket.chat/docs/manage-personal-access-tokens\" target=\"_blank\"> Personal Access Token user guide</a> for more details.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|3.1.0            | Added `bypassTwoFactor` param       |\n|0.69.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.generatePersonalAccessToken \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"tokenName\": \"mypersonaltoken\",\n  \"bypassTwoFactor\": false\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"token\": \"2jdk99wuSjXPO201XlAks9sjDjAhSJmskAKW301mSuj9Sk\",\n  \"success\": true\n}\n```"
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: x-2fa-code
        in: header
        description: Enter the 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
        schema:
          type: string
        example: '148750'
      - name: x-2fa-method
        in: header
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenName:
                  type: string
                  description: The name of the token.
                bypassTwoFactor:
                  type: boolean
                  description: If 2FA requirement should be ignored when using this token.
                  default: false
              required:
              - tokenName
            examples:
              Example 1:
                value:
                  tokenName: mypersonaltoken
                  bypassTwoFactor: false
      tags:
      - Users
