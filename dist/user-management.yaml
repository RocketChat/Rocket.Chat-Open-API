      tags:
      - Users
      summary: Delete Own Account
      description: "Deletes your own user account. Requires the `Allow Users to Delete Own Account` setting enabled. Access this setting from **Manage** > **Workspace** > **Settings** > **Accounts**.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|3.7.0            | Added `confirmRelinquish` to the payload.       |\n|0.67.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.deleteOwnAccount \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"password\": \"8f0e2f76e22b43e2855189877e7dc1e1e7d98c226c95db247cd1d547928334a9\",\n  \"confirmRelinquish\": false\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
