      description: "Get a user's presence in the workspace (offline, busy, active, or away).\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.49.0            | Updated to support `userId` or `username`       |\n|0.48.0            | Renamed to `users.getPresence`       |\n|0.35.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/users.getPresence?userId=BsNr28znDkG8aeo7W' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"presence\": \"offline\",\n  \"success\": true\n}\n```"
  /api/v1/users.presence:
    get:
      summary: Get Users Presence
      operationId: get-api-v1-users.presence
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        name:
                          type: string
                        username:
                          type: string
                        status:
                          type: string
                        utcOffset:
                          type: integer
                        statusText:
                          type: string
                          description: The user's status message.
                        statusSource:
                          type: string
                          description: 'The claim that set the user''s current status. One of `internal`, `manual`, or `external` (priority order: `internal` > `manual` > `external`). Omitted when the user has no recorded status source.'
                        statusExpiresAt:
                          type: string
                          description: Date as an ISO 8601 string indicating when the user's current status expires. Omitted when the status has no expiration.
                        avatarETag:
                          type: string
                  full:
                    type: boolean
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    users:
                    - _id: rocket.cat
                      name: Rocket.Cat
                      username: rocket.cat
                      status: online
                      utcOffset: 0
                      statusText: In a call
                      statusSource: internal
                      avatarETag: 5BB9B5ny5DkKdrwkq
                    - _id: rocketchat.internal.admin.test
                      name: RocketChat Internal Admin Test
                      username: rocketchat.internal.admin.test
                      status: online
                      utcOffset: -2
                      statusText: Focus time
                      statusSource: manual
                      statusExpiresAt: '2026-06-22T18:00:00.000Z'
                      avatarETag: iEbEm4bTT327NJjXt
                    full: true
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - schema:
          type: string
        example: '2019-05-22T12:11:45.392Z'
        in: query
        name: from
        description: 'The last date when the status was changed. Format: ISO 8601 datetime. Timezone, milliseconds and seconds are optional. If you don''t pass `from` parameter, you''ll get a list of all users'' presence and the result will have a `full` field with value `true` .'
      - schema:
          type: string
        example: J4sWseCgs8eEnWvhE,BsNr28znDkG8aeo7W
        in: query
        name: ids
        description: 'The user IDs whose presence you want. Provide one or more IDs using any of these formats:

          * `?ids=userId1` — single ID

          * `?ids=userId1,userId2` — comma-separated string

          * `?ids=userId1&ids=userId2` — repeated query parameter'
      description: "Get presence of multiple workspace users. You can filter by date and user IDs.\nIf the `Presence_broadcast_disabled` setting is true, the endpoint returns an empty array. You can find this setting under **Manage** > **Workspace** > **Settings** > **Troubleshoot**.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.6.0            | Added `statusSource` and `statusExpiresAt` to returned user objects. |\n|8.5.0            | Restored comma-separated `ids` query parameter support.       |\n|1.1.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/users.presence?from=2019-05-22T12:11:45.392Z&ids=J4sWseCgs8eEnWvhE,BsNr28znDkG8aeo7W' \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\"\n```\n\n### Example success response\n\n```json\n{\n  \"users\": [\n    {\n      \"_id\": \"rocket.cat\",\n      \"name\": \"Rocket.Cat\",\n      \"username\": \"rocket.cat\",\n      \"status\": \"online\",\n      \"utcOffset\": 0,\n      \"statusText\": \"In a call\",\n      \"statusSource\": \"internal\",\n      \"avatarETag\": \"5BB9B5ny5DkKdrwkq\"\n    },\n    {\n      \"_id\": \"rocketchat.internal.admin.test\",\n      \"name\": \"RocketChat Internal Admin Test\",\n      \"username\": \"rocketchat.internal.admin.test\",\n      \"status\": \"online\",\n      \"utcOffset\": -2,\n      \"statusText\": \"Focus time\",\n      \"statusSource\": \"manual\",\n      \"statusExpiresAt\": \"2026-06-22T18:00:00.000Z\",\n      \"avatarETag\": \"iEbEm4bTT327NJjXt\"\n    }\n  ],\n  \"full\": true,\n  \"success\": true\n}\n```"
      tags:
      - Users
  /api/v1/users.delete:
    post:
      tags:
      - Users
      summary: Delete User
      description: "Permanently deletes an existing user from your workspace. Permission required: `delete-user`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|3.7.0            | Added `confirmRelinquish` to the payload.       |\n|0.35.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.delete \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"userId\": \"BsNr28znDkG8aeo7W\",\n  \"confirmRelinquish\": true\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true,\n  \"deletedRooms\": []\n}\n```"
      operationId: post-api-v1-users.delete
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: string
                  example: BsNr28znDkG8aeo7W
                  description: The `userId` of the user. Alternatively, you can use the `username` property and value.
                confirmRelinquish:
                  type: boolean
                  description: Deletes the user, even if they are the last owner of a room. By default, it is set to `false`.
                  default: false
            examples:
              Example:
                value:
                  userId: BsNr28znDkG8aeo7W
                  confirmRelinquish: true
      responses:
        '200':
          description: OK
