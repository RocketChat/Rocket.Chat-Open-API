  /api/v1/users.list:
    get:
      tags:
      - Users
      summary: Get Users List
      description: "- Gets all of the users in the system and their information. The result is limited to what the request sender has permission to view.\n- This endpoint supports filtering users using the `query` parameter. It can be used to locate a user record and retrieve the corresponding `userId` for use with the `users.info` endpoint.\n- The `query` parameter is considered unsafe and is deprecated. Its support is expected to be removed in a future major version. There is currently no direct replacement for email-based user lookup.\n\n**Permissons required**:\n- `view-d-room`: Required to view direct messages\n- `view-full-other-user-info`: Required to view complete user information (e.g., account creation date, last login)\n- `view-outside-room`: (Only required if the setting `Apply_permission_view-outside-room` is enabled on under **Settings** > **General** > **Rest API**). Required to view rooms that the user is not a member of.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.4.0             | Added `email` query parameter for filtering |\n|0.49.0            | `Count` and `offset` query parameters supported.       |\n|0.35.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/users.list?offset=50&count=50&sort=example&email=user@example.com' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"users\": [\n    {\n      \"_id\": \"DGsmi2J4WjizYn7jc\",\n      \"username\": \"uniqueusername\",\n      \"emails\": [\n        {\n          \"address\": \"email@user.tld\",\n          \"verified\": false\n        }\n      ],\n      \"type\": \"user\",\n      \"status\": \"offline\",\n      \"active\": true,\n      \"roles\": [\n        \"bot\",\n        \"user\"\n      ],\n      \"name\": \"name\",\n      \"nameInsensitive\": \"name\"\n    },\n    {\n      \"_id\": \"uZ5JvvioeHK8Coyqe\",\n      \"active\": true,\n      \"type\": \"user\",\n      \"status\": \"offline\",\n      \"roles\": [\n        \"anonymous\",\n        \"user\"\n      ],\n      \"lastLogin\": \"2023-05-16T20:50:33.579Z\",\n      \"username\": \"user-0\",\n      \"nameInsensitive\": \"\"\n    },\n    {\n      \"_id\": \"aspKK7FHe7iQgzexX\",\n      \"active\": true,\n      \"type\": \"user\",\n      \"status\": \"offline\",\n      \"roles\": [\n        \"anonymous\",\n        \"user\"\n      ],\n      \"lastLogin\": \"2023-05-12T10:44:46.703Z\",\n      \"username\": \"user-00\",\n      \"name\": \"User 00\",\n      \"emails\": [\n        {\n          \"address\": \"user00@mail.cm\",\n          \"verified\": false\n        }\n      ],\n      \"nameInsensitive\": \"user 00\"\n    }\n  ],\n  \"count\": 3,\n  \"offset\": 0,\n  \"total\": 3,\n  \"success\": true\n}\n```"
      operationId: get-api-v1-users.list
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: query
        in: query
        required: false
        schema: {}
        description: 'This parameter allows you to use [MongoDB query](https://www.mongodb.com/docs/manual/reference/operator/query/) operators to search for specific data. For example, to query users with a name that contains the letter "g": query=`{ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more. '
        allowEmptyValue: false
      - name: fields
        in: query
        required: false
        schema: {}
        description: ' This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: fields=`{ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: Number of items to "skip" in the query, i.e. requests return count items, skipping the first offset items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: How many items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - schema:
          type: string
        in: query
        name: sort
        description: 'Sort the users in ascending (`1`) or descending (`-1`) order. The value must be entered as a JSON string. The options are as follows: * `status`: Sort by users'' status. For example, `sort={"status":1}` (this maps to the `active` status). * `createdAt`: Sort by the time of user creation. For example, `sort={"createdAt":-1}` * `name`: Sort by user name. For example, `sort={"name":1}`'
      - name: email
        in: query
        required: false
        description: 'Filter users by email address. Minimum length: 1 character.'
        schema:
          type: string
          minLength: 1
          nullable: true
        example: user@example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        username:
                          type: string
                        emails:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                              verified:
                                type: boolean
                        type:
                          type: string
                        status:
                          type: string
                        active:
                          type: boolean
                        roles:
                          type: array
                          items:
                            type: string
                        name:
                          type: string
                        lastLogin:
                          type: string
                        nameInsensitive:
                          type: string
                        avatarETag:
                          type: string
                  count:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    users:
                    - _id: DGsmi2J4WjizYn7jc
                      username: uniqueusername
                      emails:
                      - address: email@user.tld
                        verified: false
                      type: user
                      status: offline
                      active: true
                      roles:
                      - bot
                      - user
                      name: name
                      nameInsensitive: name
                    - _id: uZ5JvvioeHK8Coyqe
                      active: true
                      type: user
                      status: offline
                      roles:
                      - anonymous
                      - user
                      lastLogin: '2023-05-16T20:50:33.579Z'
                      username: user-0
                      nameInsensitive: ''
                    - _id: aspKK7FHe7iQgzexX
                      active: true
                      type: user
                      status: offline
                      roles:
                      - anonymous
                      - user
                      lastLogin: '2023-05-12T10:44:46.703Z'
                      username: user-00
                      name: User 00
                      emails:
                      - address: user00@mail.cm
                        verified: false
                      nameInsensitive: user 00
                    count: 3
                    offset: 0
                    total: 3
                    success: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
  /api/v1/users.setAvatar:
    post:
      summary: Set User Avatar
      operationId: post-api-v1-users.setAvatar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              examples:
                Success:
                  value:
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: Missing Content-Type
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
      description: "Use this endpoint to change your or another user's avatar. You can change avatars only if the `AllowUserAvatarChange` setting under **Accounts** is enabled. To change another user's avatar, you need the permission: `edit-other-user-avatar`.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.7.0             | Added optional `service` multipart field (stored as `avatarOrigin`)       |\n|0.56.0            | Add support for `username` argument.       |\n|0.48.0            | Set other users avatars if the callee has permission.       |\n|0.46.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.setAvatar \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"avatarUrl\": \"http://domain.tld/to/my/own/avatar.jpg\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  description: Enter the image URL you want to set as the user avatar.
                  example: http://domain.tld/to/my/own/avatar.jpg
                userId:
                  type: string
                  description: The ID or username of the user. If not provided, the avatar of the user who is sending the request is updated. Alternatively, you can enter the `username` parameter.
              required:
              - avatarUrl
            examples:
              Example:
                value:
                  avatarUrl: http://domain.tld/to/my/own/avatar.jpg
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to upload as the new avatar.
                service:
                  type: string
                  description: 'Optional. The name of the OAuth/external service the avatar originates from (e.g. `google`, `facebook`, `gravatar`). Stored as `avatarOrigin`. '
                  example: google
                userId:
                  type: string
                  description: The ID or username of the user. If not provided, the avatar of the user who is sending the request is updated.
              required:
              - image
            examples:
              Example:
                value:
                  image: '@my-own-avatar.png'
                  service: google
        description: "You have two options to set the user avatar:\n  * Upload the image file to use as the new avatar, as form-data. For example, `image=@my-own-avatar.png`. Optionally include a `service` field to record which OAuth/external service the avatar came from (stored as `avatarOrigin`).\n  * Enter the image URL you want to set as the user avatar in the request body, using the parameter `avatarUrl`."
      tags:
      - Users
