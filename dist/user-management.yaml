                Invalid secret:
                  value:
                    success: false
                    error: Not authorized [error-not-authorized]
                    errorType: error-not-authorized
                Missing permission:
                  value:
                    success: false
                    error: Not authorized [error-not-authorized]
                    errorType: error-not-authorized
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
    parameters: []
