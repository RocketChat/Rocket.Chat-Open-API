                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: must have required property 'daysIdle' [invalid-params]
                    errorType: invalid-params
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
              examples:
                Permission Error:
                  value:
                    success: false
                    error: unauthorized
      description: "Automatically deactivate idle users in your workspace based on the number of days and roles.\n\nFor every user that this endpoint deactivates, Rocket.Chat clears the user's login tokens and revokes their OAuth access tokens, refresh tokens, and authorization codes. Deactivated users can no longer call the REST API with previously issued OAuth credentials.\n\nPermission required: `edit-other-user-active-status`\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|8.5.0            | Added login and OAuth token revocation for users deactivated by this endpoint. |\n|3.1.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.deactivateIdle \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -d '{\n  \"daysIdle\": 2,\n  \"role\": \"user\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"count\": 1,\n  \"success\": true\n}\n```"
      parameters:
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                daysIdle:
                  type: integer
                  description: The number of days that the user is idle.
                  example: 2
                role:
                  type: string
                  description: The user role.
                  example: admin
                  default: user
              required:
              - daysIdle
            examples:
              Example 1:
                value:
                  daysIdle: 2
                  role: user
      tags:
      - Users
