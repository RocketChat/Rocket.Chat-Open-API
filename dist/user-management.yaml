          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: Enter the user ID to be logged out.
  /api/v1/ldap.syncNow:
    post:
      tags:
      - LDAP
      summary: LDAP Sync
      description: "<div style=\"text-align: center; margin: 1rem 0 1rem 0;\"><img src=\"https://raw.githubusercontent.com/RocketChat/Rocket.Chat-Open-API/main/images/premium.svg\" alt=\"Premium tag\" style=\"display: block; margin: auto;\"></div>\n\nSyncs your <a href=\"https://docs.rocket.chat/use-rocket.chat/authentication/ldap\" target=\"_blank\">LDAP data</a> based on the <a href=\"https://docs.rocket.chat/use-rocket.chat/authentication/ldap/ldap-data-sync-settings\" target=\"_blank\">data sync configurations</a>. This endpoints requires 2FA.\n\nMake sure LDAP is enabled in **Settings** > **LDAP** > **Enable** before using this endpoint.\n\nPermission required: `sync-auth-services-users`.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|5.2.0            | Include `syncAvatars`       |\n|4.0.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/ldap.syncNow \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"message\": \"Sync_in_progress\",\n  \"success\": true\n}\n```"
      operationId: post-api-v1-ldap.syncNow
      parameters:
      - name: X-Auth-Token
        in: header
        description: The authenticated user token.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The authenticated user ID.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: x-2fa-code
        in: header
        description: Enter the 2FA code. This parameter is required if 2FA is enabled in your workspace. See the <a href="https://developer.rocket.chat/apidocs/introduction-to-two-factor-authentication" target="_blank">Introduction to Two-Factor Authentication</a> document for details.
        schema:
          type: string
        example: '148750'
      - name: x-2fa-method
        in: header
        schema:
          type: string
        description: Enter the method with which you get the 2FA code. It can be `email`, `totp`, or `password`. This parameter is required if 2FA is enabled in your workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
              examples:
                Success Example:
                  value:
                    message: Sync_in_progress
                    success: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  errorType:
                    type: string
                  details:
                    type: object
                    properties:
                      method:
                        type: string
                      codeGenerated:
                        type: boolean
                      availableMethods:
                        type: array
                        items:
                          type: string
              examples:
                Example 1:
                  value:
                    success: false
                    error: TOTP Required [totp-required]
                    errorType: totp-required
                    details:
                      method: totp
                      codeGenerated: false
                      availableMethods:
                      - totp
                Example 2:
                  value:
                    success: false
                    error: LDAP_disabled
                Example 3:
                  value:
                    success: false
                    error: error-not-authorized
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
              examples:
                Authorization Error:
                  value:
                    status: error
                    message: You must be logged in to do this.
