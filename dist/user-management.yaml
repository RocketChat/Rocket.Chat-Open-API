      description: "Send an email to reset your password. Ensure that you have completed the configuration of the email; otherwise, your users will not receive the mail normally. Access this from **Manage** > **Workspace** > **Settings** > **Email**.\n\nTo use this endpoint, the `PasswordReset` setting must be enabled in **Settings** > **Accounts** > **Registration** > **Password Reset**.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|0.64.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/users.forgotPassword \\\n     -H \"Content-Type: application/json\" \\\n     -d '{\n  \"email\": \"email@rocket.cat\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"status\": \"success\"\n}\n```"
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The email to send password reset link.
                  example: email@rocket.cat
              required:
              - email
            examples:
              Example 1:
                value:
                  email: email@rocket.cat
      tags:
      - Users
