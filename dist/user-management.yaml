      description: "Report a user for offensive messages in the workspace.\n\n### Changelog\n| Version      | Description |\n| ---------------- | ------------|\n|6.4.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X POST https://<your-workspace-url>/api/v1/moderation.reportUser \\\n     -H \"Content-Type: application/json\" \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\" \\\n     -d '{\n  \"userId\": \"ByehQjC44FwMeiLbX\",\n  \"description\": \"test\"\n}'\n```\n\n### Example success response\n\n```json\n{\n  \"success\": true\n}\n```"
