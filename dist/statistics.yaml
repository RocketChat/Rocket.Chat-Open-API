openapi: 3.0.0
info:
  version: 1.0.0
  title: Statistics
servers:
- url: https://apiexplorer.support.rocket.chat
paths:
  /api/v1/statistics.list:
    get:
      tags:
      - Statistics
      summary: Get Statistics List
      description: "Get statistics about the Rocket.Chat workspace. \n\nPermission required: `view-statistics` \n\n### Changelog\n| Version      | Description | \n| ---------------- | ------------|\n|8.7.0             | Added the `fips` field to statistics records. |        \n|0.51.0            | Added       |\n\n### Example call\n\n```bash\ncurl -X GET 'https://<your-workspace-url>/api/v1/statistics.list?count=50&offset=1' \\\n     -H \"X-Auth-Token: your-auth-token\" \\\n     -H \"X-User-Id: your-user-id\"\n```\n\n### Example success response\n\n```json\n{\n  \"statistics\": [\n    {\n      \"_id\": \"6a708537c8fc3c65b1808baf\",\n      \"wizard\": {\n        \"organizationType\": \"\",\n        \"industry\": \"\",\n        \"size\": \"\",\n        \"country\": \"\",\n        \"language\": \"\",\n        \"serverType\": \"\",\n        \"registerServer\": false\n      },\n      \"uniqueId\": \"2d3ad4fb-d515-4f09-8f02-0f186c8cc929\",\n      \"installedAt\": \"2026-08-03T12:10:10.817Z\",\n      \"deploymentFingerprintHash\": \"\",\n      \"deploymentFingerprintVerified\": true,\n      \"version\": \"8.7.0-rc.3\",\n      \"tag\": null,\n      \"branch\": null,\n      \"totalUsers\": 0,\n      \"activeUsers\": 0,\n      \"activeGuests\": 0,\n      \"nonActiveUsers\": 0,\n      \"appUsers\": 0,\n      \"onlineUsers\": 0,\n      \"awayUsers\": 0,\n      \"busyUsers\": 0,\n      \"totalConnectedUsers\": 0,\n      \"offlineUsers\": 0,\n      \"userLanguages\": {\n        \"none\": 0\n      },\n      \"totalRooms\": 0,\n      \"totalChannels\": 0,\n      \"totalPrivateGroups\": 0,\n      \"totalDirect\": 0,\n      \"totalLivechat\": 0,\n      \"totalDiscussions\": 0,\n      \"totalThreads\": 0,\n      \"totalLivechatVisitors\": 0,\n      \"totalLivechatAgents\": 0,\n      \"totalLivechatManagers\": 0,\n      \"livechatEnabled\": true,\n      \"isDepartmentRemovalEnabled\": false,\n      \"omnichannelSources\": [],\n      \"totalLivechatRoomsWithDepartment\": 0,\n      \"departments\": 0,\n      \"totalTriggers\": 0,\n      \"archivedDepartments\": 0,\n      \"totalCustomFields\": 0,\n      \"totalLivechatPublicCustomFields\": 0,\n      \"livechatAutomaticForwardingUnansweredChats\": true,\n      \"routingAlgorithm\": \"Auto_Selection\",\n      \"onHoldEnabled\": null,\n      \"lastChattedAgentPreferred\": null,\n      \"assignNewConversationsToContactManager\": null,\n      \"visitorAbandonment\": null,\n      \"emailInboxes\": 0,\n      \"BusinessHours\": {\n        \"total\": 0,\n        \"strategy\": \"\"\n      },\n      \"chatsOnHold\": 0,\n      \"uniqueContactsOfLastMonth\": {\n        \"contactsCount\": 0,\n        \"conversationsCount\": 0,\n        \"sources\": []\n      },\n      \"omnichannelContactsBySource\": {\n        \"contactsCount\": 0,\n        \"conversationsCount\": 0,\n        \"sources\": []\n      },\n      \"totalChannelMessages\": 0,\n      \"uniqueContactsOfYesterday\": {\n        \"contactsCount\": 0,\n        \"conversationsCount\": 0,\n        \"sources\": []\n      },\n      \"uniqueContactsOfLastWeek\": {\n        \"contactsCount\": 0,\n        \"conversationsCount\": 0,\n        \"sources\": []\n      },\n      \"totalPrivateGroupMessages\": 0,\n      \"totalDiscussionsMessages\": 0,\n      \"totalDirectMessages\": 0,\n      \"totalLivechatMessages\": 0,\n      \"totalMessages\": 0,\n      \"lastLogin\": \"\",\n      \"lastMessageSentAt\": null,\n      \"lastSeenSubscription\": \"\",\n      \"os\": {\n        \"type\": \"Linux\",\n        \"platform\": \"linux\",\n        \"arch\": \"x64\",\n        \"release\": \"6.17.0-1017-aws\",\n        \"uptime\": 2119.94,\n        \"loadavg\": [\n          6.92,\n          5.81,\n          3.52\n        ],\n        \"totalmem\": 8220839936,\n        \"freemem\": 3768729600,\n        \"cpus\": [\n          {\n            \"model\": \"AMD EPYC 7571\",\n            \"sp\n  ... (truncated)\n```"
      operationId: get-api-v1-statistics.list
      parameters:
      - name: X-Auth-Token
        in: header
        description: The token of the authenticated user.
        required: true
        schema:
          type: string
        example: RScctEHSmLGZGywfIhWyRpyofhKOiMoUIpimhvheU3f
      - name: X-User-Id
        in: header
        description: The user ID of the authenticated user.
        required: true
        schema:
          type: string
        example: rbAXPnMktTFbNpwtJ
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 50
        description: The number of items to return. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Number of items to "skip" in the query, i.e. requests return `count` items, skipping the first `offset` items. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.
      - name: sort
        in: query
        required: false
        schema: {}
        description: 'List of fields to order by, and in which direction. JSON object, with properties listed in desired order, with values of 1 for ascending, or -1 for descending. For example, `{"value": -1, "_id": 1}`.  Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#pagination) to learn more.'
      - name: fields
        in: query
        required: false
        schema: {}
        description: 'This parameter accepts a JSON object with properties that have a value of 1 or 0 to include or exclude them in the response. For example, to only retrieve the usernames of users: fields=`{ "username": 1 }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
      - name: query
        in: query
        required: false
        schema: {}
        description: 'This parameter allows you to use MongoDB query operators to search for specific data. For example, to query users with a name that contains the letter "g": query=`{ "name": { "$regex": "g" } }`. Refer to the [official documentation](https://developer.rocket.chat/apidocs/query-parameters#query-and-fields) to learn more.'
